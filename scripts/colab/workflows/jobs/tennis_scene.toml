schema_version = 1
name = "tennis_scene"
description = "Run the integrated multiview tennis-scene reconstruction pipeline."
accelerator = "gpu"
timeout_seconds = 86400
setup = ["base", "submodules", "cuda_ops"]
protected_override_keys = [
  "paths.data_root",
  "paths.checkpoint_root",
  "paths.artifact_root",
  "paths.output_root",
  "paths.external_asset_root",
  "video_paths",
  "camera_ids",
  "output_name",
  "output_directory",
  "device",
  "court_kp.checkpoint",
  "people_models.dino_checkpoint",
  "people_models.dino_repository",
  "people_models.vitpose_checkpoint",
  "people_models.hmr2_checkpoint",
  "people_models.gvhmr_checkpoint",
  "people_models.body_models_dir",
  "ball_detection.checkpoint",
  "plcs_association.checkpoint",
  "blcs_association.checkpoint",
  "cache.directory",
]
outputs = ["outputs/colab/tennis_scene"]

[command]
module = "src.tennis_scene.scripts.run_pipeline"
args = [
  "paths.output_root=outputs/colab",
  "paths.artifact_root=outputs/colab",
  "output_name=run",
  "device=cuda",
  "output_directory=tennis_scene",
]

[[inputs]]
source = "data/samples"
destination = "data/samples"
writable = false

[[inputs]]
source = "ckpt"
destination = "ckpt"
writable = false

[[inputs]]
source = "data/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth"
destination = "third_party/dinov3/checkpoints/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth"
writable = false
