schema_version = 1
output_storage = "drive"
name = "blcs_axial_reference_kp14"
description = "Train BLCS axial reference from scratch with KP14 on the verified four-corner camera_view_v2 dataset."
accelerator = "gpu"
timeout_seconds = 172800
setup = ["base"]
protected_override_keys = ["paths.data_root", "paths.output_root", "data.scene_dir", "run.output_dir", "run.artifact_store", "run.gpus", "run.resume", "model.num_court_tokens", "data.num_court_kp"]
outputs = ["outputs/colab/blcs_axial_reference_kp14"]

[command]
argv = ["bash", "scripts/colab/train/blcs_axial_reference.sh"]
args = ["paths.output_root=outputs/colab", "run.output_dir=blcs_axial_reference_kp14", "run.gpus=1", "model.num_court_tokens=14", "data.num_court_kp=14", "run.resume=null"]

[[inputs]]
source = "data/blcs/single_object_camera_view_v2.tar.gz"
destination = "data/blcs/single_object_camera_view_v2.tar.gz"
writable = false
