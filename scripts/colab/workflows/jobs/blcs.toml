schema_version = 1
output_storage = "drive"
name = "blcs"
description = "Train the standard BLCS multiview model."
accelerator = "gpu"
timeout_seconds = 86400
setup = ["base"]
protected_override_keys = [
  "paths.data_root",
  "paths.output_root",
  "data.scene_dir",
  "run.output_dir",
  "run.gpus",
]
outputs = ["outputs/colab/blcs"]

[command]
module = "src.tasks.blcs.scripts.train"
args = [
  "paths.output_root=outputs/colab",
  "run.output_dir=blcs",
  "run.gpus=1",
]

[[inputs]]
source = "data/blcs/single_object"
destination = "data/blcs/single_object"
writable = false
