schema_version = 1
output_storage = "drive"
name = "ball_detection"
description = "Train the standard TrackNet ball detector."
accelerator = "gpu"
timeout_seconds = 86400
setup = ["base"]
protected_override_keys = [
  "paths.data_root",
  "paths.output_root",
  "data.data_dir",
  "run.output_dir",
  "run.artifact_store",
  "run.gpus",
]
outputs = ["outputs/colab/ball_detection"]

[command]
module = "src.tasks.ball_detection.scripts.train"
args = [
  "paths.output_root=outputs/colab",
  "run.output_dir=ball_detection",
  "run.gpus=1",
]

[[inputs]]
source = "data/tennis/tracknet"
destination = "data/tennis/tracknet"
writable = false
