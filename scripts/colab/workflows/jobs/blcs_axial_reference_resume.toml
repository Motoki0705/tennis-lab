schema_version = 1
output_storage = "drive"
name = "blcs_axial_reference_resume"
description = "Resume BLCS axial reference with optimizer state from a staged checkpoint."
accelerator = "gpu"
timeout_seconds = 172800
setup = ["base"]
protected_override_keys = ["paths.data_root", "paths.output_root", "data.scene_dir", "run.output_dir", "run.gpus", "run.resume", "paths.checkpoint_root"]
outputs = ["outputs/colab/blcs_axial_reference_resume"]

[command]
argv = ["bash", "scripts/colab/train/blcs_axial_reference.sh"]
args = ["paths.output_root=outputs/colab", "run.output_dir=blcs_axial_reference_resume", "run.gpus=1", "run.resume=blcs/axial_reference_resume.ckpt"]

[[inputs]]
source = "data/blcs/single_object_camera_view_v2.tar.gz"
destination = "data/blcs/single_object_camera_view_v2.tar.gz"
writable = false

[[inputs]]
source = "ckpt/blcs/axial_reference_resume.ckpt"
destination = "ckpt/blcs/axial_reference_resume.ckpt"
writable = false
