schema_version = 1
output_storage = "drive"
name = "plcs_tracking"
description = "Train the canonical multi-object PLCS tracking-query model."
accelerator = "gpu"
timeout_seconds = 86400
setup = ["base", "submodules", "cuda_ops"]
protected_override_keys = [
  "paths.data_root",
  "paths.output_root",
  "data.scene_dir",
  "run.output_dir",
  "run.artifact_store",
  "run.gpus",
]
outputs = ["outputs/colab/plcs_tracking"]

[command]
module = "src.tasks.plcs.scripts.train"
args = [
  "--config-name",
  "train_tracking",
  "paths.output_root=outputs/colab",
  "run.output_dir=plcs_tracking",
  "run.gpus=1",
]

[[inputs]]
source = "data/plcs/multi_object"
destination = "data/plcs/multi_object"
writable = false
