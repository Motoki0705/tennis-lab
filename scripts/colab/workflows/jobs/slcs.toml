schema_version = 1
output_storage = "drive"
name = "slcs"
description = "Train the standard SLCS temporal scene-localization model."
accelerator = "gpu"
timeout_seconds = 86400
setup = ["base"]
protected_override_keys = [
  "paths.data_root",
  "paths.output_root",
  "data.dataset_root",
  "data.split_file",
  "run.output_dir",
  "run.gpus",
]
outputs = ["outputs/colab/slcs"]

[command]
module = "src.tasks.slcs.scripts.train"
args = [
  "paths.output_root=outputs/colab",
  "run.output_dir=slcs",
  "run.gpus=1",
]

[[inputs]]
source = "data/tennis_scene_dataset"
destination = "data/tennis_scene_dataset"
writable = false
