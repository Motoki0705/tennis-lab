schema_version = 1
name = "slcs_make_splits"
description = "Create deterministic recording-level SLCS train/validation/test splits."
accelerator = "cpu"
timeout_seconds = 43200
setup = ["base"]
protected_override_keys = [
  "paths.data_root",
  "paths.output_root",
  "data.dataset_root",
  "data.split_file",
]
outputs = ["data/tennis_scene_dataset/splits.json"]

[command]
module = "src.tasks.slcs.scripts.make_splits"
args = [
  "data.dataset_root=tennis_scene_dataset",
  "data.split_file=tennis_scene_dataset/splits.json",
]

[[inputs]]
source = "data/tennis_scene_dataset/dataset.json"
destination = "data/tennis_scene_dataset/dataset.json"
writable = false

[[inputs]]
source = "data/tennis_scene_dataset/clips"
destination = "data/tennis_scene_dataset/clips"
writable = false
