schema_version = 1
name = "court_detection_materialize_targets"
description = "Export optional Court raster audit images; training generates targets online."
accelerator = "cpu"
timeout_seconds = 43200
setup = ["base"]
protected_override_keys = [
  "paths.data_root",
  "paths.output_root",
  "data/source",
  "data/processing",
  "data.source.workspace_root",
  "data.processing.derived_target_root",
]
outputs = ["data/court_detection/target_audit"]

[command]
module = "src.tasks.court_detection.scripts.materialize_targets"
args = [
  "data/source=synthetic_court",
  "data/processing=seg_line",
  "data.processing.derived_target_root=court_detection/target_audit",
]

[[inputs]]
source = "data/synthetic_data_generation/scenes"
destination = "data/synthetic_data_generation/scenes"
writable = false
