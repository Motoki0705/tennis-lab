data:
  root_dir: data/tennis
  train_matches:
  - game1
  - game2
  - game3
  - game4
  - game5
  - game6
  - game7
  - game8
  val_matches:
  - game9
  test_matches:
  - game10
  sequence_length: 128
  step: 8
  min_visible_per_window: 8
  image_ext: .jpg
  csv_filename: Label.csv
  xy_scale:
  - 1920.0
  - 1080.0
  ignore_invisible_targets: true
  ignore_index: -100
  batch_size: 64
  num_workers: 4
  pin_memory: true
training:
  max_epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_steps: 1000
  min_lr: 1.0e-06
  precision: '32'
  ignore_index: -100
  class_weights: null
  compute_class_weights:
    enabled: true
    max_windows: 5000
  event_boost: 2.0
  label_smoothing: 0.0
  resume:
    enabled: false
    ckpt_path: null
    auto_last: true
logging:
  level: INFO
  fmt: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  datefmt: '%Y-%m-%d %H:%M:%S'
run:
  output_dir: outputs/event_detection
  seed: 42
  gpus: 0
  fast_dev_run: false
  dry_run: false
model:
  name: event_detection_transformer
  d_model: 128
  num_layers: 4
  num_heads: 4
  dim_feedforward: 256
  dropout: 0.1
  mlp_hidden_dim: 128
  num_classes: 3
  max_len: 512
  positional_encoding: sin
