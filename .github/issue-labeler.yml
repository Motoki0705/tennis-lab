# issueの種別（type:）をタイトルprefixだけから付ける。本文は見ない（include-body: 0）。
# 領域（area:）は起票者が手で付ける。ラベルの正本は .github/labels.yml。
"type: bug":
  - '/^\[(?:バグ|修正|bug)\]/i'

"type: feature":
  - '/^\[(?:機能|feature)(?:・[^\]]*)?\]/i'

"type: research":
  - '/^\[(?:調査|研究テーマ|研究サイクル|research)\]/i'

"type: followup":
  - '/^\[追補\]/'
