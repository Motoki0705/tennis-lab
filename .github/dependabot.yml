version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      python-production-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      python-development-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(python)"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
      - "ci"

  # Each submodule is intentionally kept in a separate PR. Updating research
  # code from multiple upstreams together would make regressions hard to bisect.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "deps(third-party)"
    labels:
      - "dependencies"
      - "third-party"
