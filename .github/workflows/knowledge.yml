name: Knowledge library
on:
  pull_request:
    paths:
      - 'knowledge/**'
      - '.agents/skills/knowledge-control/**'
      - 'tests/e2e/skills/test_knowledge*.py'
      - '.github/workflows/knowledge.yml'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - '.agents/skills/knowledge-control/**'
      - 'tests/e2e/skills/test_knowledge*.py'
      - '.github/workflows/knowledge.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: knowledge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU validation tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install PyYAML pytest
      - name: Validate graph, papers, summary and allocation history
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--check-summary)
          if [[ -n "$BASE_REF" ]]; then
            args+=(--base-ref "$BASE_REF")
          fi
          .venv/bin/python .agents/skills/knowledge-control/scripts/kg_validate.py "${args[@]}"
      - name: Test storage, registration and documented skill workflows
        run: .venv/bin/python -m pytest --confcutdir=tests/e2e/skills -o addopts='' tests/e2e/skills/test_knowledge*.py
  knowledge-webui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: knowledge/webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: knowledge/webui/package-lock.json
      - name: Validate Web UI
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
