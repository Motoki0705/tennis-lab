name: Knowledge library
on:
  pull_request:
    paths:
      - 'knowledge/**'
      - '.agents/skills/knowledge-control/**'
      - 'tests/e2e/skills/test_knowledge*.py'
      - 'tests/unit/skills/test_knowledge_citation_schema.py'
      - 'tests/unit/skills/test_citation_literature.py'
      - 'tests/integration/skills/test_citation_explore.py'
      - '.agents/ops/lib/agy_headless.py'
      - '.agents/ops/lib/agents.conf'
      - 'tests/fixtures/knowledge/**'
      - '.github/workflows/knowledge.yml'
      - '.github/workflows/ci.yml'
      # Configs tracked by knowledge/registry/deployments.yaml and its source documents.
      - 'src/tennis_scene/configs/**'
      - 'LICENSES.md'
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - '.agents/skills/knowledge-control/**'
      - 'tests/e2e/skills/test_knowledge*.py'
      - 'tests/unit/skills/test_knowledge_citation_schema.py'
      - 'tests/unit/skills/test_citation_literature.py'
      - 'tests/integration/skills/test_citation_explore.py'
      - '.agents/ops/lib/agy_headless.py'
      - '.agents/ops/lib/agents.conf'
      - 'tests/fixtures/knowledge/**'
      - '.github/workflows/knowledge.yml'
      - '.github/workflows/ci.yml'
      # Configs tracked by knowledge/registry/deployments.yaml and its source documents.
      - 'src/tennis_scene/configs/**'
      - 'LICENSES.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: knowledge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CPU validation tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install PyYAML pytest jsonschema==4.26.0
      - name: Validate graph, run sizes and types, deletion records, references and history
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--check-summary)
          if [[ -n "$BASE_REF" ]]; then
            args+=(--base-ref "$BASE_REF")
          fi
          .venv/bin/python .agents/skills/knowledge-control/scripts/kg_validate.py "${args[@]}"
      - name: Check that repro.sh files reference only reproducible scripts
        run: .venv/bin/python .agents/skills/knowledge-control/scripts/kg_repro_paths.py
      - name: Test storage boundaries, pinned exceptions, deletion integrity and registration
        run: .venv/bin/python -m pytest --confcutdir=tests/e2e/skills -o addopts='' tests/e2e/skills/test_knowledge*.py
      - name: Test citation document schema and identity contracts
        run: .venv/bin/python -m pytest --confcutdir=tests/unit/skills -o addopts='' tests/unit/skills/test_knowledge_citation_schema.py tests/unit/skills/test_citation_literature.py
      - name: Test citation traversal and read-only fake agy
        run: .venv/bin/python -m pytest --confcutdir=tests/integration/skills -o addopts='' tests/integration/skills/test_citation_explore.py
  knowledge-webui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: knowledge/webui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: knowledge/webui/package-lock.json
      - name: Validate Web UI
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
