name: WSL MCP versioned venv mount fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/wsl_mcp_venv_mount_fix.py"
      - ".github/workflows/wsl-mcp-venv-mount-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/wsl-mcp-project-sandbox
          fetch-depth: 0
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"

      - name: Apply reviewed fix
        run: python3 .github/scripts/wsl_mcp_venv_mount_fix.py

      - name: Format and verify
        run: |
          uv run --locked ruff format \
            src/automation/chatgpt_mcp/jobs.py \
            tests/unit/automation/chatgpt_mcp/test_jobs.py
          uv run --locked ruff check \
            src/automation/chatgpt_mcp/jobs.py \
            tests/unit/automation/chatgpt_mcp/test_jobs.py
          uv run --locked mypy src/automation/chatgpt_mcp/jobs.py
          uv run --locked pytest -q tests/unit/automation/chatgpt_mcp/test_jobs.py

      - name: Commit fix and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/scripts/wsl_mcp_venv_mount_fix.py \
            .github/workflows/wsl-mcp-venv-mount-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(automation): mount versioned trusted venv path"
          git push origin HEAD:feat/wsl-mcp-project-sandbox
