name: Literature radar ingest

on:
  push:
    branches:
      - automation/literature-inbox/perception
      - automation/literature-inbox/geometry
      - automation/literature-inbox/systems
    paths:
      - "knowledge/literature/incoming/**/*.json"

permissions:
  contents: write

concurrency:
  group: literature-radar-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout collector queue branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect raw candidate from this commit
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- \
              knowledge/literature/incoming | grep -E '\.json$' || true
          )
          if (( ${#files[@]} == 0 )); then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#files[@]} > 1 )); then
            echo "One hourly commit may contain at most one candidate JSON." >&2
            exit 1
          fi
          mkdir -p /tmp/literature-radar-inputs
          target="/tmp/literature-radar-inputs/$(basename "${files[0]}")"
          cp "${files[0]}" "$target"
          echo "$target" > /tmp/literature-radar-input-list
          echo "count=1" >> "$GITHUB_OUTPUT"
          echo "collector=${GITHUB_REF_NAME##*/}" >> "$GITHUB_OUTPUT"

      - name: Resolve target daily branch
        if: steps.inputs.outputs.count != '0'
        id: target
        shell: bash
        run: |
          set -euo pipefail
          input="$(head -n 1 /tmp/literature-radar-input-list)"
          date="$(
            python3 .agents/skills/literature-radar/scripts/radar_hardening.py \
              date "$input" --repo-root . \
              --expected-collector "${{ steps.inputs.outputs.collector }}"
          )"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "branch=automation/literature-radar/$date" >> "$GITHUB_OUTPUT"

      - name: Checkout target daily branch and deduplication refs
        if: steps.inputs.outputs.count != '0'
        shell: bash
        env:
          DAILY_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/automation/literature-radar/*:refs/remotes/origin/automation/literature-radar/*'
          if ! git show-ref --verify --quiet "refs/remotes/origin/$DAILY_BRANCH"; then
            echo "Daily branch $DAILY_BRANCH does not exist." >&2
            echo "Run daily curator initialization first." >&2
            exit 1
          fi
          git switch --detach "refs/remotes/origin/$DAILY_BRANCH"

      - name: Validate, canonicalize and ingest
        if: steps.inputs.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t inputs < /tmp/literature-radar-input-list
          python3 .agents/skills/literature-radar/scripts/radar_hardening.py ingest \
            "${inputs[@]}" \
            --repo-root . \
            --dedup-ref-prefix refs/remotes/origin/automation/literature-radar \
            --expected-collector "${{ steps.inputs.outputs.collector }}" \
            --update-digest \
            --update-status
          python3 .agents/skills/literature-radar/scripts/radar_hardening.py \
            validate --repo-root .

      - name: Commit canonical knowledge changes
        if: steps.inputs.outputs.count != '0'
        shell: bash
        env:
          DAILY_BRANCH: ${{ steps.target.outputs.branch }}
          RADAR_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            knowledge/literature/candidates \
            knowledge/literature/digests \
            knowledge/literature/status
          if git diff --cached --quiet; then
            echo "No canonical knowledge change after deduplication/quota checks."
            exit 0
          fi
          git commit -m "docs(knowledge): ingest $RADAR_DATE literature candidate"
          git push origin "HEAD:$DAILY_BRANCH"
