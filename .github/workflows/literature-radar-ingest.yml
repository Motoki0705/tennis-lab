name: Literature radar ingest

on:
  push:
    branches:
      - automation/literature-inbox/perception
      - automation/literature-inbox/geometry
      - automation/literature-inbox/systems
    paths:
      - "knowledge/literature/incoming/**/*.json"

permissions:
  contents: write

concurrency:
  group: literature-radar-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout collector queue branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect raw candidate from this commit
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- \
              knowledge/literature/incoming | grep -E '\.json$' || true
          )
          if (( ${#files[@]} == 0 )); then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#files[@]} > 1 )); then
            echo "One hourly commit may contain at most one candidate JSON." >&2
            exit 1
          fi
          mkdir -p /tmp/literature-radar-inputs
          target="/tmp/literature-radar-inputs/$(basename "${files[0]}")"
          cp "${files[0]}" "$target"
          echo "$target" > /tmp/literature-radar-input-list
          echo "count=1" >> "$GITHUB_OUTPUT"
          echo "collector=${GITHUB_REF_NAME##*/}" >> "$GITHUB_OUTPUT"

      - name: Load trusted scripts from main and resolve target date
        if: steps.inputs.outputs.count != '0'
        id: target
        shell: bash
        env:
          COLLECTOR: ${{ steps.inputs.outputs.collector }}
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/automation/literature-radar/*:refs/remotes/origin/automation/literature-radar/*'
          git switch --detach refs/remotes/origin/main
          mkdir -p /tmp/literature-radar-scripts
          cp .agents/skills/literature-radar/scripts/radar_ingest.py \
            /tmp/literature-radar-scripts/
          cp .agents/skills/literature-radar/scripts/radar_hardening.py \
            /tmp/literature-radar-scripts/
          cp .agents/skills/literature-radar/scripts/radar_status.py \
            /tmp/literature-radar-scripts/
          input="$(head -n 1 /tmp/literature-radar-input-list)"
          date="$(
            python3 /tmp/literature-radar-scripts/radar_hardening.py \
              date "$input" --repo-root . \
              --expected-collector "$COLLECTOR"
          )"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "branch=automation/literature-radar/$date" >> "$GITHUB_OUTPUT"

      - name: Ensure target daily branch exists
        if: steps.inputs.outputs.count != '0'
        shell: bash
        env:
          DAILY_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/remotes/origin/$DAILY_BRANCH"; then
            exit 0
          fi
          if ! git push origin \
            "refs/remotes/origin/main:refs/heads/$DAILY_BRANCH"; then
            echo "Daily branch creation raced with another writer; refetching." >&2
          fi
          git fetch origin \
            "+refs/heads/$DAILY_BRANCH:refs/remotes/origin/$DAILY_BRANCH"

      - name: Ingest and publish with optimistic retry
        if: steps.inputs.outputs.count != '0'
        shell: bash
        env:
          COLLECTOR: ${{ steps.inputs.outputs.collector }}
          DAILY_BRANCH: ${{ steps.target.outputs.branch }}
          RADAR_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          input="$(head -n 1 /tmp/literature-radar-input-list)"

          for attempt in 1 2 3; do
            echo "Literature ingest publish attempt $attempt/3"
            git fetch origin \
              "+refs/heads/$DAILY_BRANCH:refs/remotes/origin/$DAILY_BRANCH" \
              '+refs/heads/automation/literature-radar/*:refs/remotes/origin/automation/literature-radar/*'
            git switch --detach "refs/remotes/origin/$DAILY_BRANCH"
            git reset --hard "refs/remotes/origin/$DAILY_BRANCH"

            python3 /tmp/literature-radar-scripts/radar_hardening.py ingest \
              "$input" \
              --repo-root . \
              --dedup-ref-prefix refs/remotes/origin/automation/literature-radar \
              --expected-collector "$COLLECTOR" \
              --update-digest \
              --update-status
            python3 /tmp/literature-radar-scripts/radar_status.py normalize \
              --repo-root . --date "$RADAR_DATE"
            python3 /tmp/literature-radar-scripts/radar_hardening.py \
              validate --repo-root .
            python3 /tmp/literature-radar-scripts/radar_status.py \
              validate --repo-root .

            git add \
              knowledge/literature/candidates \
              knowledge/literature/digests \
              knowledge/literature/status
            if git diff --cached --quiet; then
              echo "No canonical knowledge change after deduplication or quota checks."
              exit 0
            fi

            git commit -m "docs(knowledge): ingest $RADAR_DATE literature candidate"
            if git push origin "HEAD:refs/heads/$DAILY_BRANCH"; then
              exit 0
            fi

            if (( attempt == 3 )); then
              echo "Failed to publish after three optimistic retries." >&2
              exit 1
            fi
            echo "Daily branch advanced concurrently; rebuilding from its latest head." >&2
          done
