name: PR716 security finalization

on:
  push:
    branches: [feat/chatgpt-wsl-mcp]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/chatgpt-wsl-mcp
          fetch-depth: 0
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Apply atomic systemd installation and regenerate inventory
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path

          secure_path = Path("src/automation/chatgpt_mcp/secure_tunnel.py")
          secure = secure_path.read_text(encoding="utf-8")
          secure = secure.replace(
              "import subprocess\nimport time\n",
              "import subprocess\nimport tempfile\nimport time\n",
              1,
          )
          old_install = '''        self.private_service_path.write_text(
              self._private_service_unit(), encoding="utf-8"
          )
          self.tunnel_service_path.write_text(
              self._tunnel_service_unit(), encoding="utf-8"
          )
          os.chmod(self.private_service_path, 0o600)
          os.chmod(self.tunnel_service_path, 0o600)
          verification = subprocess.run(
              [
                  "systemd-analyze",
                  "--user",
                  "verify",
                  str(self.private_service_path),
                  str(self.tunnel_service_path),
              ],
              text=True,
              capture_output=True,
              check=False,
              timeout=30,
          )
          if verification.returncode != 0:
              detail = verification.stderr.strip() or verification.stdout.strip()
              raise SecureTunnelError(f"systemd unit verification failed: {detail}")
          subprocess.run(
              ["systemctl", "--user", "daemon-reload"], check=True, timeout=30
          )
          return self.paths()
          '''
          new_install = '''        with tempfile.TemporaryDirectory(
              prefix=".tennis-lab-mcp-units-",
              dir=self.service_dir,
          ) as temporary_directory:
              candidate_dir = Path(temporary_directory)
              private_candidate = candidate_dir / PRIVATE_SERVICE_NAME
              tunnel_candidate = candidate_dir / TUNNEL_SERVICE_NAME
              private_candidate.write_text(
                  self._private_service_unit(), encoding="utf-8"
              )
              tunnel_candidate.write_text(
                  self._tunnel_service_unit(), encoding="utf-8"
              )
              os.chmod(private_candidate, 0o600)
              os.chmod(tunnel_candidate, 0o600)
              verification = subprocess.run(
                  [
                      "systemd-analyze",
                      "--user",
                      "verify",
                      str(private_candidate),
                      str(tunnel_candidate),
                  ],
                  text=True,
                  capture_output=True,
                  check=False,
                  timeout=30,
              )
              if verification.returncode != 0:
                  detail = verification.stderr.strip() or verification.stdout.strip()
                  raise SecureTunnelError(
                      f"systemd unit verification failed: {detail}"
                  )
              os.replace(private_candidate, self.private_service_path)
              os.replace(tunnel_candidate, self.tunnel_service_path)
          os.chmod(self.private_service_path, 0o600)
          os.chmod(self.tunnel_service_path, 0o600)
          subprocess.run(
              ["systemctl", "--user", "daemon-reload"], check=True, timeout=30
          )
          return self.paths()
          '''
          if old_install not in secure:
              raise SystemExit("secure_tunnel install block did not match expected source")
          secure_path.write_text(
              secure.replace(old_install, new_install, 1), encoding="utf-8"
          )

          test_path = Path("tests/unit/automation/chatgpt_mcp/test_secure_tunnel.py")
          tests = test_path.read_text(encoding="utf-8")
          old_assertion = '''    assert commands[0] == [
              "systemd-analyze",
              "--user",
              "verify",
              str(paths.private_service),
              str(paths.tunnel_service),
          ]
          '''
          new_assertion = '''    verify_command = commands[0]
          assert verify_command[:3] == ["systemd-analyze", "--user", "verify"]
          private_candidate = Path(verify_command[3])
          tunnel_candidate = Path(verify_command[4])
          assert private_candidate.name == PRIVATE_SERVICE_NAME
          assert tunnel_candidate.name == TUNNEL_SERVICE_NAME
          assert private_candidate.parent == tunnel_candidate.parent
          assert private_candidate.parent != paths.private_service.parent
          '''
          if old_assertion not in tests:
              raise SystemExit("secure tunnel success assertion did not match")
          tests = tests.replace(old_assertion, new_assertion, 1)

          old_invalid = '''def test_install_services_rejects_invalid_systemd_units(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              manager = _manager(tmp_path)
              manager.settings.secure_tunnel_profile_dir.mkdir(parents=True)
              manager.settings.secure_tunnel_profile_path.write_text(
                  "config_version: 1\\n", encoding="utf-8"
              )

              def fake_run(
                  command: list[str], **kwargs: object
              ) -> subprocess.CompletedProcess[str]:
                  assert command[:3] == ["systemd-analyze", "--user", "verify"]
                  return subprocess.CompletedProcess(command, 1, "", "invalid unit")

              monkeypatch.setattr(
                  "src.automation.chatgpt_mcp.secure_tunnel.subprocess.run", fake_run
              )

              with pytest.raises(SecureTunnelError, match="systemd unit verification failed"):
                  manager.install_user_services()
          '''
          new_invalid = '''def test_install_services_rejects_invalid_systemd_units_without_replacing_active_files(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              manager = _manager(tmp_path)
              manager.settings.secure_tunnel_profile_dir.mkdir(parents=True)
              manager.settings.secure_tunnel_profile_path.write_text(
                  "config_version: 1\\n", encoding="utf-8"
              )
              manager.service_dir.mkdir(parents=True)
              manager.private_service_path.write_text("old private unit\\n", encoding="utf-8")
              manager.tunnel_service_path.write_text("old tunnel unit\\n", encoding="utf-8")

              def fake_run(
                  command: list[str], **kwargs: object
              ) -> subprocess.CompletedProcess[str]:
                  assert command[:3] == ["systemd-analyze", "--user", "verify"]
                  assert Path(command[3]).name == PRIVATE_SERVICE_NAME
                  assert Path(command[4]).name == TUNNEL_SERVICE_NAME
                  assert Path(command[3]).parent != manager.service_dir
                  return subprocess.CompletedProcess(command, 1, "", "invalid unit")

              monkeypatch.setattr(
                  "src.automation.chatgpt_mcp.secure_tunnel.subprocess.run", fake_run
              )

              with pytest.raises(SecureTunnelError, match="systemd unit verification failed"):
                  manager.install_user_services()

              assert manager.private_service_path.read_text(encoding="utf-8") == (
                  "old private unit\\n"
              )
              assert manager.tunnel_service_path.read_text(encoding="utf-8") == (
                  "old tunnel unit\\n"
              )
          '''
          if old_invalid not in tests:
              raise SystemExit("secure tunnel failure test did not match")
          test_path.write_text(tests.replace(old_invalid, new_invalid, 1), encoding="utf-8")

          readme_path = Path("src/automation/chatgpt_mcp/README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "registered SHA and tracked-clean source tree",
              "registered SHA and completely clean source tree",
          )
          readme = readme.replace(
              "raw commands are represented in durable metadata only by a\n  SHA-256 digest.",
              "raw commands are absent from Docker metadata and represented in durable\n  metadata only by a SHA-256 digest; private command/spec files are deleted after\n  handoff.",
          )
          readme_path.write_text(readme, encoding="utf-8")

          from src.utils.configuration import AuditExemption, AuditRule
          from src.utils.configuration.audit import (
              regenerate_exemption_rows,
              write_generated_inventory_data,
          )

          source_root = Path("src").resolve()
          _, _, unresolved = regenerate_exemption_rows(source_root)
          unexpected = [
              finding
              for finding in unresolved
              if not finding.module.startswith("src.automation.chatgpt_mcp")
          ]
          if unexpected:
              rendered = "\n".join(repr(finding) for finding in unexpected)
              raise SystemExit("unexpected non-MCP inventory findings:\n" + rendered)

          code_locations = {
              ("src.automation.chatgpt_mcp.jobs", "TrainingQueueManager.__init__"),
              ("src.automation.chatgpt_mcp.settings", "GatewaySettings.venv_root"),
              (
                  "src.automation.chatgpt_mcp.workspace",
                  "WorkspaceManager._verify_materialized_workspace",
              ),
          }
          path_rules = {
              AuditRule.HYDRA_ABSOLUTE_PATH,
              AuditRule.FILE_PARENT_INDEX,
              AuditRule.RUNTIME_PATH_LITERAL,
              AuditRule.PATH_JOIN,
              AuditRule.PROCESS_CWD,
              AuditRule.HYDRA_RUN_DIRECTORY,
          }
          approvals = []
          for finding in unresolved:
              if finding.rule not in path_rules:
                  reason_code = "strict-schema"
              elif (
                  finding.rule is AuditRule.FILE_PARENT_INDEX
                  or (finding.module, finding.qualified_name) in code_locations
              ):
                  reason_code = "code-or-artifact-location"
              else:
                  reason_code = "persisted-layout"
              approvals.append(
                  AuditExemption.classified(
                      module=finding.module,
                      qualified_name=finding.qualified_name,
                      line=finding.line,
                      rule=finding.rule,
                      reason_code=reason_code,
                  )
              )

          migration_count, exemption_count = write_generated_inventory_data(
              source_root,
              source_revision="pr716-execution-boundary-v3",
              approved_exemptions=tuple(approvals),
          )
          print(
              f"generated inventory: migrations={migration_count} "
              f"exemptions={exemption_count} new={len(approvals)}"
          )
          PY

      - name: Run focused security and MCP checks
        run: |
          uv run --locked ruff check \
            src/automation/chatgpt_mcp \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp
          uv run --locked mypy src/automation/chatgpt_mcp
          uv run --locked pytest -q \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp \
            tests/unit/utils/configuration/test_inventory.py

      - name: Commit finalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/pr716-finalize.yml \
            tests/unit/automation/chatgpt_mcp/test_inventory_diagnostic.py
          git add \
            src/automation/chatgpt_mcp \
            src/utils/configuration/exemption_data.py \
            src/utils/configuration/migration_data.py \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp
          git diff --cached --check
          git commit -m "security(automation): constrain WSL MCP to execution plane"
          git push origin HEAD:feat/chatgpt-wsl-mcp
