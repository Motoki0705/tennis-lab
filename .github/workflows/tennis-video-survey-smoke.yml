name: Tennis video survey smoke

on:
  push:
    branches:
      - automation/tennis-video-survey-20260912

permissions:
  contents: read

jobs:
  discover-categories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover Wikimedia Commons tennis categories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/category-discovery
          cat > /tmp/discover_categories.py <<'PY'
          from __future__ import annotations

          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = "https://commons.wikimedia.org/w/api.php"
          HEADERS = {"User-Agent": "tennis-video-survey/1.0 (research dataset curation)"}

          def request(params):
              url = API + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)

          output = {}
          output["allcategories"] = request({
              "action": "query", "list": "allcategories", "acprefix": "Tennis",
              "aclimit": "500", "acprop": "size", "format": "json", "formatversion": "2",
          }).get("query", {}).get("allcategories", [])
          output["category_search"] = request({
              "action": "query", "list": "search", "srnamespace": "14",
              "srsearch": "tennis video OR videos", "srlimit": "500",
              "format": "json", "formatversion": "2",
          }).get("query", {}).get("search", [])
          output["file_search"] = request({
              "action": "query", "list": "search", "srnamespace": "6",
              "srsearch": "tennis incategory:Videos filetype:video",
              "srlimit": "100", "format": "json", "formatversion": "2",
          }).get("query", {}).get("search", [])
          path = Path("artifacts/category-discovery/categories.json")
          json.dump(output, open(path, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          for row in output["allcategories"]:
              print("ALLCATEGORY", json.dumps(row, ensure_ascii=False))
          for row in output["category_search"]:
              print("SEARCH", row.get("title"))
          print("file_search_count", len(output["file_search"]))
          PY
          python /tmp/discover_categories.py | tee artifacts/category-discovery/categories.log

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v7
        with:
          name: tennis-video-survey-category-discovery
          path: artifacts/category-discovery/
          if-no-files-found: error
          retention-days: 7
