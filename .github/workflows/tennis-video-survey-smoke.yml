name: List TennisVL public archive

on:
  push:
    branches:
      - automation/tennis-video-survey-20260912

permissions:
  contents: read

jobs:
  list-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install remote ZIP reader
        run: python -m pip install --upgrade remotezip requests

      - name: Read central directory by HTTP byte ranges
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tennisvl-index
          cat > /tmp/list_tennisvl.py <<'PY'
          from __future__ import annotations

          import collections
          import csv
          import json
          import pathlib
          import re

          from remotezip import RemoteZip

          FILE_ID = "1tGdYvJxKKLIMByrNj_5D56cr-n_u1Syc"
          URL = f"https://drive.usercontent.google.com/download?id={FILE_ID}&export=download&confirm=t"
          OUT = pathlib.Path("artifacts/tennisvl-index")

          with RemoteZip(URL, headers={"User-Agent": "Mozilla/5.0"}, timeout=180) as archive:
              infos = archive.infolist()

          rows = []
          for info in infos:
              name = info.filename
              suffix = pathlib.PurePosixPath(name).suffix.lower()
              row = {
                  "filename": name,
                  "is_dir": info.is_dir(),
                  "suffix": suffix,
                  "compressed_bytes": info.compress_size,
                  "uncompressed_bytes": info.file_size,
                  "compression_method": info.compress_type,
                  "crc32": f"{info.CRC:08x}",
                  "date_time": "-".join(map(str, info.date_time)),
              }
              rows.append(row)

          video_exts = {".mp4", ".mov", ".mkv", ".avi", ".webm", ".m4v"}
          videos = [r for r in rows if not r["is_dir"] and r["suffix"] in video_exts]
          top_dirs = collections.Counter(pathlib.PurePosixPath(r["filename"]).parts[0] if pathlib.PurePosixPath(r["filename"]).parts else "" for r in videos)
          second_dirs = collections.Counter(
              "/".join(pathlib.PurePosixPath(r["filename"]).parts[:2])
              if len(pathlib.PurePosixPath(r["filename"]).parts) >= 2 else pathlib.PurePosixPath(r["filename"]).parts[0]
              for r in videos
          )
          extensions = collections.Counter(r["suffix"] for r in videos)
          size_buckets = collections.Counter()
          for r in videos:
              size = int(r["uncompressed_bytes"])
              if size < 1_000_000:
                  bucket = "<1MB"
              elif size < 5_000_000:
                  bucket = "1-5MB"
              elif size < 20_000_000:
                  bucket = "5-20MB"
              elif size < 100_000_000:
                  bucket = "20-100MB"
              else:
                  bucket = ">=100MB"
              size_buckets[bucket] += 1

          summary = {
              "file_id": FILE_ID,
              "archive_entries": len(rows),
              "video_entries": len(videos),
              "total_video_uncompressed_bytes": sum(int(r["uncompressed_bytes"]) for r in videos),
              "extensions": dict(extensions.most_common()),
              "size_buckets": dict(size_buckets),
              "top_directories": dict(top_dirs.most_common(50)),
              "second_level_directories_top100": dict(second_dirs.most_common(100)),
          }
          json.dump(summary, open(OUT / "summary.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          json.dump(videos, open(OUT / "video_entries.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          with open(OUT / "video_entries.csv", "w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(videos[0]) if videos else list(rows[0]))
              writer.writeheader()
              writer.writerows(videos)
          with open(OUT / "filenames.txt", "w", encoding="utf-8") as handle:
              for row in videos:
                  handle.write(row["filename"] + "\n")

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("FIRST 200 VIDEO ENTRIES")
          for row in videos[:200]:
              print(json.dumps(row, ensure_ascii=False))
          print("LAST 50 VIDEO ENTRIES")
          for row in videos[-50:]:
              print(json.dumps(row, ensure_ascii=False))
          if len(videos) < 100:
              raise SystemExit(f"Only {len(videos)} video entries were found")
          PY
          python /tmp/list_tennisvl.py | tee artifacts/tennisvl-index/index.log

      - name: Upload archive index
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tennisvl-archive-index
          path: artifacts/tennisvl-index/
          if-no-files-found: error
          retention-days: 7
