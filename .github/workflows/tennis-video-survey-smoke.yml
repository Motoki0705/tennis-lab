name: Probe TennisVL public archive

on:
  push:
    branches:
      - automation/tennis-video-survey-20260912

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 gdown remotezip

      - name: Probe Drive archive without downloading it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tennisvl-probe
          cat > /tmp/probe_drive.py <<'PY'
          from __future__ import annotations

          import json
          import re
          import urllib.parse
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          FILE_ID = "1tGdYvJxKKLIMByrNj_5D56cr-n_u1Syc"
          OUT = Path("artifacts/tennisvl-probe")
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/octet-stream;q=0.9,*/*;q=0.8",
          })

          def safe_headers(response: requests.Response) -> dict[str, str]:
              keep = {
                  "content-type", "content-length", "content-range", "accept-ranges",
                  "content-disposition", "x-goog-stored-content-length", "x-goog-hash",
                  "etag", "last-modified", "server",
              }
              return {k: v for k, v in response.headers.items() if k.lower() in keep}

          def summarize(label: str, response: requests.Response) -> dict:
              return {
                  "label": label,
                  "status": response.status_code,
                  "final_url_origin_path": urllib.parse.urlsplit(response.url)._replace(query="", fragment="").geturl(),
                  "headers": safe_headers(response),
                  "cookies": sorted(session.cookies.keys()),
              }

          results: list[dict] = []
          candidates = [
              f"https://drive.usercontent.google.com/download?id={FILE_ID}&export=download&confirm=t",
              f"https://drive.google.com/uc?export=download&id={FILE_ID}&confirm=t",
              f"https://docs.google.com/uc?export=download&id={FILE_ID}&confirm=t",
          ]
          working_url = None
          for idx, url in enumerate(candidates, 1):
              try:
                  response = session.get(url, headers={"Range": "bytes=0-0"}, stream=True, timeout=90, allow_redirects=True)
                  results.append(summarize(f"direct_{idx}", response))
                  ctype = response.headers.get("Content-Type", "").lower()
                  if response.status_code == 206 or (
                      response.status_code == 200 and "application" in ctype and "text/html" not in ctype
                  ):
                      working_url = response.url
                      response.close()
                      break
                  body = response.raw.read(200_000, decode_content=True)
                  response.close()
                  (OUT / f"direct_{idx}_body.bin").write_bytes(body)
                  if "html" in ctype or body.lstrip().startswith(b"<"):
                      soup = BeautifulSoup(body, "html.parser")
                      form = soup.find("form")
                      if form and form.get("action"):
                          action = urllib.parse.urljoin(response.url, form.get("action"))
                          params = {
                              inp.get("name"): inp.get("value", "")
                              for inp in form.find_all("input")
                              if inp.get("name")
                          }
                          follow = session.get(action, params=params, headers={"Range": "bytes=0-0"}, stream=True, timeout=90, allow_redirects=True)
                          results.append(summarize(f"form_{idx}", follow))
                          follow_ctype = follow.headers.get("Content-Type", "").lower()
                          if follow.status_code == 206 or (
                              follow.status_code == 200 and "application" in follow_ctype and "text/html" not in follow_ctype
                          ):
                              working_url = follow.url
                              follow.close()
                              break
                          follow_body = follow.raw.read(200_000, decode_content=True)
                          (OUT / f"form_{idx}_body.bin").write_bytes(follow_body)
                          follow.close()
              except Exception as exc:
                  results.append({"label": f"direct_{idx}", "error": f"{type(exc).__name__}: {exc}"})

          result = {"file_id": FILE_ID, "probes": results, "working": bool(working_url)}
          if working_url:
              parsed = urllib.parse.urlsplit(working_url)
              result["working_url_origin_path"] = parsed._replace(query="", fragment="").geturl()
              # Never persist the signed URL itself; only test suffix range access.
              suffix = session.get(working_url, headers={"Range": "bytes=-65536"}, stream=True, timeout=120, allow_redirects=True)
              result["suffix_probe"] = summarize("suffix", suffix)
              suffix_bytes = suffix.content
              suffix.close()
              (OUT / "zip_suffix.bin").write_bytes(suffix_bytes)
              result["suffix_bytes"] = len(suffix_bytes)
              result["has_zip_eocd_signature"] = b"PK\x05\x06" in suffix_bytes
          json.dump(result, open(OUT / "probe.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if not working_url:
              raise SystemExit("No byte-range-capable download response was obtained")
          PY
          python /tmp/probe_drive.py | tee artifacts/tennisvl-probe/probe.log

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tennisvl-archive-probe
          path: artifacts/tennisvl-probe/
          if-no-files-found: error
          retention-days: 7
