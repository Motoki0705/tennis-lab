name: Licensed tennis video inventory

on:
  push:
    branches:
      - automation/tennis-video-survey-20260912

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Search Internet Archive for licensed tennis videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ia-inventory
          cat > /tmp/ia_inventory.py <<'PY'
          from __future__ import annotations

          import collections
          import html
          import json
          import random
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = "https://archive.org/advancedsearch.php"
          HEADERS = {"User-Agent": "tennis-video-survey/1.0 (research dataset curation; Motoki0705/tennis-lab)"}
          OUT = Path("artifacts/ia-inventory")
          QUERIES = [
              'mediatype:movies AND subject:"tennis"',
              'mediatype:movies AND title:tennis',
              'mediatype:movies AND description:tennis',
              'mediatype:movies AND (title:"tennis match" OR description:"tennis match")',
              'mediatype:movies AND (title:"tennis practice" OR description:"tennis practice")',
              'mediatype:movies AND (title:"tennis serve" OR description:"tennis serve")',
              'mediatype:movies AND (title:"Davis Cup" OR description:"Davis Cup")',
              'mediatype:movies AND (title:Wimbledon OR description:Wimbledon)',
              'mediatype:movies AND (title:"US Open" AND (description:tennis OR subject:tennis))',
              'mediatype:movies AND (title:"French Open" AND (description:tennis OR subject:tennis))',
              'mediatype:movies AND (title:"wheelchair tennis" OR description:"wheelchair tennis")',
              'mediatype:movies AND (title:"college tennis" OR description:"college tennis")',
          ]
          FIELDS = [
              "identifier", "title", "description", "subject", "creator", "date", "year",
              "licenseurl", "rights", "collection", "downloads", "language", "publicdate",
          ]

          def fetch_json(url: str, attempts: int = 6) -> dict:
              last: Exception | None = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=90) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      last = exc
                      if exc.code not in {429, 500, 502, 503, 504}:
                          raise
                      retry = exc.headers.get("Retry-After")
                      delay = float(retry) if retry and retry.isdigit() else min(60.0, 5.0 * 2**attempt)
                      print(f"retry HTTP {exc.code} in {delay:.1f}s", flush=True)
                      time.sleep(delay + random.random())
                  except Exception as exc:
                      last = exc
                      delay = min(45.0, 4.0 * 2**attempt)
                      print(f"retry {type(exc).__name__}: {exc} in {delay:.1f}s", flush=True)
                      time.sleep(delay + random.random())
              raise RuntimeError(f"request failed: {last}")

          def as_text(value: object) -> str:
              if isinstance(value, list):
                  return " | ".join(as_text(v) for v in value)
              text = html.unescape(str(value or ""))
              text = re.sub(r"<[^>]+>", " ", text)
              return re.sub(r"\s+", " ", text).strip()

          merged: dict[str, dict] = {}
          query_log: list[dict] = []
          for index, query in enumerate(QUERIES, 1):
              params: list[tuple[str, str]] = [
                  ("q", query), ("rows", "500"), ("page", "1"), ("output", "json"),
                  ("sort[]", "downloads desc"),
              ]
              params.extend(("fl[]", field) for field in FIELDS)
              url = API + "?" + urllib.parse.urlencode(params)
              print(f"QUERY {index}/{len(QUERIES)} {query}", flush=True)
              try:
                  payload = fetch_json(url)
                  response = payload.get("response") or {}
                  docs = response.get("docs") or []
                  for doc in docs:
                      identifier = as_text(doc.get("identifier"))
                      if not identifier:
                          continue
                      row = merged.setdefault(identifier, {
                          "identifier": identifier,
                          "title": as_text(doc.get("title")),
                          "description": as_text(doc.get("description")),
                          "subject": as_text(doc.get("subject")),
                          "creator": as_text(doc.get("creator")),
                          "date": as_text(doc.get("date") or doc.get("year")),
                          "licenseurl": as_text(doc.get("licenseurl")),
                          "rights": as_text(doc.get("rights")),
                          "collection": as_text(doc.get("collection")),
                          "downloads": doc.get("downloads"),
                          "language": as_text(doc.get("language")),
                          "publicdate": as_text(doc.get("publicdate")),
                          "search_queries": [],
                      })
                      if query not in row["search_queries"]:
                          row["search_queries"].append(query)
                  query_log.append({
                      "query": query,
                      "num_found": response.get("numFound"),
                      "returned": len(docs),
                      "status": "success",
                  })
                  print(f"  numFound={response.get('numFound')} returned={len(docs)} unique={len(merged)}", flush=True)
              except Exception as exc:
                  query_log.append({"query": query, "status": "failed", "error": f"{type(exc).__name__}: {exc}"})
                  print(f"  FAILED {type(exc).__name__}: {exc}", flush=True)
              json.dump(sorted(merged.values(), key=lambda r: r["identifier"]), open(OUT / "candidates.partial.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              json.dump(query_log, open(OUT / "query_log.partial.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              time.sleep(2.0 + random.random())

          rows = sorted(merged.values(), key=lambda r: (-(r.get("downloads") or 0), r["identifier"]))
          json.dump(rows, open(OUT / "candidates.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          json.dump(query_log, open(OUT / "query_log.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)

          excluded_patterns = re.compile(
              r"table[ -]?tennis|ping[ -]?pong|tennis for two|video game|virtual tennis|"
              r"badminton|football tennis|beach tennis|paddle tennis|platform tennis|real tennis|court tennis",
              re.I,
          )
          tennis_patterns = re.compile(
              r"\btennis\b|wimbledon|davis cup|roland garros|french open|"
              r"us open tennis|australian open tennis|atp\b|wta\b",
              re.I,
          )
          license_patterns = re.compile(
              r"creativecommons\.org|publicdomain|public domain|cc0|cc by|cc-by|cc_by",
              re.I,
          )
          strict = []
          for row in rows:
              haystack = " ".join([row["title"], row["description"], row["subject"]])
              license_text = " ".join([row["licenseurl"], row["rights"]])
              if not tennis_patterns.search(haystack):
                  continue
              if excluded_patterns.search(haystack):
                  continue
              if not license_patterns.search(license_text):
                  continue
              strict.append(row)
          json.dump(strict, open(OUT / "strict_candidates.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          license_counts = collections.Counter(r["licenseurl"] or r["rights"] or "UNKNOWN" for r in strict)
          summary = {
              "unique_search_results": len(rows),
              "strict_explicit_license_tennis_candidates": len(strict),
              "successful_queries": sum(q["status"] == "success" for q in query_log),
              "failed_queries": sum(q["status"] == "failed" for q in query_log),
              "license_counts_top20": dict(license_counts.most_common(20)),
          }
          json.dump(summary, open(OUT / "summary.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          for row in strict[:150]:
              print(json.dumps({k: row.get(k) for k in ("identifier", "title", "subject", "licenseurl", "rights", "downloads")}, ensure_ascii=False))
          if len(strict) < 60:
              raise SystemExit(f"Only {len(strict)} strict IA candidates were found")
          PY
          python /tmp/ia_inventory.py | tee artifacts/ia-inventory/inventory.log

      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tennis-video-survey-ia-inventory
          path: artifacts/ia-inventory/
          if-no-files-found: error
          retention-days: 7
