name: Tennis video survey search inventory

on:
  push:
    branches:
      - automation/tennis-video-survey-20260912

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Search Commons for tennis video files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/search-inventory
          cat > /tmp/search_inventory.py <<'PY'
          from __future__ import annotations

          import collections
          import html
          import json
          import random
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = "https://commons.wikimedia.org/w/api.php"
          HEADERS = {"User-Agent": "tennis-video-survey/1.1 (research dataset curation; Motoki0705/tennis-lab)"}
          SEARCHES = [
              "tennis filetype:video",
              "intitle:tennis filetype:video",
              '"tennis match" filetype:video',
              '"tennis practice" filetype:video',
              '"tennis serve" filetype:video',
              '"tennis ball" filetype:video',
              '"Davis Cup" filetype:video',
              '"wheelchair tennis" filetype:video',
              '"Wimbledon" tennis filetype:video',
              '"French Open" tennis filetype:video',
              '"US Open" tennis filetype:video',
              '"tennis championship" filetype:video',
          ]
          OUT = Path("artifacts/search-inventory")

          def fetch(params: dict, attempts: int = 7) -> dict:
              params = dict(params)
              params.update({"format": "json", "formatversion": "2", "maxlag": "5"})
              url = API + "?" + urllib.parse.urlencode(params)
              last: Exception | None = None
              for attempt in range(attempts):
                  req = urllib.request.Request(url, headers=HEADERS)
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      last = exc
                      if exc.code not in {429, 500, 502, 503, 504}:
                          raise
                      retry_after = exc.headers.get("Retry-After")
                      delay = float(retry_after) if retry_after and retry_after.isdigit() else min(60.0, 8.0 * (2 ** attempt))
                      print(f"retryable HTTP {exc.code}; sleeping {delay:.1f}s", flush=True)
                      time.sleep(delay + random.random())
                  except Exception as exc:
                      last = exc
                      delay = min(45.0, 5.0 * (2 ** attempt))
                      print(f"retryable {type(exc).__name__}: {exc}; sleeping {delay:.1f}s", flush=True)
                      time.sleep(delay + random.random())
              raise RuntimeError(f"Commons request failed after retries: {last}")

          def strip_markup(raw: object) -> str:
              text = html.unescape(str(raw or ""))
              text = re.sub(r"<br\s*/?>", "\n", text, flags=re.I)
              text = re.sub(r"<[^>]+>", " ", text)
              return re.sub(r"\s+", " ", text).strip()

          rows: dict[int, dict] = {}
          query_log: list[dict] = []
          for query_index, term in enumerate(SEARCHES, 1):
              print(f"QUERY {query_index}/{len(SEARCHES)}: {term}", flush=True)
              try:
                  data = fetch({
                      "action": "query",
                      "generator": "search",
                      "gsrsearch": term,
                      "gsrnamespace": "6",
                      "gsrlimit": "500",
                      "prop": "imageinfo|categories",
                      "iiprop": "url|size|mime|mediatype|extmetadata|canonicaltitle",
                      "cllimit": "500",
                  })
                  pages = (data.get("query") or {}).get("pages") or []
                  videos = 0
                  for page in pages:
                      ii = (page.get("imageinfo") or [{}])[0]
                      mime = str(ii.get("mime") or "")
                      if not mime.startswith("video/"):
                          continue
                      videos += 1
                      pageid = int(page["pageid"])
                      ext = ii.get("extmetadata") or {}
                      def meta(name: str) -> str:
                          return strip_markup((ext.get(name) or {}).get("value"))
                      row = rows.setdefault(pageid, {
                          "pageid": pageid,
                          "title": page.get("title"),
                          "page_url": ii.get("descriptionurl"),
                          "media_url": str(ii.get("url") or "").split("?", 1)[0],
                          "mime": mime,
                          "media_type": ii.get("mediatype"),
                          "width": ii.get("width"),
                          "height": ii.get("height"),
                          "size_bytes": ii.get("size"),
                          "license": meta("LicenseShortName") or meta("UsageTerms"),
                          "license_url": meta("LicenseUrl"),
                          "artist": meta("Artist"),
                          "credit": meta("Credit"),
                          "description": meta("ImageDescription"),
                          "date_time_original": meta("DateTimeOriginal"),
                          "all_categories": sorted(str(c.get("title") or "").removeprefix("Category:") for c in (page.get("categories") or [])),
                          "search_terms": [],
                      })
                      if term not in row["search_terms"]:
                          row["search_terms"].append(term)
                  query_log.append({"term": term, "returned_pages": len(pages), "video_pages": videos, "status": "success"})
                  print(f"  pages={len(pages)} videos={videos} unique_total={len(rows)}", flush=True)
              except Exception as exc:
                  query_log.append({"term": term, "status": "failed", "error": f"{type(exc).__name__}: {exc}"})
                  print(f"  FAILED: {type(exc).__name__}: {exc}", flush=True)
              json.dump(sorted(rows.values(), key=lambda r: r["pageid"]), open(OUT / "video_candidates.partial.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              json.dump(query_log, open(OUT / "query_log.partial.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              time.sleep(4.0 + random.random())

          candidates = sorted(rows.values(), key=lambda r: (r["title"] or "").casefold())
          json.dump(candidates, open(OUT / "video_candidates.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          json.dump(query_log, open(OUT / "query_log.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          licenses = collections.Counter((r["license"] or "UNKNOWN") for r in candidates)
          mimes = collections.Counter(r["mime"] for r in candidates)
          summary = {
              "unique_video_files": len(candidates),
              "successful_queries": sum(q["status"] == "success" for q in query_log),
              "failed_queries": sum(q["status"] == "failed" for q in query_log),
              "license_counts": dict(licenses.most_common()),
              "mime_counts": dict(mimes.most_common()),
          }
          json.dump(summary, open(OUT / "summary.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          for row in candidates[:100]:
              print(json.dumps({k: row.get(k) for k in ("pageid", "title", "mime", "width", "height", "size_bytes", "license", "search_terms")}, ensure_ascii=False))
          if len(candidates) < 100:
              raise SystemExit(f"Only {len(candidates)} unique Commons videos were found")
          PY
          python /tmp/search_inventory.py | tee artifacts/search-inventory/inventory.log

      - name: Upload search inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tennis-video-survey-search-inventory
          path: artifacts/search-inventory/
          if-no-files-found: error
          retention-days: 7
