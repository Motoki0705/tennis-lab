name: Issue labeler

on:
  issues:
    types:
      - opened
      - edited
      - reopened
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to label"
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels from title and body
        uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          configuration-path: ".github/issue-labeler.yml"
          enable-versioned-regex: 0
          include-body: 1
          include-title: 1
          issue-number: ${{ github.event.issue.number || inputs.issue_number }}
          repo-token: ${{ github.token }}
          sync-labels: 0
