name: WSL MCP inventory refresh

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wsl-mcp-inventory-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/wsl-mcp-project-sandbox
          fetch-depth: 0
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"

      - name: Regenerate reviewed configuration inventory
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path

          from src.utils.configuration import AuditExemption, AuditRule
          from src.utils.configuration.audit import (
              regenerate_exemption_rows,
              write_generated_inventory_data,
          )

          source_root = Path("src").resolve()
          _, _, unresolved = regenerate_exemption_rows(source_root)
          unexpected = [
              finding
              for finding in unresolved
              if not finding.module.startswith("src.automation.chatgpt_mcp")
          ]
          if unexpected:
              rendered = "\n".join(repr(finding) for finding in unexpected)
              raise SystemExit("unexpected non-MCP findings:\n" + rendered)

          path_rules = {
              AuditRule.HYDRA_ABSOLUTE_PATH,
              AuditRule.FILE_PARENT_INDEX,
              AuditRule.RUNTIME_PATH_LITERAL,
              AuditRule.PATH_JOIN,
              AuditRule.PROCESS_CWD,
              AuditRule.HYDRA_RUN_DIRECTORY,
          }
          approvals = {}
          for finding in unresolved:
              if finding.rule not in path_rules:
                  reason_code = "strict-schema"
              elif finding.rule is AuditRule.FILE_PARENT_INDEX:
                  reason_code = "code-or-artifact-location"
              else:
                  reason_code = "persisted-layout"
              exemption = AuditExemption.classified(
                  module=finding.module,
                  qualified_name=finding.qualified_name,
                  line=finding.line,
                  rule=finding.rule,
                  reason_code=reason_code,
              )
              approvals.setdefault(
                  (
                      exemption.module,
                      exemption.qualified_name,
                      exemption.line,
                      exemption.rule,
                  ),
                  exemption,
              )

          migrations, exemptions = write_generated_inventory_data(
              source_root,
              source_revision="wsl-mcp-project-sandbox-v3",
              approved_exemptions=tuple(approvals.values()),
          )
          print(f"migrations={migrations} exemptions={exemptions}")
          PY

      - name: Verify refreshed inventory and MCP regression
        run: |
          uv run --locked pytest -q \
            tests/unit/utils/configuration/test_inventory.py \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp
          git diff --check

      - name: Commit inventory and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wsl-mcp-inventory-refresh.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(configuration): refresh WSL MCP inventory"
          git push origin HEAD:feat/wsl-mcp-project-sandbox
