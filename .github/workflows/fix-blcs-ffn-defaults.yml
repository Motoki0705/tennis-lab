name: Fix BLCS FFN config ownership

on:
  push:
    branches:
      - feat/swiglu-architecture-variants

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/swiglu-architecture-variants
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Make track-query FFN selection composition-owned
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/tasks/blcs/configuration.py")
          text = path.read_text(encoding="utf-8")
          class_names = (
              "TrackQueryModelConfig",
              "TrackQueryAblationModelConfig",
              "TrackQueryReferenceModelConfig",
              "TrackQueryReferenceAblationModelConfig",
          )
          for class_name in class_names:
              start = text.index(f"class {class_name}:")
              next_dataclass = text.find("\n\n@dataclass", start + 1)
              type_alias = text.find("\n\nBLCSModelConfig:", start + 1)
              candidates = [position for position in (next_dataclass, type_alias) if position >= 0]
              end = min(candidates)
              block = text[start:end]
              default_line = '    ffn_type: FFNType = "swiglu"\n'
              if block.count(default_line) != 1:
                  raise RuntimeError(f"{class_name}: expected exactly one runtime FFN default")
              block = block.replace(default_line, "", 1)
              anchor = "    ffn_dim: int\n"
              if block.count(anchor) != 1:
                  raise RuntimeError(f"{class_name}: expected exactly one ffn_dim field")
              block = block.replace(anchor, anchor + "    ffn_type: FFNType\n", 1)
              text = text[:start] + block + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and validate configuration contracts
        run: |
          uv run --locked ruff check --fix src/tasks/blcs/configuration.py
          uv run --locked ruff check src/tasks/blcs/configuration.py
          uv run --locked pytest -q -n auto --no-cov \
            tests/e2e/development/test_configuration_audit.py \
            tests/unit/utils/configuration/test_audit.py \
            tests/unit/utils/configuration/test_discovery.py \
            tests/unit/utils/configuration/test_inventory.py \
            tests/integration/tasks/blcs/test_model_configs.py \
            tests/e2e/development/test_ffn_downstream_selection.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tasks/blcs/configuration.py
          git commit -m "fix: keep BLCS FFN defaults composition-owned"
          git push origin HEAD:feat/swiglu-architecture-variants
