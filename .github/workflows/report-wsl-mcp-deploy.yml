name: Report WSL MCP deployment

on:
  workflow_run:
    workflows:
      - Deploy WSL MCP
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report deployment result to PR 723
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          <!-- wsl-mcp-deploy-report -->
          ## Deploy WSL MCP result

          - conclusion: \`${CONCLUSION}\`
          - run: \`${RUN_ID}\` (#${RUN_NUMBER}, attempt ${RUN_ATTEMPT})
          - head SHA: \`${HEAD_SHA}\`
          - run URL: ${HTML_URL}

          This report intentionally contains no service logs or credentials. Use the run ID to inspect the failed job through the GitHub Actions API/MCP.
          EOF
          )"
          payload="$(printf '%s' "$body" | python3 -c 'import json, sys; print(json.dumps({"body": sys.stdin.read()}))')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/723/comments" \
            --data "$payload" >/dev/null
