name: Resolve PR 729 conflicts

on:
  pull_request:
    branches:
      - feat/issue-695-canonical-scene-pipeline
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    if: ${{ github.head_ref == 'automation/pr729-conflict-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR 729 base branch
        uses: actions/checkout@v6
        with:
          ref: feat/issue-695-canonical-scene-pipeline
          fetch-depth: 0
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Merge main and resolve audited configuration sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:src/utils/configuration/exemption_data.py \
            > /tmp/main-exemption-data.py
          git show origin/main:src/utils/configuration/migration_data.py \
            > /tmp/main-migration-data.py

          # Override the temporary binary attribute locally so audit.py uses the
          # normal text merge. It was already proven to auto-merge both branches.
          printf '%s\n' 'src/utils/configuration/audit.py merge' \
            > .git/info/attributes

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -eq 0 ]]; then
            echo "Expected audited generated-data conflicts but merge completed cleanly."
            exit 1
          fi

          actual_conflicts="$(git diff --name-only --diff-filter=U | LC_ALL=C sort)"
          expected_conflicts="$(cat <<'EOF' | LC_ALL=C sort
          src/utils/configuration/exemption_data.py
          src/utils/configuration/inventory.py
          src/utils/configuration/migration_data.py
          EOF
          )"
          if [[ "$actual_conflicts" != "$expected_conflicts" ]]; then
            echo "Unexpected conflict set."
            echo "Expected:"
            printf '%s\n' "$expected_conflicts"
            echo "Actual:"
            printf '%s\n' "$actual_conflicts"
            exit 1
          fi

          # Keep the PR inventory and ledgers as the initial seed. The next step
          # unions the main ledgers before regenerating against the merged tree.
          git checkout --ours -- \
            src/utils/configuration/exemption_data.py \
            src/utils/configuration/inventory.py \
            src/utils/configuration/migration_data.py

          python - <<'PY'
          from pathlib import Path

          audit = Path("src/utils/configuration/audit.py").read_text(encoding="utf-8")
          if (
              '"automation": "src.automation.chatgpt_mcp.settings.GatewaySettings"'
              not in audit
          ):
              raise SystemExit("main automation replacement authority was lost")
          if "validate_scene_pipeline_boundary" not in audit:
              raise SystemExit("PR scene-pipeline validation authority was lost")

          path = Path("src/utils/configuration/inventory.py")
          inventory = path.read_text(encoding="utf-8")

          authority_needle = '''_CONFIGURATION_AUTHORITIES: Mapping[str, str] = {
              "ball_detection": "src.tasks.ball_detection.configuration.validate_training",'''
          authority_replacement = '''_CONFIGURATION_AUTHORITIES: Mapping[str, str] = {
              "automation": "src.automation.chatgpt_mcp.settings.GatewaySettings",
              "ball_detection": "src.tasks.ball_detection.configuration.validate_training",'''
          if authority_needle not in inventory:
              raise SystemExit("configuration-authority insertion point was not found")
          inventory = inventory.replace(authority_needle, authority_replacement, 1)

          domain_needle = '''    prefixes = (
                  ("src.tasks.ball_detection.", "ball_detection"),'''
          domain_replacement = '''    prefixes = (
                  ("src.automation.", "automation"),
                  ("src.tasks.ball_detection.", "ball_detection"),'''
          if domain_needle not in inventory:
              raise SystemExit("migration-domain insertion point was not found")
          inventory = inventory.replace(domain_needle, domain_replacement, 1)

          runtime_needle = "\n\n_RUNTIME_BOUNDARIES = (\n"
          runtime_replacement = '''

          _NON_HYDRA_BOUNDARY_BINDINGS: Mapping[str, tuple[str, str]] = {
              "src.automation.chatgpt_mcp.cli": (
                  "automation.chatgpt_mcp",
                  "src.utils.configuration.paths.NonHydraPathBoundary.validate",
              ),
          }


          def _non_hydra_boundary(
              module: str,
              callable_name: str,
              *,
              kind: BoundaryKind = BoundaryKind.ARGPARSE,
              domain: str = "synthetic_data_generation",
              executable_module: bool = False,
          ) -> RuntimeBoundary:
              validator_key, validator_callable = _NON_HYDRA_BOUNDARY_BINDINGS[module]
              return RuntimeBoundary(
                  domain=domain,
                  module=module,
                  callable_name=callable_name,
                  kind=kind,
                  executable_module=executable_module,
                  validator_key=validator_key,
                  validator_callable=validator_callable,
                  configuration_authority=validator_callable,
                  path_authority=validator_callable,
                  migration_target="validated typed runtime contract before side effects",
                  required_policy="all declared path arguments are present",
                  optional_policy="optional non-path values use an explicit typed contract",
                  default_authority="caller-owned explicit values only; no boundary fallback",
                  precedence_authority="one role/direction declaration per explicit path",
              )


          _RUNTIME_BOUNDARIES = (
              _non_hydra_boundary(
                  "src.automation.chatgpt_mcp.cli",
                  "main",
                  domain="automation",
              ),
          '''
          if runtime_needle not in inventory:
              raise SystemExit("runtime-boundary insertion point was not found")
          if "src.automation.chatgpt_mcp.cli" in inventory:
              raise SystemExit("automation runtime boundary unexpectedly already exists")
          inventory = inventory.replace(runtime_needle, runtime_replacement, 1)
          if "src.synthetic_data_generation.scripts.run_scene_pipeline" not in inventory:
              raise SystemExit("PR canonical scene boundary was lost")
          path.write_text(inventory, encoding="utf-8")
          PY

          git add \
            src/utils/configuration/audit.py \
            src/utils/configuration/exemption_data.py \
            src/utils/configuration/inventory.py \
            src/utils/configuration/migration_data.py
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Union ledgers, regenerate, and self-audit
        shell: bash
        run: |
          set -euo pipefail
          source_revision="pr729-main-$(git rev-parse --short=12 origin/main)"
          SOURCE_REVISION="$source_revision" uv run --locked python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import runpy
          import zlib
          from pathlib import Path
          from typing import Any

          import src.utils.configuration.audit as audit
          import src.utils.configuration.inventory as inventory


          def decode_rows(
              path: Path,
              *,
              payload_key: str,
              digest_key: str,
              count_key: str,
          ) -> list[list[Any]]:
              namespace = runpy.run_path(str(path))
              encoded = "".join(str(namespace[payload_key]).split()).encode("ascii")
              serialized = zlib.decompress(base64.b85decode(encoded))
              digest = hashlib.sha256(serialized).hexdigest()
              if digest != namespace[digest_key]:
                  raise SystemExit(f"payload digest mismatch for {path}")
              decoded = json.loads(serialized)
              if not isinstance(decoded, list) or len(decoded) != namespace[count_key]:
                  raise SystemExit(f"payload record count mismatch for {path}")
              return decoded


          main_exemption_rows = decode_rows(
              Path("/tmp/main-exemption-data.py"),
              payload_key="AUDIT_EXEMPTION_PAYLOAD",
              digest_key="AUDIT_EXEMPTION_SHA256",
              count_key="AUDIT_EXEMPTION_RECORD_COUNT",
          )
          main_migration_rows = decode_rows(
              Path("/tmp/main-migration-data.py"),
              payload_key="MIGRATION_LEDGER_PAYLOAD",
              digest_key="MIGRATION_LEDGER_SHA256",
              count_key="MIGRATION_LEDGER_RECORD_COUNT",
          )

          exemptions = {
              (item.module, item.qualified_name, item.line, item.rule): item
              for item in inventory.DEFAULT_AUDIT_INVENTORY.exemptions
          }
          for raw in main_exemption_rows:
              if not isinstance(raw, list) or len(raw) != 5:
                  raise SystemExit("main exemption row is not strict five-field data")
              module, qualified_name, line, raw_rule, reason_code = raw
              item = inventory.AuditExemption.classified(
                  module=str(module),
                  qualified_name=str(qualified_name),
                  line=int(line),
                  rule=inventory.AuditRule(str(raw_rule)),
                  reason_code=str(reason_code),
              )
              key = (item.module, item.qualified_name, item.line, item.rule)
              previous = exemptions.get(key)
              if previous is not None and previous.reason != item.reason:
                  raise SystemExit(f"conflicting exemption classification: {key!r}")
              exemptions[key] = item

          boundaries = inventory.DEFAULT_AUDIT_INVENTORY.boundaries


          def migration_from_row(raw: list[Any]) -> inventory.MigrationRecord:
              if not isinstance(raw, list) or len(raw) != 12:
                  raise SystemExit("main migration row is not strict twelve-field data")
              (
                  record_id,
                  former_module,
                  former_name,
                  former_line,
                  former_column,
                  former_route,
                  current_occurrences,
                  raw_category,
                  raw_status,
                  raw_authority_kind,
                  canonical_symbol,
                  authority_field,
              ) = raw
              category = inventory.MigrationCategory(str(raw_category))
              status = inventory.MigrationStatus(str(raw_status))
              authority_kind = inventory.MigrationAuthorityKind(
                  str(raw_authority_kind)
              )
              domain = inventory._migration_record_domain(
                  str(former_module),
                  status=status,
                  canonical_symbol=str(canonical_symbol),
              )
              return inventory.MigrationRecord(
                  record_id=str(record_id),
                  former_module=str(former_module),
                  former_qualified_name=str(former_name),
                  former_line=int(former_line),
                  former_column=int(former_column),
                  former_route=str(former_route),
                  expected_current_occurrences=int(current_occurrences),
                  category=category,
                  canonical_symbol=str(canonical_symbol),
                  authority_kind=authority_kind,
                  authority_field=(
                      None if authority_field is None else str(authority_field)
                  ),
                  migration_target=inventory._MIGRATION_TARGETS[category],
                  status=status,
                  domain=domain,
                  entrypoint_coverage=inventory.migration_entrypoint_coverage(
                      domain, boundaries
                  ),
              )


          migrations = {
              (
                  item.former_module,
                  item.former_qualified_name,
                  item.former_line,
                  item.former_column,
                  item.former_route,
                  item.category,
              ): item
              for item in inventory.DEFAULT_AUDIT_INVENTORY.migrations
          }
          for raw in main_migration_rows:
              item = migration_from_row(raw)
              key = (
                  item.former_module,
                  item.former_qualified_name,
                  item.former_line,
                  item.former_column,
                  item.former_route,
                  item.category,
              )
              previous = migrations.get(key)
              if previous is not None and previous.record_id != item.record_id:
                  raise SystemExit(f"conflicting migration identity: {key!r}")
              migrations[key] = item

          combined = inventory.AuditInventory(
              boundaries=boundaries,
              migrations=tuple(
                  migrations[key]
                  for key in sorted(
                      migrations,
                      key=lambda value: (
                          value[0],
                          value[2],
                          value[3],
                          value[4],
                      ),
                  )
              ),
              exemptions=tuple(exemptions[key] for key in sorted(exemptions)),
              rules=inventory.DEFAULT_AUDIT_INVENTORY.rules,
          )
          audit.DEFAULT_AUDIT_INVENTORY = combined
          audit.write_generated_inventory_data(
              Path("src"),
              source_revision=os.environ["SOURCE_REVISION"],
          )
          PY

          uv run --locked python scripts/audit_configuration.py src
          uv run --locked ruff check \
            src/utils/configuration/audit.py \
            src/utils/configuration/exemption_data.py \
            src/utils/configuration/inventory.py \
            src/utils/configuration/migration_data.py
          uv run --locked mypy --follow-imports=skip \
            src/utils/configuration/audit.py \
            src/utils/configuration/inventory.py
          uv run --locked pytest -q -n 0 \
            tests/e2e/development/test_configuration_audit.py \
            tests/unit/utils/configuration

      - name: Commit and push resolved merge
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/resolve-pr-729-conflicts.yml
          git rm .gitattributes
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge(main): resolve PR 729 configuration inventory conflicts"
          git push origin HEAD:feat/issue-695-canonical-scene-pipeline

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 729 --repo Motoki0705/tennis-lab --body \
            "Conflict resolver PASS. Merged current main, unioned and regenerated both immutable configuration inventories, preserved automation and canonical scene boundaries, and pushed commit $(git rev-parse HEAD). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 729 --repo Motoki0705/tennis-lab --body \
            "Conflict resolver FAILED without updating the PR branch. Inspect run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
