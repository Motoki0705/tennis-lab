name: Resolve PR 729 conflicts

on:
  pull_request:
    branches:
      - feat/issue-695-canonical-scene-pipeline
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    if: ${{ github.head_ref == 'automation/pr729-conflict-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR 729 branch
        uses: actions/checkout@v6
        with:
          ref: feat/issue-695-canonical-scene-pipeline
          fetch-depth: 0
          submodules: false

      - name: Set up locked Python environment
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Merge main and resolve source conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:src/utils/configuration/exemption_data.py > /tmp/main-exemptions.py
          git show origin/main:src/utils/configuration/migration_data.py > /tmp/main-migrations.py

          # The tracked attribute was only used to force an earlier diagnostic
          # conflict. Restore normal text merging locally for the real merge.
          printf '%s\n' 'src/utils/configuration/audit.py merge' > .git/info/attributes

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -eq 0 ]]; then
            echo "Expected generated-inventory conflicts but merge completed cleanly."
            exit 1
          fi

          actual="$(git diff --name-only --diff-filter=U | LC_ALL=C sort)"
          expected="$(cat <<'EOF' | LC_ALL=C sort
          src/utils/configuration/exemption_data.py
          src/utils/configuration/inventory.py
          src/utils/configuration/migration_data.py
          EOF
          )"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected conflict set"
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual"
            exit 1
          fi

          git checkout --ours -- \
            src/utils/configuration/exemption_data.py \
            src/utils/configuration/inventory.py \
            src/utils/configuration/migration_data.py

          python - <<'PY'
          from pathlib import Path

          audit = Path("src/utils/configuration/audit.py").read_text(encoding="utf-8")
          if '"automation": "src.automation.chatgpt_mcp.settings.GatewaySettings"' not in audit:
              raise SystemExit("main automation replacement authority was lost")
          if "validate_scene_pipeline_boundary" not in audit:
              raise SystemExit("PR scene-pipeline authority was lost")

          path = Path("src/utils/configuration/inventory.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  '''_CONFIGURATION_AUTHORITIES: Mapping[str, str] = {
              "ball_detection": "src.tasks.ball_detection.configuration.validate_training",''',
                  '''_CONFIGURATION_AUTHORITIES: Mapping[str, str] = {
              "automation": "src.automation.chatgpt_mcp.settings.GatewaySettings",
              "ball_detection": "src.tasks.ball_detection.configuration.validate_training",''',
              ),
              (
                  '''    prefixes = (
                  ("src.tasks.ball_detection.", "ball_detection"),''',
                  '''    prefixes = (
                  ("src.automation.", "automation"),
                  ("src.tasks.ball_detection.", "ball_detection"),''',
              ),
          )
          for needle, replacement in replacements:
              if needle not in text:
                  raise SystemExit(f"inventory insertion point not found: {needle[:40]!r}")
              text = text.replace(needle, replacement, 1)

          runtime_marker = "\n\n_RUNTIME_BOUNDARIES = (\n"
          runtime_definition = '''

          _NON_HYDRA_BOUNDARY_BINDINGS: Mapping[str, tuple[str, str]] = {
              "src.automation.chatgpt_mcp.cli": (
                  "automation.chatgpt_mcp",
                  "src.utils.configuration.paths.NonHydraPathBoundary.validate",
              ),
          }


          def _non_hydra_boundary(
              module: str,
              callable_name: str,
              *,
              kind: BoundaryKind = BoundaryKind.ARGPARSE,
              domain: str = "synthetic_data_generation",
              executable_module: bool = False,
          ) -> RuntimeBoundary:
              validator_key, validator_callable = _NON_HYDRA_BOUNDARY_BINDINGS[module]
              return RuntimeBoundary(
                  domain=domain,
                  module=module,
                  callable_name=callable_name,
                  kind=kind,
                  executable_module=executable_module,
                  validator_key=validator_key,
                  validator_callable=validator_callable,
                  configuration_authority=validator_callable,
                  path_authority=validator_callable,
                  migration_target="validated typed runtime contract before side effects",
                  required_policy="all declared path arguments are present",
                  optional_policy="optional non-path values use an explicit typed contract",
                  default_authority="caller-owned explicit values only; no boundary fallback",
                  precedence_authority="one role/direction declaration per explicit path",
              )


          _RUNTIME_BOUNDARIES = (
              _non_hydra_boundary(
                  "src.automation.chatgpt_mcp.cli",
                  "main",
                  domain="automation",
              ),
          '''
          if runtime_marker not in text or "src.automation.chatgpt_mcp.cli" in text:
              raise SystemExit("automation runtime-boundary insertion is ambiguous")
          text = text.replace(runtime_marker, runtime_definition, 1)
          if "src.synthetic_data_generation.scripts.run_scene_pipeline" not in text:
              raise SystemExit("PR canonical scene boundary was lost")
          path.write_text(text, encoding="utf-8")
          PY

          git add src/utils/configuration/{audit,exemption_data,inventory,migration_data}.py
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Union branch ledgers and regenerate final data
        shell: bash
        run: |
          set -euo pipefail
          source_revision="pr729-main-$(git rev-parse --short=12 origin/main)"
          SOURCE_REVISION="$source_revision" uv run --locked python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import runpy
          import zlib
          from pathlib import Path
          from types import SimpleNamespace
          from typing import Any

          import src.utils.configuration.audit as audit
          import src.utils.configuration.inventory as inv


          def decode(path: str, payload: str, digest: str, count: str) -> list[list[Any]]:
              namespace = runpy.run_path(path)
              encoded = "".join(str(namespace[payload]).split()).encode("ascii")
              serialized = zlib.decompress(base64.b85decode(encoded))
              if hashlib.sha256(serialized).hexdigest() != namespace[digest]:
                  raise SystemExit(f"payload checksum mismatch: {path}")
              rows = json.loads(serialized)
              if not isinstance(rows, list) or len(rows) != namespace[count]:
                  raise SystemExit(f"payload count mismatch: {path}")
              return rows


          exemption_rows = decode(
              "/tmp/main-exemptions.py",
              "AUDIT_EXEMPTION_PAYLOAD",
              "AUDIT_EXEMPTION_SHA256",
              "AUDIT_EXEMPTION_RECORD_COUNT",
          )
          migration_rows = decode(
              "/tmp/main-migrations.py",
              "MIGRATION_LEDGER_PAYLOAD",
              "MIGRATION_LEDGER_SHA256",
              "MIGRATION_LEDGER_RECORD_COUNT",
          )

          exemptions = {
              (item.module, item.qualified_name, item.line, item.rule): item
              for item in inv.DEFAULT_AUDIT_INVENTORY.exemptions
          }
          for row in exemption_rows:
              if not isinstance(row, list) or len(row) != 5:
                  raise SystemExit("main exemption row is not strict")
              module, name, line, rule, reason = row
              item = inv.AuditExemption.classified(
                  module=str(module),
                  qualified_name=str(name),
                  line=int(line),
                  rule=inv.AuditRule(str(rule)),
                  reason_code=str(reason),
              )
              key = (item.module, item.qualified_name, item.line, item.rule)
              previous = exemptions.get(key)
              if previous is not None and previous.reason != item.reason:
                  raise SystemExit(f"conflicting exemption: {key!r}")
              exemptions[key] = item

          boundaries = inv.DEFAULT_AUDIT_INVENTORY.boundaries

          def migration(row: list[Any]) -> inv.MigrationRecord:
              if not isinstance(row, list) or len(row) != 12:
                  raise SystemExit("main migration row is not strict")
              (
                  record_id, module, name, line, column, route, occurrences,
                  raw_category, raw_status, raw_authority, symbol, field,
              ) = row
              category = inv.MigrationCategory(str(raw_category))
              status = inv.MigrationStatus(str(raw_status))
              domain = inv._migration_record_domain(
                  str(module), status=status, canonical_symbol=str(symbol)
              )
              return inv.MigrationRecord(
                  record_id=str(record_id),
                  former_module=str(module),
                  former_qualified_name=str(name),
                  former_line=int(line),
                  former_column=int(column),
                  former_route=str(route),
                  expected_current_occurrences=int(occurrences),
                  category=category,
                  canonical_symbol=str(symbol),
                  authority_kind=inv.MigrationAuthorityKind(str(raw_authority)),
                  authority_field=None if field is None else str(field),
                  migration_target=inv._MIGRATION_TARGETS[category],
                  status=status,
                  domain=domain,
                  entrypoint_coverage=inv.migration_entrypoint_coverage(domain, boundaries),
              )

          migrations = {
              (
                  item.former_module, item.former_qualified_name,
                  item.former_line, item.former_column,
                  item.former_route, item.category,
              ): item
              for item in inv.DEFAULT_AUDIT_INVENTORY.migrations
          }
          for row in migration_rows:
              item = migration(row)
              key = (
                  item.former_module, item.former_qualified_name,
                  item.former_line, item.former_column,
                  item.former_route, item.category,
              )
              previous = migrations.get(key)
              if previous is not None and previous.record_id != item.record_id:
                  raise SystemExit(f"conflicting migration identity: {key!r}")
              migrations[key] = item

          # This is only a regeneration seed. The generated files are imported
          # and fully validated in a fresh process immediately afterward.
          audit.DEFAULT_AUDIT_INVENTORY = SimpleNamespace(
              boundaries=boundaries,
              migrations=tuple(migrations.values()),
              exemptions=tuple(exemptions.values()),
              rules=inv.DEFAULT_AUDIT_INVENTORY.rules,
          )
          audit.write_generated_inventory_data(
              Path("src"), source_revision=os.environ["SOURCE_REVISION"]
          )
          PY

          # Fresh imports enforce all immutable metadata, migration/exemption
          # parity, boundary coverage, and current-source exactness.
          uv run --locked python scripts/audit_configuration.py src
          uv run --locked ruff check src/utils/configuration/{audit,exemption_data,inventory,migration_data}.py

      - name: Commit and push resolved merge
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/resolve-pr-729-conflicts.yml
          git rm .gitattributes
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge(main): resolve PR 729 configuration inventory conflicts"
          git push origin HEAD:feat/issue-695-canonical-scene-pipeline

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            message="Conflict resolver PASS. Merged current main, unioned and regenerated both audit ledgers, and pushed $(git rev-parse HEAD)."
          else
            message="Conflict resolver FAILED without updating PR #729."
          fi
          gh pr comment 729 --repo Motoki0705/tennis-lab --body \
            "$message Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
