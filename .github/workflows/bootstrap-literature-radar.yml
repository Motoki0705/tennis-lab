name: Bootstrap literature radar implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/literature-radar-knowledge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/literature-radar-knowledge
          fetch-depth: 0

      - name: Verify and prepare implementation
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f knowledge/literature/README.md ]]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat .github/literature-radar-bootstrap/part-* > /tmp/literature-radar.tar.gz.b64
          base64 --decode /tmp/literature-radar.tar.gz.b64 > /tmp/literature-radar.tar.gz
          echo "aaa4ae50e4137d13d8bc38b94047de509ce13ea5f0127ca8d4feb407d8c6c6ae  /tmp/literature-radar.tar.gz" | sha256sum --check -
          tar -xzf /tmp/literature-radar.tar.gz -C .
          git checkout HEAD -- .github/workflows/ci.yml
          rm -f .github/workflows/literature-radar-ingest.yml
          rm -rf .github/literature-radar-bootstrap
          echo "apply=true" >> "$GITHUB_OUTPUT"

      - name: Commit non-workflow implementation
        if: steps.prepare.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(knowledge): add scheduled literature radar"
          git push origin HEAD:feat/literature-radar-knowledge
