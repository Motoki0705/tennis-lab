name: Court mixed-source training once

on:
  push:
    branches:
      - feat/court-mixed-source-batches
    paths:
      - .github/workflows/court-mixed-training-once.yml

permissions:
  contents: write

concurrency:
  group: court-mixed-source-training-once
  cancel-in-progress: false

jobs:
  train-register:
    if: >-
      ${{ github.actor == github.repository_owner &&
          vars.LOCAL_GPU_ACTIONS_ENABLED == 'true' }}
    environment: local-gpu
    runs-on: [self-hosted, linux, x64, local-gpu, cuda, wsl2, tennis-lab]
    timeout-minutes: 1440

    env:
      HOST_REPO: /home/kamimura/projects/tennis-lab
      HOST_PY: /home/kamimura/projects/tennis-lab/.venv/bin/python
      STATE_ROOT: /var/lib/tennis-lab-actions
      QUEUE: /opt/tennis-lab-actions/bin/training_queue.sh
      DENSE_NAME: court_mixed_hierarchical_dense_only_v3_b8_a16_e100
      POSE_NAME: court_mixed_hierarchical_pose_consistency_v3_b8_a16_e100
      DENSE_COMMAND: >-
        CUDA_VISIBLE_DEVICES=0 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
        /home/kamimura/projects/tennis-lab/.venv/bin/python
        -m src.tasks.court_detection.scripts.train_mixed
        model=hierarchical data/processing=all data/augmentation=pose_safe
        data.source.keypoint_court_scope=target_court
        data.batch_size=8 data.num_workers=8
        paths.data_root=/home/kamimura/projects/tennis-lab/data
        paths.external_asset_root=/home/kamimura/projects/tennis-lab/third_party
        paths.cache_root=/home/kamimura/projects/tennis-lab/.cache
        loss.pose.enabled=false loss.pose.translation_weight=0.0
        loss.pose.rotation_weight=0.0 loss.pose.focal_weight=0.0
        loss.consistency.enabled=false loss.consistency.weight=0.0
        loss.consistency.cheirality_weight=0.0
        loss.consistency.warmup_fraction=0.0
        training.compile.enabled=false
        training.trainer.max_epochs=100
        training.trainer.accumulate_grad_batches=16
        training.trainer.check_val_every_n_epoch=5
        training.trainer.enable_progress_bar=false
        training.trainer.enable_model_summary=false
        training.early_stopping.enabled=false
        training.qualitative_logging.enabled=false
        run.seed=42 run.test_after_fit=true
        run.output_dir=court_detection/mixed-source/hierarchical-dense-only-v3-b8-a16-e100
      POSE_COMMAND: >-
        CUDA_VISIBLE_DEVICES=0 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
        /home/kamimura/projects/tennis-lab/.venv/bin/python
        -m src.tasks.court_detection.scripts.train_mixed
        model=hierarchical data/processing=all data/augmentation=pose_safe
        data.source.keypoint_court_scope=target_court
        data.batch_size=8 data.num_workers=8
        paths.data_root=/home/kamimura/projects/tennis-lab/data
        paths.external_asset_root=/home/kamimura/projects/tennis-lab/third_party
        paths.cache_root=/home/kamimura/projects/tennis-lab/.cache
        loss.pose.enabled=true loss.pose.translation_weight=1.0
        loss.pose.rotation_weight=1.0 loss.pose.focal_weight=1.0
        loss.consistency.enabled=true loss.consistency.weight=1.0
        loss.consistency.cheirality_weight=0.0
        loss.consistency.warmup_fraction=0.0
        training.compile.enabled=false
        training.trainer.max_epochs=100
        training.trainer.accumulate_grad_batches=16
        training.trainer.check_val_every_n_epoch=5
        training.trainer.enable_progress_bar=false
        training.trainer.enable_model_summary=false
        training.early_stopping.enabled=false
        training.qualitative_logging.enabled=false
        run.seed=42 run.test_after_fit=true
        run.output_dir=court_detection/mixed-source/hierarchical-pose-consistency-v3-b8-a16-e100

    steps:
      - name: Checkout trusted feature revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/court-mixed-source-batches
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive

      - name: Verify B00 V3 authority
        shell: bash
        run: |
          set -euo pipefail
          test -x "$HOST_PY"
          "$HOST_PY" - <<'PY'
          import json
          from pathlib import Path

          path = Path("/var/lib/tennis-lab-actions/assets/data/synthetic_data_generation/scenes/B00/datasets/court/dataset.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          accepted = len(payload.get("samples", []))
          rejected = len(payload.get("rejected_samples", []))
          proposals = accepted + rejected
          assert payload.get("schema") == "canonical_court_dataset_v3", payload.get("schema")
          assert payload.get("status") == "completed", payload.get("status")
          assert payload.get("seed") == 695, payload.get("seed")
          assert payload.get("profile") == "b00-production", payload.get("profile")
          assert (proposals, accepted, rejected) == (3336, 3293, 43), (proposals, accepted, rejected)
          print(f"B00 V3 verified: proposals={proposals} accepted={accepted} rejected={rejected}")
          PY

      - name: Run targeted implementation checks
        shell: bash
        run: |
          set -euo pipefail
          "$HOST_PY" -m pytest -q \
            tests/unit/tasks/court_detection/test_mixed_training.py \
            tests/unit/synthetic_data_generation/pipeline/test_court_rerun_authority.py \
            tests/unit/synthetic_data_generation/pipeline/test_run_manifest_portability.py
          "$HOST_PY" -m ruff check \
            src/tasks/court_detection/configs/train_mixed.yaml \
            src/tasks/court_detection/data/mixed.py \
            src/tasks/court_detection/model_io/mixed_adapter.py \
            src/tasks/court_detection/scripts/train_mixed.py \
            src/tasks/court_detection/training/lightning_module_mixed.py \
            src/tasks/court_detection/training/runner_mixed.py \
            tests/unit/tasks/court_detection/test_mixed_training.py \
            tests/unit/synthetic_data_generation/pipeline/test_court_rerun_authority.py \
            tests/unit/synthetic_data_generation/pipeline/test_run_manifest_portability.py

      - name: Materialize V3 and real dense targets
        shell: bash
        run: |
          set -euo pipefail
          "$HOST_PY" -m src.tasks.court_detection.scripts.materialize_targets \
            data/source=synthetic_court \
            data.source.keypoint_court_scope=target_court \
            data/processing=seg_line \
            paths.data_root="$HOST_REPO/data" \
            paths.external_asset_root="$HOST_REPO/third_party"
          "$HOST_PY" -m src.tasks.court_detection.scripts.materialize_targets \
            data/source=tennis_court_detector \
            data/processing=seg_line \
            paths.data_root="$HOST_REPO/data" \
            paths.external_asset_root="$HOST_REPO/third_party"

      - name: Validate both mixed configurations against real data
        shell: bash
        run: |
          set -euo pipefail
          common=(
            model=hierarchical
            data/processing=all
            data/augmentation=pose_safe
            data.source.keypoint_court_scope=target_court
            data.batch_size=8
            data.num_workers=0
            paths.data_root="$HOST_REPO/data"
            paths.external_asset_root="$HOST_REPO/third_party"
            paths.cache_root="$HOST_REPO/.cache"
            training.compile.enabled=false
            run.dry_run=true
            run.test_after_fit=false
          )
          "$HOST_PY" -m src.tasks.court_detection.scripts.train_mixed \
            "${common[@]}" \
            loss.pose.enabled=false \
            loss.pose.translation_weight=0.0 \
            loss.pose.rotation_weight=0.0 \
            loss.pose.focal_weight=0.0 \
            loss.consistency.enabled=false \
            loss.consistency.weight=0.0
          "$HOST_PY" -m src.tasks.court_detection.scripts.train_mixed \
            "${common[@]}" \
            loss.pose.enabled=true \
            loss.pose.translation_weight=1.0 \
            loss.pose.rotation_weight=1.0 \
            loss.pose.focal_weight=1.0 \
            loss.consistency.enabled=true \
            loss.consistency.weight=1.0

      - name: Create persistent checkout and enqueue both runs
        id: enqueue
        shell: bash
        run: |
          set -euo pipefail
          test -x "$QUEUE"
          systemctl is-active --quiet tennis-lab-training-queue.service

          run_root="$STATE_ROOT/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_repository="$run_root/repository"
          test ! -e "$run_root"
          install -d -m 0700 "$run_root"
          git clone --no-local --no-checkout "$GITHUB_WORKSPACE" "$run_repository"
          git -C "$run_repository" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$run_repository" checkout --detach "$GITHUB_SHA"
          git -C "$run_repository" submodule update --init --recursive --depth 1
          test "$(git -C "$run_repository" rev-parse HEAD)" = "$GITHUB_SHA"

          for asset_name in data ckpt; do
            asset_source="$STATE_ROOT/assets/$asset_name"
            asset_target="$run_repository/$asset_name"
            test -d "$asset_source"
            test ! -e "$asset_target"
            test ! -L "$asset_target"
            ln -s "$asset_source" "$asset_target"
          done

          add_job() {
            local name="$1"
            local command="$2"
            local output
            output="$(
              cd "$run_repository"
              TRAINING_QUEUE_DIR="$STATE_ROOT/training-queue" \
                "$QUEUE" add "$command" \
                  --name "$name" \
                  --provider github-actions \
                  --session "$GITHUB_RUN_ID" \
                  --prune-ckpt
            )"
            printf '%s\n' "$output" >&2
            local job="${output#queued: }"
            [[ "$job" != "$output" && "$job" == *.job ]]
            printf '%s' "$job"
          }

          first_job="$(add_job "$DENSE_NAME" "$DENSE_COMMAND")"
          second_job="$(add_job "$POSE_NAME" "$POSE_COMMAND")"
          {
            echo "RUN_REPOSITORY=$run_repository"
            echo "FIRST_JOB=$first_job"
            echo "SECOND_JOB=$second_job"
          } >> "$GITHUB_ENV"
          echo "first_job=$first_job" >> "$GITHUB_OUTPUT"
          echo "second_job=$second_job" >> "$GITHUB_OUTPUT"
          TRAINING_QUEUE_DIR="$STATE_ROOT/training-queue" "$QUEUE" status

      - name: Wait for queued experiments
        shell: bash
        run: |
          set -euo pipefail
          queue_dir="$STATE_ROOT/training-queue"
          worker_log="$queue_dir/worker.log"

          wait_job() {
            local job="$1"
            local stem="${job%.job}"
            if [[ ! -f "$queue_dir/done/$job" && ! -f "$queue_dir/failed/$job" ]]; then
              local pattern="done: ${job}|FAILED.*${job}"
              tail -n 20000 -F "$worker_log" | grep -m1 -E "$pattern"
            fi
            if [[ -f "$queue_dir/failed/$job" ]]; then
              echo "Training failed: $job" >&2
              cat "$queue_dir/logs/${stem}.log" >&2
              return 1
            fi
            test -f "$queue_dir/done/$job"
            echo "Training completed: $job"
            tail -n 120 "$queue_dir/logs/${stem}.log"
          }

          wait_job "$FIRST_JOB"
          wait_job "$SECOND_JOB"

      - name: Register results in the knowledge graph
        shell: bash
        run: |
          set -euo pipefail
          queue_dir="$STATE_ROOT/training-queue"
          cd "$RUN_REPOSITORY"
          ln -sfn "$queue_dir" .training_queue

          skill=.agents/skills/knowledge-control/scripts
          "$HOST_PY" "$skill/kg_register.py" "$DENSE_NAME" --provider codex
          "$HOST_PY" "$skill/kg_register.py" "$POSE_NAME" --provider codex

          dense_id=run-court-mixed-hierarchical-dense-only-v3-b8-a16-e100
          pose_id=run-court-mixed-hierarchical-pose-consistency-v3-b8-a16-e100
          "$HOST_PY" "$skill/kg_curves.py" "$dense_id" || true
          "$HOST_PY" "$skill/kg_curves.py" "$pose_id" || true

          "$HOST_PY" - <<'PY'
          from __future__ import annotations

          import sys
          from pathlib import Path

          scripts = Path(".agents/skills/knowledge-control/scripts").resolve()
          sys.path.insert(0, str(scripts))
          from kg_lib import dump_frontmatter, parse_node

          nodes = Path("knowledge/nodes")
          dense_id = "run-court-mixed-hierarchical-dense-only-v3-b8-a16-e100"
          pose_id = "run-court-mixed-hierarchical-pose-consistency-v3-b8-a16-e100"
          group_id = "group-court-mixed-hierarchical-v3-pose-consistency"

          def number(value: object) -> str:
              if isinstance(value, (int, float)):
                  return f"{float(value):.6g}"
              return str(value)

          def metrics_table(metrics: dict[str, object]) -> str:
              if not metrics:
                  return "テストメトリクスは保存されていない。"
              rows = ["| Metric | Value |", "|---|---:|"]
              rows.extend(f"| `{key}` | {number(value)} |" for key, value in sorted(metrics.items()))
              return "\n".join(rows)

          def comparison_table(left: dict[str, object], right: dict[str, object]) -> str:
              common = sorted(set(left) & set(right))
              rows = ["| Metric | Dense only | Pose + consistency | Δ (後者−前者) |", "|---|---:|---:|---:|"]
              for key in common:
                  a, b = left[key], right[key]
                  if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                      rows.append(f"| `{key}` | {number(a)} | {number(b)} | {number(float(b) - float(a))} |")
              return "\n".join(rows) if len(rows) > 2 else "共通する数値メトリクスはない。"

          def write_run(node_id: str, *, title: str, pose: bool, relation: list[dict[str, str]], body: str) -> dict[str, object]:
              path = nodes / f"{node_id}.md"
              node = parse_node(path)
              meta = node.meta
              meta["title"] = title
              meta["provider"] = "codex"
              meta["config"] = {
                  "model": "hierarchical (DINOv3 + transformer encoder + DPT)",
                  "data": "Synthetic Court V3 + TennisCourtDetector, 4+4 samples per batch",
                  "processing": "kp + seg + line",
                  "augmentation": "pose_safe",
                  "batch": "micro 8, accumulation 16, effective 128",
                  "epochs": 100,
                  "seed": 42,
                  "pose": pose,
                  "consistency": pose,
                  "pose_scope": "synthetic_court only" if pose else "disabled",
              }
              meta["parents"] = []
              meta["relations"] = relation
              meta["tags"] = [
                  "court-detection",
                  "mixed-source",
                  "synthetic-court-v3",
                  "tennis-court-detector",
                  "hierarchical",
                  "effective-batch-128",
                  *( ["pose", "consistency", "synthetic-only-supervision"] if pose else ["dense-only"] ),
              ]
              path.write_text(f"---\n{dump_frontmatter(meta)}---\n\n{body.strip()}\n", encoding="utf-8")
              return dict(meta.get("metrics") or {})

          dense_path = nodes / f"{dense_id}.md"
          pose_path = nodes / f"{pose_id}.md"
          dense_metrics = dict(parse_node(dense_path).meta.get("metrics") or {})
          pose_metrics = dict(parse_node(pose_path).meta.get("metrics") or {})

          dense_body = f"""
          ## 考察 / Findings

          ### 要約
          Synthetic Court V3とTennisCourtDetectorを各batchで4件ずつ混合し、KP/SEG/LINEのみで100 epoch学習した比較基準runである。poseとconsistencyは明示的に無効化した。

          ### アーキテクチャ詳細
          `hierarchical`のDINOv3 encoder、spatial transformer encoder、DPT decoderを使用した。両sourceへ同じ`pose_safe`幾何変換を適用し、micro-batch 8、gradient accumulation 16でeffective batch 128とした。

          ### メトリクスの解釈
          {metrics_table(dense_metrics)}

          数値は保存済みtest split predictionから登録した実測値である。test splitを持たないTennisCourtDetectorをvalidationの代替として流用していないため、test値はSynthetic Court V3側の明示的test splitを中心に読む必要がある。

          ### アーキテクチャ⇄メトリクスの因果考察
          このrun単独から混合学習の因果効果は断定できない。後続のpose+consistency runとdata、augmentation、seed、batch、epochを一致させ、追加objectiveの影響を比較する基準として扱う。

          ### 既存実験との比較
          本runは今回のmatched comparisonにおけるbaselineであり、直接のparent runは設定していない。

          ### 次に有効な実験
          pose+consistencyをsynthetic sampleだけに適用したmatched runと、共通dense metricおよびpose geometry metricを比較する。
          """
          write_run(
              dense_id,
              title="Court mixed-source hierarchical dense-only (V3, EB128)",
              pose=False,
              relation=[],
              body=dense_body,
          )

          compare = comparison_table(dense_metrics, pose_metrics)
          pose_body = f"""
          ## 考察 / Findings

          ### 要約
          dense-only基準と同じmixed batchを使い、poseおよびKP–pose consistencyをSynthetic Court V3の4 sampleだけへ適用したrunである。TennisCourtDetector sampleには両lossの教師もgradientも与えていない。

          ### アーキテクチャ詳細
          dense branchは8 sample全体でKP/SEG/LINEを学習する。一方、`pose_supervision_mask`でsynthetic sampleだけを抽出し、translation、rotation、log-focal、consistencyを計算する。その他のdata、augmentation、seed、effective batch、epochはdense-only runと一致する。

          ### メトリクスの解釈
          {metrics_table(pose_metrics)}

          dense-onlyとの差分は以下の通りである。Δはpose+consistencyからdense-onlyを引いた値であり、metricごとの改善方向は定義に従って個別に判断する。

          {compare}

          ### アーキテクチャ⇄メトリクスの因果考察
          両run間で意図的に変更した要素はsynthetic限定のpose/consistency objectiveであるため、共通metric差はこの追加objectiveに関連する観測として扱える。ただし単一seedのため、ばらつきを超える因果効果かどうかは未確定である。

          ### 既存実験との比較
          `{dense_id}`とのmatched comparisonである。TennisCourtDetector側のpose outputをlossから除外するcontractは単体テストでもgradient 0として検証している。

          ### 次に有効な実験
          seedを追加して共通dense metricとpose metricの分散を測り、consistency weightおよびwarmupの感度を評価する。
          """
          write_run(
              pose_id,
              title="Court mixed-source hierarchical synthetic-only pose+consistency (V3, EB128)",
              pose=True,
              relation=[{"to": dense_id, "rel": "compares"}],
              body=pose_body,
          )

          group_meta = {
              "id": group_id,
              "type": "group",
              "title": "Court mixed-source hierarchical: pose/consistency比較 (V3)",
              "members": [dense_id, pose_id],
              "parents": [],
              "tags": [
                  "court-detection",
                  "mixed-source",
                  "synthetic-court-v3",
                  "pose",
                  "consistency",
                  "ablation",
              ],
          }
          group_body = f"""
          ## まとめ

          Synthetic Court V3とTennisCourtDetectorを同一batch内で4:4に固定したmatched comparisonである。両runは`hierarchical`、`pose_safe`、seed 42、effective batch 128、100 epochを共有し、synthetic限定pose/consistency objectiveの有無だけを比較する。

          {compare}

          各metricの定義と収束挙動の詳細は個別run nodeを正本とする。単一seedのため、差分の再現性は追加seedで確認する必要がある。
          """
          (nodes / f"{group_id}.md").write_text(
              f"---\n{dump_frontmatter(group_meta)}---\n\n{group_body.strip()}\n",
              encoding="utf-8",
          )
          PY

          "$HOST_PY" "$skill/kg_validate.py"

      - name: Commit knowledge results and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RUN_REPOSITORY/knowledge/." "$GITHUB_WORKSPACE/knowledge/"
          cd "$GITHUB_WORKSPACE"
          rm -f .github/workflows/court-mixed-training-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge .github/workflows/court-mixed-training-once.yml
          git status --short
          git commit -m "exp(court): register mixed-source training results"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          {
            echo "### Court mixed-source experiments completed"
            echo
            echo "- Dense-only job: \`$FIRST_JOB\`"
            echo "- Pose+consistency job: \`$SECOND_JOB\`"
            echo "- Knowledge nodes:"
            echo "  - \`run-court-mixed-hierarchical-dense-only-v3-b8-a16-e100\`"
            echo "  - \`run-court-mixed-hierarchical-pose-consistency-v3-b8-a16-e100\`"
            echo "  - \`group-court-mixed-hierarchical-v3-pose-consistency\`"
          } >> "$GITHUB_STEP_SUMMARY"
