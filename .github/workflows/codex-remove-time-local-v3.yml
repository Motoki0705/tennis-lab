name: Apply time-local removal v3

on:
  push:
    branches:
      - codex/remove-time-local-blcs-sliding

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Apply repository refactor
        run: |
          python .github/scripts/apply_time_local_refactor.py
          rm -f \
            .github/scripts/apply_time_local_refactor.py \
            .github/workflows/codex-remove-time-local.yml \
            .github/workflows/codex-remove-time-local-v2.yml \
            .github/workflows/codex-remove-time-local-v3.yml

      - name: Validate retired references are gone
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            'src/utils/models/components/ops/time_local'
            'src.utils.models.components.ops.time_local'
            'time_window_radius'
            'time_global_stage_mask'
            'sliding_attention_keep_mask'
            'FORCE_TIME_LOCAL_REFERENCE'
            'USE_TIME_LOCAL_CUDA'
            'get_time_local_cuda_extension'
            'is_time_local_cuda_available'
            'require_time_local_cuda_extension'
            '"time_local_bindings"'
            '.time_local_bindings'
            ' time_local_bindings:'
            '"time_local_kernels"'
            '.time_local_kernels'
            ' time_local_kernels:'
          )
          for value in "${forbidden[@]}"; do
            if git grep -n --fixed-strings -- "$value"; then
              echo "retired reference remains: $value" >&2
              exit 1
            fi
          done
          git diff --check

      - name: Run focused lint and tests
        shell: bash
        run: |
          uv run --locked ruff check \
            src/tasks/blcs/configuration.py \
            src/tasks/blcs/models/blcs_multiview_axial_model.py \
            src/tasks/blcs/models/components/padding.py \
            src/utils/configuration/__init__.py \
            src/utils/configuration/operations.py \
            src/utils/models/components/ops/__init__.py \
            src/utils/models/components/ops/build.py \
            src/utils/models/components/ops/loader.py \
            tests/unit/tasks/blcs/models/components/test_padding.py \
            tests/unit/tasks/blcs/models/test_blcs_multiview_axial_model.py \
            tests/unit/tasks/blcs/models/test_padding_contract.py \
            tests/unit/utils/configuration/test_operations.py \
            tests/unit/utils/models/components/ops/test_build.py
          uv run --locked pytest -q \
            tests/unit/tasks/blcs/models/components/test_padding.py \
            tests/unit/tasks/blcs/models/test_blcs_multiview_axial_model.py \
            tests/unit/tasks/blcs/models/test_padding_contract.py \
            tests/unit/utils/configuration/test_operations.py \
            tests/unit/utils/models/components/ops/test_build.py

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(blcs): remove standalone time-local attention'
          git push
