name: Pull request labeler

on:
  pull_request_target:
    paths-ignore:
      - '.agents/logs/parents/**/instruction.md'
      - '.agents/logs/parents/**/final.md'
      - '.agents/logs/parents/**/meta.json'
      - '.agents/logs/parents/parent-*/activity-*/event-*.json'
      - '.agents/logs/parents/README.md'
      - '.agents/logs/parents/parent-*/README.md'
      - '.agents/logs/parents/parent-*/activity-*/README.md'
      - '.agents/logs/parents/parent-*/child-*/README.md'
      - '.agents/logs/parents/parent-*/child-*/d-*/README.md'
      - '.agents/logs/parents/parent-*/child-*/d-*/*-*/README.md'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to label"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels from changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: ".github/labeler.yml"
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          repo-token: ${{ github.token }}
          sync-labels: true
