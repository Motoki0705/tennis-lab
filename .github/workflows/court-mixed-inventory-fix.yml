name: Sync Court mixed branch with main

on:
  push:
    branches:
      - feat/court-mixed-source-batches
    paths:
      - .github/workflows/court-mixed-inventory-fix.yml

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/court-mixed-source-batches
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feat/court-mixed-source-batches
