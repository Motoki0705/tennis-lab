name: Court mixed-source training diagnostic

on:
  push:
    branches:
      - feat/court-mixed-source-batches
    paths:
      - .github/workflows/court-mixed-training-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: [self-hosted, linux, x64, local-gpu, cuda, wsl2, tennis-lab]
    timeout-minutes: 30

    steps:
      - name: Diagnose V3 access inside queue service
        shell: bash
        env:
          QUEUE: /opt/tennis-lab-actions/bin/training_queue.sh
          QUEUE_DIR: /var/lib/tennis-lab-actions/training-queue
        run: |
          set -euo pipefail
          test -x "$QUEUE"
          systemctl is-active --quiet tennis-lab-training-queue.service
          name="court_v3_queue_access_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          command="set -euo pipefail; id; command -v uv; uv --version; namei -l /var/lib/tennis-lab-actions/assets/data/synthetic_data_generation/scenes/B00/datasets/court/dataset.json; python3 -c 'import json,pathlib; p=pathlib.Path(\"/var/lib/tennis-lab-actions/assets/data/synthetic_data_generation/scenes/B00/datasets/court/dataset.json\"); d=json.loads(p.read_text()); print(d[\"schema\"], len(d.get(\"samples\", [])), len(d.get(\"rejected_samples\", [])))'; find /var/lib/tennis-lab-actions/assets/ckpt -maxdepth 5 -type f -name 'dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth' -print"
          output="$(
            TRAINING_QUEUE_DIR="$QUEUE_DIR" \
              "$QUEUE" add "$command" \
                --name "$name" \
                --provider github-actions \
                --session "$GITHUB_RUN_ID"
          )"
          echo "$output"
          job="${output#queued: }"
          [[ "$job" != "$output" && "$job" == *.job ]]
          stem="${job%.job}"
          if [[ ! -f "$QUEUE_DIR/done/$job" && ! -f "$QUEUE_DIR/failed/$job" ]]; then
            set +o pipefail
            tail -n 20000 -F "$QUEUE_DIR/worker.log" \
              | grep -m1 -E "done: ${job}|FAILED.*${job}"
            status=$?
            set -o pipefail
            [[ "$status" -eq 0 ]]
          fi
          cat "$QUEUE_DIR/logs/${stem}.log"
          test -f "$QUEUE_DIR/done/$job"
