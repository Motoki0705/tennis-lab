name: Court mixed-source training diagnostic

on:
  push:
    branches:
      - feat/court-mixed-source-batches
    paths:
      - .github/workflows/court-mixed-training-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: [self-hosted, linux, x64, local-gpu, cuda, wsl2, tennis-lab]
    timeout-minutes: 10

    steps:
      - name: Inspect failed queue job without acquiring the GPU lock
        shell: bash
        env:
          QUEUE: /opt/tennis-lab-actions/bin/training_queue.sh
          QUEUE_DIR: /var/lib/tennis-lab-actions/training-queue
        run: |
          set -euo pipefail
          systemctl is-active tennis-lab-training-queue.service
          TRAINING_QUEUE_DIR="$QUEUE_DIR" "$QUEUE" status
          echo "-- failed jobs --"
          mapfile -t failed < <(
            find "$QUEUE_DIR/failed" -maxdepth 1 -type f -printf '%f\n' | sort
          )
          printf '%s\n' "${failed[@]}"
          for job in "${failed[@]}"; do
            stem="${job%.job}"
            echo "===== $job ====="
            echo "-- job spec --"
            cat "$QUEUE_DIR/failed/$job" || true
            echo "-- job log --"
            cat "$QUEUE_DIR/logs/${stem}.log" || true
            echo "-- repro metadata --"
            cat "$QUEUE_DIR/repro/${stem}/run.json" || true
          done
          echo "-- queue filesystem --"
          find "$QUEUE_DIR" -maxdepth 2 -printf '%M %u:%g %p\n' | sort | tail -200
