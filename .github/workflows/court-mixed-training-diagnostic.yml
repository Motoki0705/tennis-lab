name: Court mixed-source training diagnostic

on:
  push:
    branches:
      - feat/court-mixed-source-batches
    paths:
      - .github/workflows/court-mixed-training-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: [self-hosted, linux, x64, local-gpu, cuda, wsl2, tennis-lab]
    timeout-minutes: 10

    steps:
      - name: Grant the queue service read-only access to B00 Court V3
        shell: bash
        env:
          DATASET_PARENT: /var/lib/tennis-lab-actions/assets/data/synthetic_data_generation/scenes/B00/datasets
          DATASET_ROOT: /var/lib/tennis-lab-actions/assets/data/synthetic_data_generation/scenes/B00/datasets/court
          MANIFEST: /var/lib/tennis-lab-actions/assets/data/synthetic_data_generation/scenes/B00/datasets/court/dataset.json
        run: |
          set -euo pipefail
          sudo -n true
          command -v setfacl
          sudo -n setfacl -m u:tennis-actions:x "$DATASET_PARENT"
          sudo -n setfacl -R -m u:tennis-actions:rX "$DATASET_ROOT"
          sudo -n find "$DATASET_ROOT" -type d -exec setfacl -m d:u:tennis-actions:rX {} +
          namei -l "$MANIFEST"
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/var/lib/tennis-lab-actions/assets/data/synthetic_data_generation/scenes/B00/datasets/court/dataset.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          accepted = len(payload.get("samples", []))
          rejected = len(payload.get("rejected_samples", []))
          proposals = accepted + rejected
          assert payload.get("schema") == "canonical_court_dataset_v3"
          assert payload.get("status") == "completed"
          assert payload.get("seed") == 695
          assert payload.get("profile") == "b00-production"
          assert (proposals, accepted, rejected) == (3336, 3293, 43)
          print(f"B00 Court V3 accessible: proposals={proposals} accepted={accepted} rejected={rejected}")
          PY
