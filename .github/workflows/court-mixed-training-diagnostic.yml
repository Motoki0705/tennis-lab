name: Court mixed-source training diagnostic

on:
  push:
    branches:
      - feat/court-mixed-source-batches
    paths:
      - .github/workflows/court-mixed-training-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: [self-hosted, linux, x64, local-gpu, cuda, wsl2, tennis-lab]
    timeout-minutes: 10

    steps:
      - name: Inspect shared queue without acquiring the GPU lock
        shell: bash
        env:
          QUEUE: /opt/tennis-lab-actions/bin/training_queue.sh
          QUEUE_DIR: /var/lib/tennis-lab-actions/training-queue
        run: |
          set -euo pipefail
          systemctl is-active tennis-lab-training-queue.service
          TRAINING_QUEUE_DIR="$QUEUE_DIR" "$QUEUE" status
          echo "-- pending --"
          find "$QUEUE_DIR/jobs" -maxdepth 1 -type f -printf '%f\n' | sort || true
          echo "-- running --"
          find "$QUEUE_DIR/running" -maxdepth 1 -type f -printf '%f\n' | sort || true
          echo "-- recent worker log --"
          tail -n 200 "$QUEUE_DIR/worker.log" || true
          echo "-- GPU lock holders --"
          fuser -v /var/lib/tennis-lab-actions/gpu.lock || true
