name: Court mixed-source training diagnostic

on:
  push:
    branches:
      - feat/court-mixed-source-batches
    paths:
      - .github/workflows/court-mixed-training-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: [self-hosted, linux, x64, local-gpu, cuda, wsl2, tennis-lab]
    timeout-minutes: 10

    steps:
      - name: Inspect trusted local runtime
        shell: bash
        run: |
          set -u
          id
          printf 'PATH=%s\n' "$PATH"
          printf '\n-- candidate roots --\n'
          for path in \
            /home/kamimura/projects/tennis-lab \
            /home/kamimura/projects/tennis-lab/.venv/bin/python \
            /home/kamimura/.local/share/tennis-lab-chatgpt-mcp/venv/bin/python \
            /opt/tennis-lab-actions/bin/training_queue.sh \
            /var/lib/tennis-lab-actions \
            /var/lib/tennis-lab-actions/assets/data \
            /var/lib/tennis-lab-actions/assets/ckpt; do
            if [[ -e "$path" || -L "$path" ]]; then
              ls -ld "$path"
            else
              echo "MISSING $path"
            fi
          done
          printf '\n-- commands --\n'
          command -v python || true
          command -v python3 || true
          python3 -V || true
          printf '\n-- project python candidates --\n'
          find /home/kamimura -maxdepth 7 -type f -o -type l 2>/dev/null \
            | grep -E '/(\.venv|venv)/bin/python(3(\.11)?)?$' \
            | head -100 || true
          printf '\n-- queue service --\n'
          systemctl is-active tennis-lab-training-queue.service || true
          systemctl show tennis-lab-training-queue.service \
            -p ExecStart -p Environment -p WorkingDirectory --no-pager || true
          printf '\n-- queue binary --\n'
          ls -la /opt/tennis-lab-actions/bin 2>/dev/null || true
          printf '\n-- GPU --\n'
          nvidia-smi --query-gpu=index,name,memory.total,memory.used --format=csv,noheader || true
