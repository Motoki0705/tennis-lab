name: Verify downstream FFN configuration

on:
  push:
    branches:
      - feat/swiglu-architecture-variants

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/swiglu-architecture-variants
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Apply implementation patch from the inventory workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(".github/workflows/ffn-downstream-inventory.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          start = next(
              index for index, line in enumerate(lines) if line.strip() == "python - <<'PY'"
          )
          end = next(
              index
              for index in range(start + 1, len(lines))
              if lines[index].strip() == "PY"
          )
          source = dedent("\n".join(lines[start + 1 : end]))
          exec(compile(source, str(workflow), "exec"))
          PY
      - name: Add permanent downstream inventory regression test
        run: |
          cat > tests/e2e/development/test_ffn_downstream_selection.py <<'PY'
          """Repository-wide contracts for config-driven dense FFN selection."""

          from __future__ import annotations

          import ast
          from pathlib import Path

          from src.utils.models.components.ffn_layers import SUPPORTED_FFN_TYPES

          _EXPECTED_FFN_TYPES = frozenset(
              {
                  "swiglu",
                  "mlp",
                  "kimi_k3_situglu",
                  "deepseek_v4_swiglu",
                  "gpt_oss_swiglu",
              }
          )
          _EXPECTED_DIRECT_CONSUMERS = frozenset(
              {
                  "src/tasks/ball_detection/models/dinov3_rope.py",
                  "src/tasks/blcs/models/blcs_model.py",
                  "src/tasks/blcs/models/blcs_multiview_axial_model.py",
                  "src/tasks/blcs/models/blcs_multiview_model.py",
                  "src/tasks/blcs/models/blcs_track_query_ablation_model.py",
                  "src/tasks/blcs/models/blcs_track_query_model.py",
                  "src/tasks/court_detection/models/transformer_encoder.py",
                  "src/tasks/plcs/models/plcs_model.py",
                  "src/tasks/plcs/models/plcs_multiview_axial_model.py",
                  "src/tasks/plcs/models/plcs_multiview_axial_split_model.py",
                  "src/tasks/plcs/models/plcs_multiview_model.py",
                  "src/tasks/plcs/models/plcs_track_query_ablation_model.py",
                  "src/tasks/plcs/models/plcs_track_query_model.py",
                  "src/tasks/slcs/models/slcs_model.py",
                  "src/utils/models/architectures/transformer_sequence_discriminator.py",
              }
          )
          _CONFIGURATION_SURFACES = (
              "src/tasks/ball_detection/configuration.py",
              "src/tasks/blcs/configuration.py",
              "src/tasks/court_detection/configuration.py",
              "src/tasks/plcs/configuration.py",
              "src/tasks/slcs/configuration.py",
              "src/utils/models/architectures/transformer_sequence_discriminator.py",
          )
          _BLCS_TRACK_QUERY_PROFILES = (
              "src/tasks/blcs/configs/model/_track_query.yaml",
              "src/tasks/blcs/configs/model/_track_query_ablation.yaml",
              "src/tasks/blcs/configs/model/_track_query_reference.yaml",
              "src/tasks/blcs/configs/model/_track_query_reference_ablation.yaml",
          )


          def _call_name(call: ast.Call) -> str | None:
              if isinstance(call.func, ast.Name):
                  return call.func.id
              return None


          def test_supported_ffn_type_registry_is_exact() -> None:
              assert SUPPORTED_FFN_TYPES == _EXPECTED_FFN_TYPES


          def test_all_direct_block_consumers_route_a_nonliteral_ffn_selection() -> None:
              consumers: set[str] = set()
              hardcoded_or_missing: list[str] = []
              for path in sorted(Path("src").rglob("*.py")):
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  for node in ast.walk(tree):
                      if not isinstance(node, ast.Call) or _call_name(node) not in {
                          "TransformerBlockConfig",
                          "CrossAttnBlockConfig",
                      }:
                          continue
                      consumers.add(path.as_posix())
                      keyword = next(
                          (item for item in node.keywords if item.arg == "ffn_type"),
                          None,
                      )
                      if keyword is None or (
                          isinstance(keyword.value, ast.Constant)
                          and isinstance(keyword.value.value, str)
                      ):
                          hardcoded_or_missing.append(f"{path}:{node.lineno}")

              assert consumers == _EXPECTED_DIRECT_CONSUMERS
              assert hardcoded_or_missing == []


          def test_every_task_configuration_uses_the_canonical_ffn_registry() -> None:
              missing = [
                  path
                  for path in _CONFIGURATION_SURFACES
                  if "SUPPORTED_FFN_TYPES"
                  not in Path(path).read_text(encoding="utf-8")
              ]
              assert missing == []


          def test_blcs_track_query_profiles_expose_ffn_type() -> None:
              missing = [
                  path
                  for path in _BLCS_TRACK_QUERY_PROFILES
                  if "ffn_type: swiglu" not in Path(path).read_text(encoding="utf-8")
              ]
              assert missing == []
          PY
      - name: Format and lint
        run: |
          uv run --locked ruff check --fix src tests
          uv run --locked ruff check src tests
          git diff --check
      - name: Run focused tests
        run: |
          uv run --locked pytest -q -n auto --no-cov \
            tests/e2e/development/test_ffn_downstream_selection.py \
            tests/unit/utils/models/components/test_ffn_layers.py \
            tests/unit/utils/models/components/test_block.py \
            tests/unit/utils/models/components/test_fixed_query_track_ablation_stage.py \
            tests/unit/utils/models/architectures/test_transformer_sequence_discriminator.py \
            tests/integration/tasks/blcs/test_model_configs.py \
            tests/integration/tasks/plcs/test_model_configs.py \
            tests/unit/tasks/ball_detection/test_configuration_semantics.py \
            tests/unit/tasks/ball_detection/models/test_dinov3_rope.py \
            tests/unit/tasks/court_detection/test_configuration.py \
            tests/unit/tasks/court_detection/models/test_transformer_encoder.py \
            tests/unit/tasks/slcs/models/test_slcs_model.py \
            tests/integration/tasks/slcs/test_training_config.py
      - name: Type-check changed files without expanding unrelated modules
        run: |
          uv run --locked mypy --follow-imports=skip \
            src/utils/models/components/ffn_layers.py \
            src/utils/models/components/block.py \
            src/utils/models/components/fixed_query_track_ablation_stage.py \
            src/utils/models/architectures/transformer_sequence_discriminator.py \
            src/tasks/ball_detection/configuration.py \
            src/tasks/ball_detection/models/dinov3_rope.py \
            src/tasks/blcs/configuration.py \
            src/tasks/blcs/models/blcs_model.py \
            src/tasks/blcs/models/blcs_multiview_model.py \
            src/tasks/blcs/models/blcs_multiview_axial_model.py \
            src/tasks/blcs/models/blcs_track_query_model.py \
            src/tasks/blcs/models/blcs_track_query_ablation_model.py \
            src/tasks/blcs/models/blcs_track_query_reference_model.py \
            src/tasks/blcs/models/blcs_track_query_reference_ablation_model.py \
            src/tasks/court_detection/configuration.py \
            src/tasks/court_detection/models/transformer_encoder.py \
            src/tasks/plcs/configuration.py \
            src/tasks/plcs/models/plcs_model.py \
            src/tasks/plcs/models/plcs_multiview_model.py \
            src/tasks/plcs/models/plcs_multiview_axial_model.py \
            src/tasks/plcs/models/plcs_multiview_axial_split_model.py \
            src/tasks/plcs/models/plcs_track_query_model.py \
            src/tasks/plcs/models/plcs_track_query_ablation_model.py \
            src/tasks/slcs/configuration.py \
            src/tasks/slcs/models/slcs_model.py
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "feat: expose FFN variants across downstream block models"
          git push origin HEAD:feat/swiglu-architecture-variants
