name: PR813 downstream FFN migration diagnostics

on:
  push:
    branches:
      - feat/swiglu-architecture-variants
    paths:
      - .github/workflows/pr813-diagnose-downstream-ffn.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          activate-environment: false

      - name: Apply migration
        id: apply
        continue-on-error: true
        run: uv run --locked python .github/scripts/pr813_expand_downstream_ffn.py

      - name: Format and lint
        id: lint
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          uv run --locked ruff format src tests
          uv run --locked ruff check --fix src tests
          uv run --locked ruff check src tests
          git diff --check

      - name: Type-check changed source
        id: mypy
        if: steps.apply.outcome == 'success' && steps.lint.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only origin/main...HEAD -- 'src/**/*.py')
          if ((${#changed[@]})); then
            uv run --locked mypy "${changed[@]}"
          fi

      - name: Run focused tests
        id: tests
        if: steps.apply.outcome == 'success' && steps.lint.outcome == 'success' && steps.mypy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          candidates=(
            tests/unit/utils/models/components/test_ffn_layers.py
            tests/unit/utils/models/components/test_ffn_downstream_configuration.py
            tests/unit/utils/models/components/test_block.py
            tests/e2e/development/test_architecture_boundaries.py
            tests/integration/tasks/blcs/test_model_configs.py
            tests/integration/tasks/plcs/test_model_configs.py
            tests/unit/tasks/slcs/models/test_slcs_model.py
            tests/unit/tasks/court_detection/models/test_transformer_encoder.py
            tests/unit/tasks/ball_detection/models/test_dinov3_rope.py
          )
          selected=()
          for candidate in "${candidates[@]}"; do
            [[ -f "$candidate" ]] && selected+=("$candidate")
          done
          uv run --locked pytest "${selected[@]}" -q --no-cov -n auto

      - name: Publish result
        if: always()
        shell: bash
        env:
          APPLY: ${{ steps.apply.outcome }}
          LINT: ${{ steps.lint.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ "$APPLY" == success && "$LINT" == success && "$MYPY" == success && "$TESTS" == success ]]; then
            rm -f .github/scripts/pr813_expand_downstream_ffn.py
            rm -f .github/workflows/pr813-expand-downstream-ffn.yml
            rm -f .github/workflows/pr813-diagnose-downstream-ffn.yml
            rm -f .github/pr813-ffn-*.marker
            git add -A
            git commit -m 'feat: expose SwiGLU variants across block consumers'
          else
            rm -f .github/pr813-ffn-*.marker
            touch ".github/pr813-ffn-apply-${APPLY}.marker"
            touch ".github/pr813-ffn-lint-${LINT}.marker"
            touch ".github/pr813-ffn-mypy-${MYPY}.marker"
            touch ".github/pr813-ffn-tests-${TESTS}.marker"
            git add .github/pr813-ffn-*.marker
            git commit -m 'chore: record PR813 migration diagnostics'
          fi
          git push origin HEAD:feat/swiglu-architecture-variants
