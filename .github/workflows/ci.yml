name: CI
run-name: daily-ci:${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      cycle_id:
        required: true
        type: string
      generation:
        required: true
        type: string
      request_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      baseline_sha:
        required: true
        type: string
      deadline_at:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: daily-ci-ci.yml-${{ inputs.request_id }}
  cancel-in-progress: false
env:
  PYTHONPATH: ${{ github.workspace }}/.agents/ops
  DAILY_CI_WORKFLOW: ci.yml
  DAILY_CI_SHARD: all
  DAILY_CI_CYCLE_ID: ${{ inputs.cycle_id }}
  DAILY_CI_GENERATION: ${{ inputs.generation }}
  DAILY_CI_REQUEST_ID: ${{ inputs.request_id }}
  DAILY_CI_TARGET_SHA: ${{ inputs.target_sha }}
  DAILY_CI_BASELINE_SHA: ${{ inputs.baseline_sha }}
  DAILY_CI_DEADLINE_AT: ${{ inputs.deadline_at }}
jobs:
  lint-and-test:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keep two pytest workers; native libraries use one thread each.
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Validate daily request and checkout
        run: python3 -m daily_ci.workflow init

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          prune-cache: false
          cache-dependency-glob: uv.lock
          cache-suffix: cpu
      - name: Install locked CPU environment
        run: python3 -m daily_ci.workflow run environment -- uv sync --locked --no-group gpu --group cpu
      - name: Verify CPU backend
        run: >-
          python3 -m daily_ci.workflow run cpu-backend -- .venv/bin/python -c
          'import torch, torchvision; assert torch.version.cuda is None, torch.__version__; print(f"torch={torch.__version__}, torchvision={torchvision.__version__}")'
      - name: Install system dependencies
        run: >-
          python3 -m daily_ci.workflow run system-dependencies -- bash -e -c
          'sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg rclone'
      - name: Lint
        run: python3 -m daily_ci.workflow run lint -- .venv/bin/python -m spin lint
      - name: Test
        # Long dataset generation/recovery integrations are run explicitly.
        run: >-
          python3 -m daily_ci.workflow run test --
          .venv/bin/python -m spin test -q --no-cov --dist=worksteal
          --ignore=tests/integration/synthetic_data_generation/test_court_dataset.py
          -p daily_ci.pytest_evidence --junitxml=.daily-ci-evidence/pytest.junit.xml
      - name: Finalize evidence
        if: always()
        run: python3 -m daily_ci.workflow finalize
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ci-ci.yml-${{ github.job }}-all-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.request_id }}
          path: .daily-ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
