name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        # ffmpeg is required by video e2e tests; rclone is required by the
        # local-to-Google-Drive command e2e tests.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone

      - name: Install ffmpeg
        # Required by the ball_detection video pipeline (and its e2e tests),
        # which shells out to the `ffmpeg` binary for transcoding.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Pytest
        # This runner is CPU-only and doesn't have the large local datasets,
        # so tests marked `cuda` or `local_data` (see pyproject.toml markers)
        # are excluded.
        run: uv run pytest tests -m "not local_data and not cuda" -q --no-cov
