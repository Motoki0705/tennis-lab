name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Python / ${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: remainder
            install_system_dependencies: true
          - lane: long-tail
            install_system_dependencies: false
          - lane: scene-pipeline
            install_system_dependencies: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install system dependencies
        if: matrix.install_system_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg rclone

      - name: Project checks for ${{ matrix.lane }} lane
        run: uv run --locked spin ci --lane "${{ matrix.lane }}"

      - name: Validate formal knowledge
        if: matrix.lane == 'remainder'
        run: |
          uv run --locked python \
            .agents/skills/knowledge-control/scripts/kg_validate.py

  knowledge-webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowledge/webui
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: knowledge/webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build knowledge Web UI
        run: npm run build
