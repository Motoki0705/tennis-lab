name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        # ffmpeg is required by video e2e tests; rclone is required by the
        # local-to-Google-Drive command e2e tests.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone

      - name: Project checks
        # `spin ci` is the shared local/CI entry point. This runner is CPU-only
        # and has no large local datasets, so it excludes those pytest markers.
        run: uv run --locked spin ci
