name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # NOTE: uv.lock pins CUDA-linked torch wheels (torch>=2.9.0). On this
        # CPU runner those wheels are large (~2 GB) but still functional for
        # import-only tests. If build times become prohibitive, consider adding
        # an index-override for CPU torch or splitting lint / test jobs.
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Pytest
        # This runner is CPU-only and doesn't have the large local datasets,
        # so tests marked `cuda` or `local_data` (see pyproject.toml markers)
        # are excluded.
        run: uv run pytest tests -m "not local_data and not cuda" -q --no-cov

