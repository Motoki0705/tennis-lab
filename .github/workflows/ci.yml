name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  apply-issue-workflow-update:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/issue-workflow-completion-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: feat/issue-workflow-completion-hardening
          fetch-depth: 0

      - name: Apply staged schema v5 update
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .workflow-update/part-00 ]]; then
            echo 'No staged update present.'
            exit 0
          fi
          cat .workflow-update/part-* > /tmp/issue-workflow-update.tar.gz
          echo 'df456569022f2be3fff6070f2cbe437892874d2594edffb9b0e4b235a2fe4f52  /tmp/issue-workflow-update.tar.gz' | sha256sum -c -
          tar -xzf /tmp/issue-workflow-update.tar.gz -C "$GITHUB_WORKSPACE"
          python -m compileall -q .agents/skills/issue-subagent-workflow/scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .agents/skills/issue-subagent-workflow \
            .codex/agents \
            tests/e2e/skills
          if git diff --cached --quiet; then
            echo 'No update to commit.'
            exit 0
          fi
          git commit -m 'fix(workflow): enforce schema v5 candidate and PR binding'
          git push origin HEAD:feat/issue-workflow-completion-hardening

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install system dependencies
        # ffmpeg is required by video e2e tests; rclone is required by the
        # local-to-Google-Drive command e2e tests.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone

      - name: Project checks
        # `spin ci` is the shared local/CI entry point. This runner is CPU-only
        # and has no large local datasets, so it excludes those pytest markers.
        run: uv run --locked spin ci

      - name: Validate formal and staged knowledge
        run: |
          uv run --locked python \
            .agents/skills/knowledge-control/scripts/kg_validate.py
          uv run --locked python \
            .agents/skills/literature-radar/scripts/radar_ingest.py \
            validate --repo-root .

  knowledge-webui:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: knowledge/webui

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: knowledge/webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build knowledge Web UI
        run: npm run build
