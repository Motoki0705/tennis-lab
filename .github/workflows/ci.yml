name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keep two pytest workers; native libraries use one thread each.
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          prune-cache: false
          cache-dependency-glob: uv.lock
          cache-suffix: cpu

      - name: Install locked CPU environment
        run: uv sync --locked --no-group gpu --group cpu

      - name: Verify CPU backend
        run: |
          .venv/bin/python - <<'PY'
          import torch
          import torchvision
          assert torch.version.cuda is None, torch.__version__
          print(f"torch={torch.__version__}, torchvision={torchvision.__version__}")
          PY

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg rclone

      - name: Lint
        run: .venv/bin/python -m spin lint

      - name: Test
        # Long dataset generation/recovery integrations are run explicitly.
        run: >-
          .venv/bin/python -m spin test -q --no-cov --dist=worksteal
          --ignore=tests/integration/synthetic_data_generation/test_scene_pipeline_cpu.py
          --ignore=tests/integration/synthetic_data_generation/test_court_dataset.py
