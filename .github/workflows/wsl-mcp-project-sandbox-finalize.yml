name: WSL MCP project sandbox finalization

on:
  push:
    branches:
      - feat/wsl-mcp-project-sandbox
    paths:
      - .github/scripts/wsl_mcp_project_sandbox_finalize.py
      - .github/workflows/wsl-mcp-project-sandbox-finalize.yml

permissions:
  contents: write

concurrency:
  group: wsl-mcp-project-sandbox-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/wsl-mcp-project-sandbox
          fetch-depth: 0
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Apply reviewed project-sandbox implementation
        run: uv run --locked python .github/scripts/wsl_mcp_project_sandbox_finalize.py

      - name: Run focused checks
        run: |
          uv run --locked ruff check \
            src/automation/chatgpt_mcp \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp
          uv run --locked mypy src/automation/chatgpt_mcp
          uv run --locked pytest -q \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp \
            tests/unit/utils/configuration/test_inventory.py

      - name: Commit finalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/scripts/wsl_mcp_project_sandbox_finalize.py \
            .github/workflows/wsl-mcp-project-sandbox-finalize.yml
          git add \
            src/automation/chatgpt_mcp \
            src/utils/configuration/exemption_data.py \
            src/utils/configuration/migration_data.py \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp
          git add -u .github
          git diff --cached --check
          git commit -m "security(automation): isolate control plane from RW project sandbox"
          git push origin HEAD:feat/wsl-mcp-project-sandbox
