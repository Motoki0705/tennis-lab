name: Apply issue workflow schema v5 update

on:
  push:
    branches:
      - feat/issue-workflow-completion-hardening

permissions:
  contents: write

jobs:
  apply-update:
    if: contains(github.event.head_commit.message, 'bootstrap schema v5 workflow update')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/issue-workflow-completion-hardening
          fetch-depth: 0
      - name: Apply staged update
        shell: bash
        run: |
          set -euo pipefail
          cat .workflow-update/part-* > /tmp/issue-workflow-update.tar.gz
          echo 'df456569022f2be3fff6070f2cbe437892874d2594edffb9b0e4b235a2fe4f52  /tmp/issue-workflow-update.tar.gz' | sha256sum -c -
          tar -xzf /tmp/issue-workflow-update.tar.gz -C "$GITHUB_WORKSPACE"
          python -m compileall -q .agents/skills/issue-subagent-workflow/scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .agents/skills/issue-subagent-workflow \
            .codex/agents \
            tests/e2e/skills
          if git diff --cached --quiet; then
            echo 'No update to commit.'
            exit 0
          fi
          git commit -m 'fix(workflow): enforce schema v5 candidate and PR binding'
          git push origin HEAD:feat/issue-workflow-completion-hardening
