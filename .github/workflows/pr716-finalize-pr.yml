name: PR716 security finalization (pull request)

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/chatgpt-wsl-mcp' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/chatgpt-wsl-mcp
          fetch-depth: 0
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Apply reviewed security finalization
        run: uv run --locked python .github/scripts/pr716_finalize.py

      - name: Run focused security and MCP checks
        run: |
          uv run --locked ruff check \
            src/automation/chatgpt_mcp \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp
          uv run --locked mypy src/automation/chatgpt_mcp
          uv run --locked pytest -q \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp \
            tests/unit/utils/configuration/test_inventory.py

      - name: Commit finalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/pr716-finalize.yml \
            .github/workflows/pr716-finalize-pr.yml \
            .github/pr716-finalize-trigger \
            .github/scripts/pr716_finalize.py \
            tests/unit/automation/chatgpt_mcp/test_inventory_diagnostic.py
          git add \
            src/automation/chatgpt_mcp \
            src/utils/configuration/exemption_data.py \
            src/utils/configuration/migration_data.py \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp
          git diff --cached --check
          git commit -m "security(automation): constrain WSL MCP to execution plane"
          git push origin HEAD:feat/chatgpt-wsl-mcp
