name: PR813 recursive downstream FFN migration

on:
  push:
    branches:
      - feat/swiglu-architecture-variants
    paths:
      - .github/scripts/pr813_expand_downstream_ffn_v2.py
      - .github/workflows/pr813-expand-downstream-ffn-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          activate-environment: false

      - name: Apply recursive migration
        id: migrate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run --locked python .github/scripts/pr813_expand_downstream_ffn_v2.py 2>&1 | tee /tmp/pr813-migrate.log

      - name: Repair strict PLCS ablation contract
        id: repair
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run --locked python - <<'PY' 2>&1 | tee /tmp/pr813-repair.log
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path.cwd()
          path = root / "src/tasks/plcs/configuration.py"
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?P<indent>^[ \t]*)if name in _TRACK_QUERY_ABLATION_MODEL_NAMES:\n'
              r'(?P=indent)    if _string\(mapping, "ffn_type", path="model"\) != "swiglu":\n'
              r'(?P=indent)        raise SemanticConfigurationError\(\n'
              r'.*?'
              r'(?P=indent)        \)\n',
              flags=re.MULTILINE | re.DOTALL,
          )
          text, count = pattern.subn(
              lambda match: (
                  f'{match.group("indent")}if name in '
                  '_TRACK_QUERY_ABLATION_MODEL_NAMES:\n'
              ),
              text,
              count=1,
          )
          if count == 0 and "PLCS track-query ablation requires" in text:
              raise RuntimeError("Unable to remove the standard-SwiGLU-only PLCS rule")
          path.write_text(text, encoding="utf-8")

          for test_path in (root / "tests").rglob("*.py"):
              source = test_path.read_text(encoding="utf-8")
              if "PLCS track-query ablation requires" not in source:
                  continue
              source = re.sub(
                  r'"PLCS track-query ablation requires "\s*\n\s*'
                  r'"model\.ffn_type=\\?\'swiglu\\?\'\."',
                  '"model.ffn_type"',
                  source,
              )
              source = source.replace(
                  "PLCS track-query ablation requires model.ffn_type='swiglu'.",
                  "model.ffn_type",
              )
              source = re.sub(
                  r'(?P<prefix>ffn_type[^\n]{0,80}[=:]\s*)["\']mlp["\']',
                  r'\g<prefix>"unknown"',
                  source,
              )
              test_path.write_text(source, encoding="utf-8")
          PY

      - name: Format and lint
        id: lint
        if: steps.migrate.outcome == 'success' && steps.repair.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            uv run --locked ruff format src tests
            uv run --locked ruff check --fix src tests
            uv run --locked ruff check src tests
            git diff --check
          } 2>&1 | tee /tmp/pr813-lint.log

      - name: Type-check changed source files
        id: mypy
        if: steps.migrate.outcome == 'success' && steps.repair.outcome == 'success' && steps.lint.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mapfile -t changed < <(git diff --name-only --diff-filter=ACM origin/main -- 'src/**/*.py')
          if ((${#changed[@]})); then
            uv run --locked mypy "${changed[@]}" 2>&1 | tee /tmp/pr813-mypy.log
          else
            echo 'No changed source files' | tee /tmp/pr813-mypy.log
          fi

      - name: Run focused downstream regression tests
        id: tests
        if: steps.migrate.outcome == 'success' && steps.repair.outcome == 'success' && steps.lint.outcome == 'success' && steps.mypy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          candidates=(
            tests/unit/utils/models/components/test_ffn_layers.py
            tests/unit/utils/models/components/test_ffn_downstream_configuration.py
            tests/unit/utils/models/components/test_block.py
            tests/e2e/development/test_architecture_boundaries.py
            tests/integration/tasks/blcs/test_model_configs.py
            tests/integration/tasks/plcs/test_model_configs.py
            tests/unit/tasks/blcs/models/test_blcs_multiview_axial_model.py
            tests/unit/tasks/blcs/models/test_blcs_track_query_model.py
            tests/unit/tasks/plcs/models/test_plcs_multiview_axial_model.py
            tests/unit/tasks/plcs/models/test_plcs_track_query_model.py
            tests/unit/tasks/slcs/models/test_slcs_model.py
            tests/unit/tasks/court_detection/models/test_transformer_encoder.py
            tests/unit/tasks/ball_detection/models/test_dinov3_rope.py
            tests/unit/utils/models/architectures/test_transformer_sequence_discriminator.py
          )
          selected=()
          for candidate in "${candidates[@]}"; do
            [[ -f "$candidate" ]] && selected+=("$candidate")
          done
          uv run --locked pytest "${selected[@]}" -q --no-cov -n auto 2>&1 | tee /tmp/pr813-tests.log

      - name: Publish implementation or diagnostics
        if: always()
        shell: bash
        env:
          MIGRATE: ${{ steps.migrate.outcome }}
          REPAIR: ${{ steps.repair.outcome }}
          LINT: ${{ steps.lint.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/pr813-ffn-*.marker .github/pr813-v2-failure.txt
          if [[ "$MIGRATE" == success && "$REPAIR" == success && "$LINT" == success && "$MYPY" == success && "$TESTS" == success ]]; then
            rm -f \
              .github/scripts/pr813_expand_downstream_ffn.py \
              .github/scripts/pr813_expand_downstream_ffn_v2.py \
              .github/workflows/pr813-expand-downstream-ffn.yml \
              .github/workflows/pr813-diagnose-downstream-ffn.yml \
              .github/workflows/pr813-expand-downstream-ffn-v2.yml
            git add -A
            git commit -m 'feat: expose SwiGLU variants across block consumers'
          else
            {
              echo "migrate=$MIGRATE"
              echo "repair=$REPAIR"
              echo "lint=$LINT"
              echo "mypy=$MYPY"
              echo "tests=$TESTS"
              for log in /tmp/pr813-migrate.log /tmp/pr813-repair.log /tmp/pr813-lint.log /tmp/pr813-mypy.log /tmp/pr813-tests.log; do
                if [[ -f "$log" ]]; then
                  echo
                  echo "===== $log ====="
                  tail -n 240 "$log"
                fi
              done
            } > .github/pr813-v2-failure.txt
            git add -A
            git commit -m "chore: record downstream FFN migration failure ($MIGRATE/$REPAIR/$LINT/$MYPY/$TESTS)"
          fi
          git push origin HEAD:feat/swiglu-architecture-variants
