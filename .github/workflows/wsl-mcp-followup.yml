name: WSL MCP final hardening

on:
  push:
    branches: [feat/wsl-mcp-project-sandbox]
    paths:
      - ".github/workflows/wsl-mcp-followup.yml"
      - ".github/scripts/wsl_mcp_followup.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wsl-mcp-followup.yml"
      - ".github/scripts/wsl_mcp_followup.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wsl-mcp-project-sandbox-followup
  cancel-in-progress: true

jobs:
  harden:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/wsl-mcp-project-sandbox
          fetch-depth: 0
          submodules: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"

      - name: Apply reviewed hardening
        run: python3 .github/scripts/wsl_mcp_followup.py apply

      - name: Format and regenerate inventory
        run: |
          uv run --locked ruff format \
            src/automation/chatgpt_mcp \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp
          uv run --locked python .github/scripts/wsl_mcp_followup.py inventory

      - name: Run focused quality and security checks
        run: |
          uv run --locked ruff check \
            src/automation/chatgpt_mcp \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp
          uv run --locked mypy src/automation/chatgpt_mcp
          uv run --locked pytest -q \
            tests/unit/automation/chatgpt_mcp \
            tests/integration/chatgpt_mcp \
            tests/unit/utils/configuration/test_inventory.py

      - name: Commit hardened implementation
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/scripts/wsl_mcp_followup.py \
            .github/workflows/wsl-mcp-followup.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(automation): harden project-bounded WSL execution"
          git push --force-with-lease origin HEAD:feat/wsl-mcp-project-sandbox
