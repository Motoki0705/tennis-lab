name: Force-cancel stale Court queue diagnostic

on:
  push:
    branches:
      - feat/court-mixed-source-batches
    paths:
      - .github/workflows/court-mixed-force-cancel-stale-diagnostic.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Force-cancel stale self-hosted diagnostic run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "33165240858"
        shell: bash
        run: |
          set -euo pipefail
          status="$(
            curl --silent --show-error --output /tmp/cancel-response \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/force-cancel"
          )"
          cat /tmp/cancel-response
          if [[ "$status" != "202" && "$status" != "409" ]]; then
            echo "Unexpected force-cancel status: $status" >&2
            exit 1
          fi
          echo "Force-cancel response status: $status"
