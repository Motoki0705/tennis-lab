name: Court mixed-source training once v2

on:
  push:
    branches:
      - feat/court-mixed-source-batches
    paths:
      - .github/workflows/court-mixed-training-once-v2.yml

permissions:
  contents: write

concurrency:
  group: court-mixed-source-training-once
  cancel-in-progress: false

jobs:
  train-register:
    if: >-
      ${{ github.actor == github.repository_owner &&
          vars.LOCAL_GPU_ACTIONS_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64, local-gpu, cuda, wsl2, tennis-lab]
    timeout-minutes: 1440

    steps:
      - name: Checkout trusted feature revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/court-mixed-source-batches
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive

      - name: Run mixed-source experiments and register knowledge
        shell: bash
        run: bash scripts/github_actions/court_mixed_training_once.sh
