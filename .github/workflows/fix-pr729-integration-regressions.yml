name: Fix PR 729 integration regressions

on:
  pull_request:
    branches:
      - feat/issue-695-canonical-scene-pipeline
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: ${{ github.head_ref == 'automation/pr729-conflict-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR 729 branch
        uses: actions/checkout@v6
        with:
          ref: feat/issue-695-canonical-scene-pipeline
          fetch-depth: 0
          submodules: false

      - name: Set up locked Python environment
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Apply bounded integration repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: str, before: str, after: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(before) != 1:
                  raise SystemExit(
                      f"expected exactly one repair site in {path}, found {text.count(before)}"
                  )
              target.write_text(text.replace(before, after, 1), encoding="utf-8")


          replace_once(
              "tests/unit/synthetic_data_generation/pipeline/test_publication.py",
              '    assert not any("run" in part or "fingerprint" in part for part in publisher.owner.parts)\n',
              '    assert publisher.owner.relative_to(workspace.root) == Path("datasets/court")\n',
          )
          replace_once(
              "src/synthetic_data_generation/configs/roots/runtime.yaml",
              "external_asset_root: /home/kamimura/projects\n",
              "external_asset_root: data\n",
          )
          replace_once(
              "src/synthetic_data_generation/configs/profile/b00.yaml",
              "  source_video: tennis-lab/data/tennis_court.mp4\n",
              "  source_video: tennis_court.mp4\n",
          )
          replace_once(
              "tests/integration/tasks/tracking/test_training_smoke.py",
              '''    blcs_config = _compose_task_config(
                  "blcs",
                  (
                      "~camera",
          ''',
              '''    blcs_config = _compose_task_config(
                  "blcs",
                  (
          ''',
          )
          replace_once(
              "tests/integration/tasks/tracking/test_training_smoke.py",
              '''            "data.augmentation.enabled=false",
                  ),
              )
              blcs_module = BLCSDataModule''',
              '''            "data.augmentation.enabled=false",
                  ),
                  config_name="train_tracking",
              )
              blcs_module = BLCSDataModule''',
          )
          PY

      - name: Verify configuration semantics and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          from hydra import compose, initialize_config_dir

          from src.synthetic_data_generation.configuration import ScenePipelineConfiguration
          from src.utils.paths import PROJECT_ROOT

          config_root = PROJECT_ROOT / "src/synthetic_data_generation/configs"
          with initialize_config_dir(version_base="1.3", config_dir=str(config_root)):
              resolved = ScenePipelineConfiguration.from_config(
                  compose(config_name="run_scene_pipeline")
              )
          expected = (PROJECT_ROOT / "data/tennis_court.mp4").resolve()
          if resolved.request.source_video != expected:
              raise SystemExit(
                  f"B00 source path changed: {resolved.request.source_video} != {expected}"
              )
          PY
          uv run --locked ruff check \
            tests/unit/synthetic_data_generation/pipeline/test_publication.py \
            tests/integration/tasks/tracking/test_training_smoke.py
          uv run --locked pytest -q -n 0 \
            tests/unit/synthetic_data_generation/pipeline/test_publication.py::test_publish_uses_external_transaction_root_and_fixed_owner_reruns \
            tests/integration/synthetic_data_generation/test_dataset_performance.py \
            tests/integration/tasks/tracking/test_training_smoke.py::test_canonical_datamodules_retain_all_views_through_model_boundaries

      - name: Commit and push repairs
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-pr729-integration-regressions.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(issue-695): repair post-merge configuration regressions"
          git push origin HEAD:feat/issue-695-canonical-scene-pipeline

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            message="Integration repair PASS and pushed $(git rev-parse HEAD)."
          else
            message="Integration repair FAILED without updating PR #729."
          fi
          gh pr comment 729 --repo Motoki0705/tennis-lab --body \
            "$message Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
