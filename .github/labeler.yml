# PRの領域（area:）を変更ファイルのパスから付ける。ラベルの正本は .github/labels.yml。
"area: dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/dependabot.yml"
          - ".gitmodules"
          - "pyproject.toml"
          - "uv.lock"
          - "third_party/**"

"area: third-party":
  - changed-files:
      - any-glob-to-any-file:
          - ".gitmodules"
          - "third_party/**"
          - "src/submodules/vendor/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".pre-commit-config.yaml"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

"area: tests":
  - changed-files:
      - any-glob-to-any-file: "tests/**"

"area: knowledge":
  - changed-files:
      - any-glob-to-any-file:
          - "experiments/**"
          - "knowledge/**"

"area: base":
  - changed-files:
      - any-glob-to-any-file: "src/tasks/base/**"

"area: ball-detection":
  - changed-files:
      - any-glob-to-any-file: "src/tasks/ball_detection/**"

"area: court-detection":
  - changed-files:
      - any-glob-to-any-file: "src/tasks/court_detection/**"

"area: blcs":
  - changed-files:
      - any-glob-to-any-file: "src/tasks/blcs/**"

"area: plcs":
  - changed-files:
      - any-glob-to-any-file: "src/tasks/plcs/**"

"area: submodules":
  - changed-files:
      - any-glob-to-any-file: "src/submodules/**"

"area: synthetic-data":
  - changed-files:
      - any-glob-to-any-file: "src/synthetic_data_generation/**"

"area: tennis-scene":
  - changed-files:
      - any-glob-to-any-file: "src/tennis_scene/**"
