name = "seal_reviewer_ox"
description = "Independent no-edit identity and evidence gate for the complete post-test candidate before Issue-only validation."
nickname_candidates = ["Notary", "Custodian", "Warden", "Verifier"]
model = "stealth/ox-alpha"
