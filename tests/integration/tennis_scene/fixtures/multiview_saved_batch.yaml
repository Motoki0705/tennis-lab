# #2363 batch shape limited to the settings read by multiview GVHMR.
# The fixture leaves the old execution sections unbound and selects CPU.
device: cpu
paths:
  project_root: TEST_PROJECT_ROOT
  data_root: data
  checkpoint_root: ckpt
  artifact_root: artifacts
  output_root: outputs
  cache_root: .cache
  external_asset_root: external
people_models:
  hmr2_checkpoint: hmr2/epoch=10-step=25000.ckpt
  gvhmr_checkpoint: gvhmr/gvhmr_siga24_release.ckpt
  body_models_dir: body_models
  smpl_assets:
    hmr2_mean_params: body_models/gvhmr/smpl_mean_params.npz
    smplx_to_smpl: body_models/gvhmr/smplx2smpl_sparse.pt
    smpl_coco17_regressor: body_models/gvhmr/smpl_coco17_J_regressor.pt
    smplx_verts437: body_models/gvhmr/smplx_verts437.pt
    smpl_neutral_joint_regressor: body_models/gvhmr/smpl_neutral_J_regressor.pt
  runtime:
    device: ${device}
    tracking:
      bbox_enlarge: 1.2
    hmr2:
      batch_size: 16
      precision: fp32
      backend: pytorch
      engines: []
    gvhmr:
      batch_size: 1
      precision: fp32
      backend: pytorch
      engines: []
    static_cam: true
frame_sampling:
  max_frames: 2048
person_observations:
  visibility_threshold: 0.15
player_reconstruction:
  reprojection_px: 40
  placement:
    data_sigma_m: 0.1
    root_acceleration_sigma: 10.0
    yaw_acceleration_sigma: 20.0
    temporal_weight: 0.05
    min_joints: 5
    min_scale_pairs: 6
    min_scale: 0.7
    max_scale: 1.4
    max_reprojection_rms_px: 10.0
    reprojection_weight_sigma_px: 5.0
    max_nfev: 200
