      - -2.0
      - 2.0
      shear_y_deg_range:
      - -1.0
      - 1.0
      border_mode: reflect101
    scale_and_crop:
      enabled: true
      prob: 0.35
      scale_range:
      - 1.0
      - 3.0
      border_mode: reflect101
    ball_area_zero_mask:
      enabled: true
      prob: 0.35
      mask_width_ratio_range:
      - 0.04
      - 0.12
      mask_height_ratio_range:
      - 0.04
      - 0.12
      num_frames_range:
      - 1
      - 3
