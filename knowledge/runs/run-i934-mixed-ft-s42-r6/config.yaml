    contrast:
      enabled: true
      jitter: 0.1
    gamma:
      enabled: true
      jitter: 0.08
    gaussian_noise:
      enabled: true
      std: 0.012
    gaussian_blur:
      enabled: true
      prob: 0.35
      kernel_size: 3
    normalize_imagenet:
      enabled: true
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
