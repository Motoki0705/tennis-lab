      tracknet: 1.0
      meiji: 1.0
      chat_annotation: 1.0
  train_stride: 1
  eval_stride: null
  supervision:
    positive:
    - observed
    absent:
    - out_of_frame
    ignore:
    - interpolated
    - occlusion_estimated
    - unresolved
  batch_size: 4
  num_workers: 4
  pin_memory: true
  image_size:
  - 288
  - 512
  heatmap_size:
  - 72
  - 128
  sigma_ratio: 0.012
  max_instances: 16
loss:
  name: focal_bce
  gamma: 2.0
metrics:
