  num_classes: 1
  num_frames: 8
  input_layout: bcthw
  dims:
  - 64
  - 128
  - 256
  - 512
  depth: 2
  drop_path_prob: 0.0
  mdd_a: 0.2
  mdd_b: 0.15
data:
