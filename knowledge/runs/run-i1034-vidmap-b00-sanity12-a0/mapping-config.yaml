scene: null
mode: minimal
testset_id: null
name: uncalib-base
colmap_runtime: stock
workspace_outputs: false
output_root: null
frontend_cache_root: null
persist_intermediate_reconstructions: false
windowed_ate_sizes:
- 10
- 25
- 50
- 100
windowed_ate_auc_thresholds:
- 0.5
- 1.25
- 2.5
- 5.0
windowed_ate_auc_full_thresholds:
- 0.05
windowed_ate_auc_missing_error: null
eval_on_full_gt_timeline: false
mapper:
  setup:
    depth_uncertainty_scale: 0.05
  calibration:
    da3_log_focal_stddev: 0.24
    vgc_enabled: true
    vgc_focal_prior: true
    optimize_intrinsics: true
  depth_consistency:
    enabled: true
    depth_outlier_propagation: boundary
    mark_boundary_depth_outliers: true
    depth_ratio_threshold: 1.3
  ba:
    normal:
      iterations: 3
      kp_stddev: 2.0
      reproj_loss_name: soft_l1
      robust_risky_depth: false
      observation_filter_multiplier: 4.0
      convergence_filtered_point_ratio: 0.001
    annealing:
      iterations: 3
      kp_std: 0.5
      depth_magnitude_multiplier: 0.25
      reproj_loss_name: soft_l1
      fix_rotations: false
      robust_risky_depth: true
      depth_cutoff_cauchy_scales: 2
      depth_param_multiplier: 0.25
      mad_sigma_floor: 0.1
      observation_filter_multiplier: 4.0
      convergence_filtered_point_ratio: 0.001
      final_depth_param_multiplier: 0.125
    triangulation:
      min_angle: 0.001
      ignore_two_view_tracks: false
      create_max_angle_error: 3.0
      re_max_angle_error: 3.0
      re_max_trials: 1000000
      re_min_ratio: 1.0
      relaxed_max_transitivity: 1000
    depth:
      param_multiplier: 1.0
      magnitude_multiplier: 1.0
      cutoff_cauchy_scales: 0
      reg_loss_name: cauchy
      scale_std: 1.0
      target_stddev_multiplier: 1.0
      scale_reg_loss_name: soft_l1
      risky_track_length_threshold: 3
      risky_triangulation_angle_deg: 1.0
    intrinsics:
      principal_point_last_n_solves: 3
    focal_prior:
      enabled: true
      weight_multiplier: 0.0002
      robust_scale: 1.0
      normal_loss: huber
      annealing_loss: cauchy
    solver_backend:
      linear_solver: sparse_schur
      preconditioner: schur_jacobi
      use_cuda: false
    retriangulation_reproj_multiplier: 8.0
    first_iteration_error_multiplier: 2.0
    multiply_errors: 2.0
    reproj_loss_scale: 1.5
    num_threads: null
    variable_point_track_length_threshold: 15
    post_annealing_point_refinement: true
  vgc:
    filter:
      enabled: false
      num_threads: null
      min_matches: 10
      min_cheirality_points: 5
      subsample_size: 50
      strong_pair_match_count: 50
      min_median_triangulation_angle_deg: 16.0
      max_abs_forward_translation_ratio: 0.95
      min_strong_kept_pairs: 50
    calibration:
      unlock_focal: true
      focal_prior_weight: 1.0e-05
      normalize_weight_by_pair_count: true
  inlier_thresholds:
    max_epipolar_error_E: 8.0
    max_epipolar_error_F: 8.0
    max_epipolar_error_H: 8.0
    min_angle_from_epipole: 0.001
    max_angle_error: 1.0
    min_triangulation_angle: 0.001
    min_inlier_num: 5.0
    min_inlier_ratio: 0.0
  mdrp:
    max_workers: null
    ransac_max_iterations: 50000
    ransac_max_epipolar_error: 4.0
    depth_stddev_multiplier: 1.0
  gp:
    common:
      use_lc_observations: true
      use_metric_depth_constraint: true
      bearing_kp_stddev: 8.0
      optimize_depth_map_scales: true
      use_log_scale_for_depth_map_scales: false
      smooth_log_linear_transition: false
      log_linear_threshold: 0.1
      random_seed: 1
      loss_function_type: huber
      loss_function_weight: 1.0
      loss_function_scale: 0.1
      apply_uncalibrated_loss_downweight: false
      num_threads: null
      zero_residuals_behind_camera: false
    solver_backend:
      linear_solver: sparse_schur
      preconditioner: schur_jacobi
      use_cuda: false
    first_pass:
      scale_prior_stddev: 0.05
      max_iterations: 100
      function_tolerance_when_second: 0.0001
      gradient_tolerance_when_second: 1.0e-08
      parameter_tolerance_when_second: 1.0e-06
      scale_reg_loss_name: trivial
      scale_reg_weight: 1.0
      initialize_warm_start_scales: true
      sequential_support_warmup_rounds: 16
      sequential_support_observations_per_track: 16
      sequential_support_loss:
        name: trivial
        scale: 1.0
        weight: 1.0
      loss_lc_geometry:
        name: cauchy
        scale: 2.0
        weight: 0.4
      loss_lc_depth:
        name: cauchy
        scale: 2.0
        weight: 0.4
      loss_normal_geometry:
        name: huber
        scale: 1.0
        weight: 1.0
      loss_normal_depth:
        name: trivial
        scale: 1.0
        weight: 1.0
    second_pass:
      enabled: true
      scale_prior_stddev: 0.05
      max_iterations: 100
      use_log_depth_residual: true
      relax_angular_stddevs: 1.0
      scale_reg_loss_name: huber
      scale_reg_weight: 1.0
      loss_lc_geometry:
        name: cauchy
        scale: 4.0
        weight: 1.0
      loss_lc_depth:
        name: cauchy
        scale: 4.0
        weight: 1.0
      loss_normal_geometry:
        name: huber
        scale: 1.0
        weight: 1.0
      loss_normal_depth:
        name: huber
        scale: 1.0
        weight: 1.0
    track_filter:
      min_num_views_per_track: 2
      loss_normal_depth_outlier:
        name: cauchy
        scale: 3.0
        weight: 1.0
      depth_prior_outlier_max_depth: null
      depth_prior_outlier_stages: gp1
    temporal_acceleration:
      coordinate: timestamp
      stddev: 1.0
      first_pass_weight: 0.0
      second_pass_weight: 0.0
      first_pass_dead_zone: 0.0
      first_pass_huber_width: 1.0
      second_pass_dead_zone: 0.0
      second_pass_huber_width: 1.0
  ra:
    filter_risky_loop_closure_pairs: false
    filter_unregistered_images: true
    max_rotation_error_deg: 0.0
    video_tracking_huber_scale: 0.1
    video_lc_cauchy_scale: 0.05
    num_threads: null
  tracks:
    include_loop_closure_observations: true
    min_num_views_per_track: 2
    max_num_views_per_track: 100
    two_view_depth_gate: true
    loop_closure_second_pass: true
  replay_cache:
    mode: 'off'
    root: null
    write_stage: null
