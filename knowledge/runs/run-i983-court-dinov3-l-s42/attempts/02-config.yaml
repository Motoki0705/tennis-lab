paths:
  project_root: /content/tennis-lab
  data_root: /content/tennis-lab/data
  checkpoint_root: /content/tennis-lab/ckpt
  artifact_root: /content/tennis-lab/outputs
  output_root: /content/tennis-lab/outputs
  cache_root: /content/tennis-lab/.cache
  external_asset_root: /content/tennis-lab/third_party
data:
  source:
    kind: synthetic_court
    schema: v3
    court_scope: target_court
    workspace_root: synthetic_data_generation/scenes
    scene_ids:
    - B00
    - B01
    - B02
    - B03
  processing:
    targets:
    - kind: kp
      sigma_ratio: 0.01
    - kind: seg
      target_schema: court_cell_segmentation_coverage8_single_court_v3
    - kind: line
      target_schema: court_line_coverage8_75mm_150mm_single_court_v4
    - kind: semantic_line
      target_schema: court_line_semantic_camera_view_75mm_150mm_coverage8_single_court_v2
  augmentation:
    train_scales:
    - 512
    val_short_side: 512
    crop_scale:
    - 1.0
    - 1.0
    crop_ratio:
    - 1.0
    - 1.0
    hflip_prob: 0.0
    affine_degrees: 0.0
    affine_translate:
    - 0.0
    - 0.0
    affine_scale:
    - 1.0
    - 1.0
    affine_shear: 0.0
    perspective_distortion: 0.0
    perspective_prob: 0.0
    color_jitter:
    - 0.2
    - 0.2
    - 0.2
    - 0.05
    gaussian_blur_kernel:
    - 3
    - 5
    gaussian_blur_sigma:
    - 0.1
    - 1.5
    gaussian_blur_prob: 0.2
    min_visible_kp: 0
    visibility_max_retries: 1
    preserve_fx_fy: true
    canvas_size: null
    patch_size: 16
  batch_size: 8
  num_workers: 4
  pin_memory: true
model:
  name: court_hierarchical
  in_channels: 3
  encoder:
    name: dinov3
    backbone_name: dinov3_vitl16
    repository_path: dinov3
    checkpoint_path: dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
    strict: true
    train_mode: frozen
    last_n_blocks: 0
    out_indices:
    - 5
    - 11
    - 17
    - 23
    layer_mode: uniform
    lora:
      enabled: false
      rank: 8
      alpha: 16.0
      dropout: 0.0
      target_modules:
      - qkv
      - proj
      - fc1
      - fc2
  transformer_encoder:
    name: transformer
    enabled: true
    dim: 1024
    depth: 8
    num_heads: 16
    head_dim: 64
    ffn_dim: 2752
    rope_dim: 64
    rope_theta: 10000.0
    dropout: 0.0
    attention_type: mha
    n_kv_heads: null
    ffn_type: swiglu
  decoder:
    name: dpt
    size: large
    channels: 512
    reassemble_factors:
    - 4.0
    - 2.0
    - 1.0
    - 0.5
  dense_head:
    name: residual
    normalization_groups: 32
    kp:
      hidden_channels: 256
      depth: 2
    seg:
      hidden_channels: 256
      depth: 2
    line:
      hidden_channels: 256
      depth: 2
    semantic_line:
      hidden_channels: 256
      depth: 2
loss:
  seg:
    ce_weight: 1.0
    dice_weight: 1.0
    weight: 1.0
  kp:
    focal_gamma: 2.0
    weight: 1.0
  line:
    bce_weight: 1.0
    dice_weight: 1.0
    pos_weight: 8.0
    weight: 1.0
  semantic_line:
    ce_weight: 1.0
    dice_weight: 1.0
    weight: 1.0
  pose:
    enabled: true
    translation_weight: 1.0
    rotation_weight: 1.0
    focal_weight: 1.0
  consistency:
    enabled: false
    weight: 0.0
    temperature: 1.0
    huber_delta: 0.01
    min_depth_m: 0.1
    depth_scale_m: 1.0
    cheirality_weight: 0.0
    warmup_fraction: 0.0
    gradient_flow: both
training:
  trainer:
    max_epochs: 20
    gradient_clip_val: 1.0
    deterministic: warn
    precision: bf16-mixed
    log_every_n_steps: 50
    check_val_every_n_epoch: 3
    accumulate_grad_batches: 1
    reload_dataloaders_every_n_epochs: 0
    enable_progress_bar: true
    enable_model_summary: true
    benchmark: false
  learning_rate: 0.0001
  weight_decay: 1.0
  warmup_epochs: 3
  warmup_steps: null
  min_lr: 1.0e-06
  steps_per_epoch: null
  optimizer:
    name: adamw
    betas:
    - 0.9
    - 0.999
  compile:
    enabled: true
    backend: inductor
    mode: default
    fullgraph: false
    dynamic: false
  matmul_precision: high
  allow_tf32: true
  checkpoint:
    enabled: true
    filename: court-detection-{epoch:02d}
    monitor: val/loss
    mode: min
    save_top_k: -1
    save_last: true
  early_stopping:
    enabled: true
    monitor: val/loss
    mode: min
    patience: 10
    min_delta: 1.0e-05
    check_on_train_epoch_end: false
  lr_monitor:
    enabled: true
    interval: epoch
  qualitative_logging:
    enabled: true
    every_n_epochs: 5
    num_samples: 4
    selection_mode: fixed_indices
    selected_indices:
    - 0
    - 1
    - 2
    - 3
    fps: 6
  gan:
    enabled: false
    target_weight: 0.0
    warmup_epochs: 1
    generator_gradient_clip_val: null
    discriminator_gradient_clip_val: null
    transition:
      start_epoch: 0
run:
  seed: 42
  gpus: 1
  resume:
    role: artifact
    path: court_detection/train/i983-dino-l-shared1024/s42/resumes/attempt-01-last.ckpt
  init_weights: null
  fast_dev_run: false
  dry_run: false
  test_after_fit: true
  artifact_store:
    mode: rclone
    remote: gdrive
    remote_root: tennis_lab/outputs/court_detection/train/i983-dino-l-shared1024/s42
    sync_interval_seconds: 60
  output_dir: court_detection/train/i983-dino-l-shared1024/s42
render_style:
  draw:
    kp_radius: 4
    kp_color_rgb:
    - 96
    - 255
    - 128
    kp_thickness: -1
    line_threshold: 0.5
  layout:
    header_height: 36
    display_width: 640
    tile_gap: 12
    text_scale: 0.52
    text_thickness: 1
    background_rgb:
    - 18
    - 18
    - 18
    text_color_rgb:
    - 245
    - 245
    - 245
    panel_label_height: 24
mixed:
  sources:
    tennis_court_detector:
      kind: tennis_court_detector
      root: court_detection/tennis_court_detector-v1
      split_mapping:
        train: train
        val: val
        test: null
      excluded_sample_ids:
      - QszoUKyCOHo_600
    synthetic_court:
      kind: synthetic_court
      schema: v3
      court_scope: target_court
      workspace_root: synthetic_data_generation/scenes
      scene_ids:
      - B00
      - B01
      - B02
      - B03
  train_batch_counts:
    synthetic_court: 4
    tennis_court_detector: 4
