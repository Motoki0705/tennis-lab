    enabled: false
    joint_dropout: 0.1
    ball_dropout: 0.15
    uv_std: 0.003
    burst_probability: 0.5
    burst_max_frames: 24
    rgb_only_probability: 0.15
    rgb_dropout_probability: 0.1
