  data_root: data
  checkpoint_root: ckpt
  artifact_root: artifacts
  output_root: /content/drive/MyDrive/tennis_lab/colab-live/20260909t142241z-9b25420d/outputs/colab
  cache_root: .cache
  external_asset_root: third_party
model:
  name: blcs_multiview_axial_reference
  io:
    input_profile: multiview
  hidden_dim: 512
  num_layers: 8
  num_heads: 8
  camera_layers_per_stage:
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  time_layers_per_stage:
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  - 1
  time_global_stage_mask:
  - false
  - false
  - false
  - false
  - false
  - false
  - false
  - false
  attention_type: mha
  num_kv_heads: null
  ffn_dim: 1408
  ffn_type: swiglu
  dropout: 0.1
  rope_dim: 16
  rope_theta_time: 10000.0
  rope_theta_camera: 1000.0
  time_window_radius: 16
  max_seq_len: 256
  max_num_cameras: 4
  predict_velocity: false
  invisible_init_std: 0.02
  num_court_tokens: 14
  target_frame_contract: reference_camera_court_rzpi_v1
  axial_rope_contract: time_camera_reference_selector_v1
  reference_selector_mode: reference
data:
  augmentation:
    enabled: true
    preserve_clean_targets: true
    uv_scale:
      enabled: false
      prob: 1.0
      scale_range:
      - 1.0
      - 1.0
      apply_to_ball: true
      apply_to_court: true
    gaussian_noise:
      enabled: true
      prob: 1.0
      ball_std: 0.0037
      court_std: 0.0
    visibility_dropout:
      enabled: true
      prob: 1.0
      drop_prob: 0.06
    temporal_jitter:
      enabled: true
      prob: 1.0
      jitter_std: 0.0025
      drift_std: 0.0015
      drift_decay: 0.85
    burst_dropout:
      enabled: true
      prob: 0.4
      track_prob: 1.0
      min_len: 2
      max_len: 16
      max_bursts: 3
    false_positive:
      enabled: true
      prob: 1.0
      prob_absent: 0.1
      prob_after_dropout: 0.03
      after_dropout_window: 2
    edge_degradation:
      enabled: true
      prob: 1.0
      edge_margin: 0.1
      noise_std: 0.006
      drop_prob: 0.08
      clip_out_prob: 0.02
    speed_conditioned:
      enabled: true
      prob: 1.0
      frame_prob: 0.07
      speed_threshold: 0.03
      lag_overshoot_range:
      - -0.25
      - 0.35
      noise_std: 0.0037
  camera_mode: random
  num_views_range:
  - 3
  - 4
  batch_size: 16
  camera_candidates:
  - 0
  - 1
  - 2
  - 3
  backend: default
  scene_dir: blcs/single_object_camera_view_v2
  num_court_kp: 14
  num_workers: 4
  pin_memory: true
  seq_len_range:
  - 128
  - 128
  evaluation_reference_camera_id: cam_0
training:
  trainer:
    max_epochs: 50
    gradient_clip_val: 1.0
    deterministic: true
    precision: bf16-mixed
    log_every_n_steps: 100
    check_val_every_n_epoch: 1
    accumulate_grad_batches: 1
    reload_dataloaders_every_n_epochs: 0
    enable_progress_bar: true
    enable_model_summary: true
    benchmark: false
  learning_rate: 0.0001
  weight_decay: 0.1
  warmup_steps: 1000
  warmup_epochs: null
  min_lr: 1.0e-06
  steps_per_epoch: null
  optimizer:
    betas:
    - 0.9
    - 0.999
  compile:
    enabled: true
    backend: inductor
    mode: default
    fullgraph: false
    dynamic: false
  checkpoint:
    enabled: true
    filename: blcs-{epoch:02d}
    monitor: val/position_error_m
    mode: min
    save_top_k: 3
    save_last: true
  early_stopping:
    enabled: false
    monitor: val/position_error_m
    mode: min
    patience: 10
    min_delta: 0.001
    check_on_train_epoch_end: false
  lr_monitor:
    enabled: true
    interval: step
  qualitative_logging:
    enabled: true
    every_n_epochs: 20
    num_samples: 4
    selection_mode: random
    selected_indices: null
  qualitative_rendering:
    fps: 10.0
    style:
      theme: light
      show_shadow: true
      show_trail: true
      trail_length: 60
      show_hud: true
      show_minimap: true
  matmul_precision: high
  allow_tf32: true
  gan:
    enabled: false
    target_weight: 2.0
    warmup_epochs: 10
    generator_gradient_clip_val: 1.0
    discriminator_gradient_clip_val: 1.0
    transition:
      start_epoch: 50
    discriminator:
      name: trajectory_transformer
      hidden_dim: 128
      num_layers: 4
      num_heads: 4
      ffn_dim: 256
      ffn_type: swiglu
      dropout: 0.1
      rope_dim: 32
      rope_theta: 10000.0
      max_seq_len: 10240
      invalid_init_std: 0.02
      cls_init_std: 0.02
loss:
  position_weight: 1.0
  position_axis_weights: null
  reprojection_weight: 1.0
  smoothness_weight: 0.0
  gravity_weight: 0.0
