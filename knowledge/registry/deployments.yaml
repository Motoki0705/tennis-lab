- config: src/tennis_scene/configs/pipeline.yaml
  key: ball_detection.checkpoint
  value: ball_detection/i935-mixed-ft-s42-epoch09.ckpt
  task: ball_detection
  since: '2026-10-01'
  evidence:
  - run-i935-mixed-ft-val-recall-s42-r16-20260929
  - run-i935-evidence-mixed-e9-trainval-r17-20260930
  - run-i935-confidence-r29-20261001
  note: >-
    #935の混合FTのepoch 9。2026-10-01のユーザー判断（#935のコメント）で既定にした。
    根拠ノードは廃止したball_refinerトピックにある。
