# 標準pipelineが選ぶcheckpointと、その採用根拠の対応表。CIがconfigsの値と照合する。
# configsに挙げたYAMLの `checkpoint` / `*_checkpoint` キーは、すべてここに1件ずつ必要。
# 学習したモデルはevidence（ノードID）、外部の公開重みはsource（重みの出典を記したrepo内文書）で根拠を示す。
# 値を変えるPRでは、この表・根拠ノード・summary.mdを同時に更新する。
schema_version: 1
configs:
- src/tennis_scene/configs/pipeline.yaml
deployments:
- config: src/tennis_scene/configs/pipeline.yaml
  key: court_kp.checkpoint
  value: court_detection/multiscale_depth3/b863df1f01f0.ckpt
  task: court_detection
  evidence:
  - run-court-meiji-model-only-regions-20260922
  - run-i931-default-meiji-clip000-20260927
  note: >-
    画像だけによる領域探索と組み合わせて、Meiji 3cameraの先頭frameで校正が通ったことが採用の根拠。
    このcheckpointを学習したrunのノードは未登録。
- config: src/tennis_scene/configs/pipeline.yaml
  key: people_models.dino_checkpoint
  value: dino/checkpoint0029_4scale_swin.pth
  task: player_detection
  source: LICENSES.md
  evidence:
  - run-i964-coco-fullframe-r5-20260929
  note: COCO事前学習の重みをpersonクラスだけで使う。#937の選手検出FTは明示的なcheckpoint指定でだけ使う。
- config: src/tennis_scene/configs/pipeline.yaml
