D_model: 256
dim_feedforward: 1024
nheads: 8
decoder_layers: 6
dropout: 0.1

# v2.5 uses the same hierarchical encoder depth as v2 by default.
intra_layers: 3    # プレーヤー内エンコーダ層数
inter_layers: 3    # プレーヤー間エンコーダ層数
temporal_layers: 3 # 時間エンコーダ層数

num_joints: 20
num_court_points: 20
num_queries: 50
max_cameras: 8
max_frames: 32
