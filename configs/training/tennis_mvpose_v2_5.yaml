seed: 42

trainer:
  max_epochs: 500
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-4

max_steps: 7000

scheduler:
  name: cosine_with_warmup
  warmup_steps: 500
  min_lr_ratio: 0.1

loss:
  # v2.5 用分離損失重み（v2 と同じ初期値）
  lambda_canonical: 1.0      # canonical pose損失
  lambda_root_trans: 1.0     # root translation損失
  lambda_root_rot: 0.5       # root rotation損失
  lambda_global: 1.0         # global pose損失
  lambda_exist: 0.5          # existence損失
  lambda_vel: 0.0            # velocity損失

  # マッチング用重み
  lambda_pose_match: 1.0
  lambda_exist_match: 0.5
