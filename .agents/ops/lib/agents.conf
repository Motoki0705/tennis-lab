# Models used by every headless agent run (agent_exec.sh). Pinned here so manual runs
# and systemd timers use the same model regardless of which CLI config they load.
# Literal NAME=value assignments (not shell code). Task overrides win over role
# defaults; job profiles require their own complete pins and reject overrides.
CLAUDE_MODEL="claude-opus-5-5"
CLAUDE_EFFORT="xhigh"
CODEX_MODEL="gpt-6.1-sol"
CODEX_EFFORT="max"
CODEX_SERVICE_TIER="default"
# Only this explicitly selected alternate is allowed for implementation tasks.
CODEX_ALTERNATE_MODEL="gpt-6-astra"

# Job profiles (agent_exec.sh --profile <name>): <NAME>_<AGENT>_{MODEL,EFFORT[,SERVICE_TIER]}.
# A profile must set every pin for the agents it is used with; nothing falls back to
# the defaults above.
#
# review: one explicitly requested parent-issue review (.agents/ops/review/).
REVIEW_CODEX_MODEL="gpt-6-astra"
REVIEW_CODEX_EFFORT="xhigh"
REVIEW_CODEX_SERVICE_TIER="default"

# ops_report: read-only Claude parent and independently pinned Codex scouts.
OPS_REPORT_CLAUDE_MODEL="claude-opus-5-5"
OPS_REPORT_CLAUDE_EFFORT="xhigh"
OPS_REPORT_MAX_THREADS=3
OPS_SCOUT_CODEX_MODEL="gpt-6.1-sol"
OPS_SCOUT_CODEX_EFFORT="max"
OPS_SCOUT_CODEX_SERVICE_TIER="default"

# Scheduled issue judgement. Development parents retain the Claude role defaults.
ISSUE_JUDGEMENT_CODEX_MODEL="gpt-6.1-sol"
ISSUE_JUDGEMENT_CODEX_EFFORT="xhigh"
ISSUE_JUDGEMENT_CODEX_SERVICE_TIER="default"

# Linux x64 agy, pinned to the official GitHub release asset and API SHA-256 digest.
AGY_VERSION="1.4.11"
AGY_URL="https://github.com/google-antigravity/antigravity-cli/releases/download/1.4.11/agy_cli_linux_x64.tar.gz"
AGY_SHA256="d17c426977326361f3d81f3ea22820e967164285923de020247e460dcb9d15c3"
ISSUE_SUPPLEMENT_AGY_MODEL="gemini-3.8-flash-high"
