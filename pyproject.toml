[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-lab"
version = "0.1.0"
description = "ML components for tennis video analysis: ball/court/player detection and 3D scene reconstruction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.0",
    "deep-sort-realtime>=1.3.2",
    "ezc3d>=1.7.1",
    "gdown>=6.1.0",
    "huggingface-hub>=0.36.0",
    "hydra-core>=1.3.4",
    "matplotlib>=3.11.1",
    "omegaconf>=2.3.1",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pytorch-lightning>=2.6.5",
    "scipy>=1.13.1",
    "smpl>=1.5.7",
    "smplx>=0.1.28",
    "tensorboard>=2.21.0",
    "termcolor>=3.2.0",
    "timm>=1.0.28",
    "torch>=2.9.0",
    "torchreid>=0.2.5",
    "torchvision>=0.24.0",
    "tqdm>=4.67.1",
    "transformers>=5.14.1",
    "ultralytics>=8.4.114",
    "yt-dlp>=2026.7.4",
    "PyYAML>=6.0.0",
    "sam3>=0.1.4",
    "pydantic>=2.13.4",
    "imageio>=2.37.4",
    "av>=18.0.0",
    "uvicorn>=0.52.0",
    "fastapi>=0.135.3",
    "requests>=2.34.2",
    "vllm>=0.26.0",
    "lap>=0.5.12",
    "mcp>=1.28.1,<2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
    "spin>=0.18",
    "types-pyyaml>=6.0.12.20260724",
    "types-requests>=2.32.4.20250913",
    "coverage>=7.15.4",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "pydeps>=3.0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["src.tasks.blcs.generate_dataset.webui*"]
namespaces = false

[tool.setuptools.package-data]
"*" = [
    "README.md",
    "configs/*.yaml",
    "configs/*/*.yaml",
    "configs/*/*/*.yaml",
    "configs/*/*/*.txt",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "third_party",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = [
    # Star imports are used for convenience in some modules
    "F405",
    "F403",
    # Line too long (handled by Black)
    "E501",
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Vendored GVHMR research code is kept close to upstream; style-only rules are
# relaxed there (pyflakes stays active). See src/submodules/vendor/gvhmr/README.md.
"src/submodules/vendor/**" = ["B", "SIM", "E731"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Start with a more permissive configuration
[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "mpl_toolkits.*",
    "torch.*",
    "torchvision.*",
    "tqdm.*",
    "transformers.*",
    "omegaconf.*",
    "pytorch_lightning.*",
    "tensorboard.*",
    "ultralytics.*",
    "torchreid.*",
    "deep_sort_realtime.*",
    "gdown.*",
    "gsplat.*",
    "plyfile.*",
    "scipy.*",
    "MultiScaleDeformableAttention",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["third_party.*"]
ignore_errors = true

# Vendored GVHMR research code (see src/submodules/vendor/gvhmr/README.md).
# Ported nearly verbatim from third_party/GVHMR and intentionally left
# untyped; typed wrappers live in src.submodules.models.
[[tool.mypy.overrides]]
module = ["src.submodules.vendor.*"]
ignore_errors = true

# Tests are still type-checked (bodies are validated), but pytest's own
# fixture / parametrize decorators are seen as untyped under the
# `--follow-imports=skip` pre-commit invocation, so the strict
# "annotate every def / no untyped decorators" rules cannot be satisfied for
# test functions. Relax those ceremony-only rules for the tests package while
# keeping real type errors active. `warn_unreachable` is also disabled because
# asserting on state mutated by a helper call trips mypy's narrowing.
# CLI entry points under scripts/ decorate `main` with the shared typed
# `src.utils.hydra.hydra_main` wrapper. The pre-commit hook runs mypy with
# `--follow-imports=skip`, so unless src/utils/hydra.py happens to be in the
# same commit the wrapper is not analyzed and the decorator is seen as
# untyped. Relax only that ceremony rule for script entry points.
[[tool.mypy.overrides]]
module = [
    "src.tasks.*.scripts.*",
    "src.tennis_scene.scripts.*",
    "src.synthetic_data_generation.scripts.*",
    "experiments.*.scripts.*",
]
disallow_untyped_decorators = false

# The MCP SDK's FastMCP.tool decorator is typed during normal analysis, but
# appears untyped when the pre-commit hook intentionally skips imported bodies.
[[tool.mypy.overrides]]
module = ["src.automation.chatgpt_mcp.server"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false
warn_unused_ignores = false
warn_unreachable = false

# spin loads .spin/cmds.py as the top-level module "cmds". With the pre-commit
# hook's --follow-imports=skip, Click's decorators are intentionally not
# analyzed; relax only that decorator rule while keeping command bodies strict.
[[tool.mypy.overrides]]
module = ["cmds"]
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    # importlib import mode lets the tests/ tree mirror src/ without __init__.py
    # files and tolerates duplicate test basenames across mirrored packages
    # (e.g. utils/data/test_augmentation.py vs tasks/base/data/test_augmentation.py).
    "--import-mode=importlib",
    # Run the suite in parallel across CPU cores (pytest-xdist).
    "-n",
    "auto",
    "--strict-markers",
    "--disable-warnings",
    # Enable doctest for docstring Examples (turn on when examples are stable)
    # "--doctest-modules",
    # "--doctest-glob=*.md",
]
markers = [
    "unit: Unit tests for individual functions and classes",
    "integration: Integration tests for multiple components working together",
    "e2e: End-to-end tests for complete workflows",
    "slow: Slow running tests",
    "local_data: Tests requiring large local datasets/models (not for CI)",
    "cuda: Tests requiring CUDA/GPU (skipped if GPU unavailable)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.spin]
package = "src"

[tool.spin.commands]
"Environment" = [
    ".spin/cmds.py:setup",
    ".spin/cmds.py:setup_nht",
    ".spin/cmds.py:doctor",
]
"Quality" = [
    ".spin/cmds.py:lint",
    ".spin/cmds.py:typecheck",
    ".spin/cmds.py:test",
    ".spin/cmds.py:ci",
]
