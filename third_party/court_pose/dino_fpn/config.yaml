# coat_config.yaml
# Path to your Lightning checkpoint (.ckpt)
checkpoint_path: "trained_models/court_pose/dino_fpn/din_fpn.ckpt"

# --- Model params (must match your training) ---
heatmap_channels: 15
decoder_channels: [256, 128, 64, 32]
backbone_name: "dinov3_vitl16"
weights_path: "third_party/dinov3/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"

# --- Transforms (Imagenet/DINO-style defaults) ---
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
pad_to_multiple: 16 # set null to disable padding
resize_long_side: null # e.g., 1024 to constrain resolution

# --- Runtime ---
device: "cuda" # "cuda" | "cpu" | "mps"
strict: false # true only if you expect a perfect key match
remove_prefix: "model." # remove Lightning wrapper prefix
allow_partial: true # load only intersecting keys
