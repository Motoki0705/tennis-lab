# Default loading parameters for the DINO FPN v2 court pose estimator
checkpoint_path: "trained_models/court_pose/dino_fpn_v2/dino_fpn_v2.ckpt"

# Backbone (DINOv3) settings
repo_dir: "third_party/dinov3"
entry: "dinov3_vits16"
weights: null
freeze: true
vit_layers: [11]
fpn_channels: 256

# Decoder settings
num_keypoints: 15
decoder_base_channels: 256
decoder_channels: [256, 128, 64]
decoder_upsample_mode: "bilinear"
decoder_final_activation: null

# Transforms
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
pad_to_multiple: 16
resize_long_side: null

# Runtime
device: "cuda"
strict: false
remove_prefix: "model."
allow_partial: true
