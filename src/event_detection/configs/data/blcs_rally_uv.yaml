# BLCS rally NPZ directory (generated by src.blcs.scripts.generate_dataset)
scene_dir: "data/blcs"

batch_size: 32
num_workers: 4
cache_max_scenes: 128

# Scene sampler settings: none | scene | mixed | chunked
scene_sampler_mode: chunked
scenes_per_batch: 32
chunk_max_scenes: 64

# Camera selection: "random" or integer index
camera_mode: "random"

# Sequence/window sampling
max_seq_len: 1024

# Labels (soft targets)
label:
  sigma_frames: 2.5
  shot_time_key: "t_start"
  bounce_time_key: "t_bounce1"
