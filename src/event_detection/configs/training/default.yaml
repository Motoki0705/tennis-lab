# ---- Trainer (Lightning Trainer settings) ----
trainer:
  max_epochs: 20
  gradient_clip_val: 1.0
  deterministic: true
  precision: null
  log_every_n_steps: 50
  check_val_every_n_epoch: 1

# ---- Optimizer / schedule (LightningModule references) ----
learning_rate: 1e-4
weight_decay: 1e-5
warmup_steps: 200
scheduler: cosine
min_lr: 1e-6

# ---- Loss weights (task-specific) ----
# BCE-with-logits positive class weighting (per event)
# Use 1.0 for neutral weighting.
pos_weight: [5.0, 5.0]

# ---- Callbacks (BaseTrainingRunner references) ----
checkpoint:
  enabled: true
  filename: "event-detection-{epoch:02d}"
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: val/loss
  mode: min
  patience: 5
  min_delta: 1.0e-3

lr_monitor:
  enabled: true
  interval: step
