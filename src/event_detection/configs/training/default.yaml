learning_rate: 1e-4
weight_decay: 1e-5
warmup_steps: 200
max_epochs: 20
min_lr: 1e-6
gradient_clip_val: 1.0
scheduler: cosine

# BCE-with-logits positive class weighting (per event)
# Use 1.0 for neutral weighting.
pos_weight: [5.0, 5.0]

# ---- Lightning Trainer 相当（直下）----
log_every_n_steps: 50
precision: null
deterministic: true

# ---- Callbacks（BaseTrainingRunnerが参照）----
checkpoint:
  enabled: true
  filename: "event-detection-{epoch:02d}"
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: val/loss
  mode: min
  patience: 5
  min_delta: 1.0e-3

lr_monitor:
  enabled: true
  interval: step
