# ---- Trainer (Lightning Trainer settings) ----
trainer:
  max_epochs: 20
  gradient_clip_val: 1.0
  deterministic: true
  precision: "16-mixed"
  log_every_n_steps: 50
  check_val_every_n_epoch: 1

# ---- Optimizer / schedule (LightningModule references) ----
learning_rate: 1.0e-5
weight_decay: 1.0e-5
warmup_steps: 500
scheduler: cosine
min_lr: 1.0e-6

# ---- Loss weights ----
loss:
  masked_weight: 1.0
  observed_weight: 0.16
  smoothness_weight: 0.01
  in_frame_weight: 0.2
  huber_delta: 0.02
  masked_schedule:
    enabled: true
    start_epoch: 0
    end_epoch: 20
    weight_min: 0.0
    weight_max: 1.0
  auxiliary_observed:
    enabled: false
    weight: 0.2
    depth_weighting: linear  # linear | exp
    exp_gamma: 1.5
    predictor_hidden_dim: ${model.hidden_dim}

# ---- Callbacks (BaseTrainingRunner references) ----
checkpoint:
  enabled: true
  filename: "trajectory-completion-{epoch:02d}"
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: val/loss
  mode: min
  patience: 200
  min_delta: 1.0e-5

lr_monitor:
  enabled: true
  interval: step
