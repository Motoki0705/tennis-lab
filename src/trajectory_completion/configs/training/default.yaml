# ---- Trainer (Lightning Trainer settings) ----
trainer:
  max_epochs: 100
  gradient_clip_val: 1.0
  deterministic: true
  precision: "16-mixed"
  log_every_n_steps: 50
  check_val_every_n_epoch: 1

# ---- Optimizer / schedule (LightningModule references) ----
learning_rate: 1.0e-4
weight_decay: 1.0e-5
warmup_steps: 500
scheduler: cosine
min_lr: 1.0e-6

# ---- Loss weights ----
loss:
  masked_weight: 1.0
  observed_weight: 0.1
  smoothness_weight: 0.1
  huber_delta: 0.02

# ---- Callbacks (BaseTrainingRunner references) ----
checkpoint:
  enabled: true
  filename: "trajectory-completion-{epoch:02d}"
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: val/loss
  mode: min
  patience: 20
  min_delta: 1.0e-5

lr_monitor:
  enabled: true
  interval: step
