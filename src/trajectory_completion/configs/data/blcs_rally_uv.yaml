# BLCS rally scene dataset (npz) used for UV trajectory completion training.

scene_dir: data/blcs
split:
  train_file: train.txt
  val_file: val.txt
  test_file: test.txt

camera_mode: random  # random | int camera index
max_seq_len: 256
min_seq_len: 16

batch_size: 16
num_workers: 4
pin_memory: true

supervise_visible_only: true

corruption:
  enabled: true
  noise_std: 0.01
  clamp_unit: true

  point_dropout_prob: 0.05
  gap_dropout_prob: 0.25
  max_gap_len: 12
  max_masked_ratio: 0.6

  outlier_prob: 0.0

allow_dummy: true

