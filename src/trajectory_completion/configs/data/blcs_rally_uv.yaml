# BLCS rally scene dataset (npz) used for UV trajectory completion training.

scene_dir: data/blcs
split:
  train_file: train.txt
  val_file: val.txt
  test_file: test.txt

camera_mode: random  # random | int camera index
max_seq_len: 1024
min_seq_len: 16

batch_size: 32
num_workers: 4
pin_memory: true
cache_max_scenes: 128

# Scene sampler settings: none | scene | mixed | chunked
scene_sampler_mode: chunked
scenes_per_batch: 1
chunk_max_scenes: 64

supervise_visible_only: true

corruption:
  enabled: true
  noise_std: 0.01
  clamp_unit: true

  point_dropout_prob: 0.05
  gap_dropout_prob: 0.1
  max_gap_len: 8
  max_masked_ratio: 0.3

  outlier_prob: 0.0
