# ViT encoder + decoder heatmap model config
num_keypoints: 20

encoder:
  patch_size: 16
  in_channels: 3
  max_resolution: 1024
  hidden_dim: 768
  num_layers: 12
  num_heads: 12
  ffn_dim: null
  dropout: 0.1
  num_register_tokens: 4
  use_cls_token: true
  rope_dim: null
  rope_theta: 1000.0
  use_moe: true
  moe_layer_freq: 2
  moe_config:
    moe_inter_dim: null
    n_routed_experts: 8
    n_shared_experts: 2
    n_activated_experts: 2
    n_expert_groups: 1
    n_limited_groups: 1
    score_func: softmax
    route_scale: 1.0

decoder:
  embed_dim: 512
  depth: 4
  num_heads: 8
  ffn_dim: null
  dropout: 0.0
  rope_dim: null
  rope_theta: 1000.0

visibility_head:
  hidden_dim: 256
  dropout: 0.2
