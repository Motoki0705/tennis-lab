defaults:
  - run: default
  - _self_

generation:
  num_scenes: 10000
  num_frames_per_scene: 1
  output_dir: data/court_detection/scenes
  image_size: [1280, 720]
  render_synthetic: true

camera:
  hfov_range: [40.0, 80.0]
  height_range: [1.5, 4.0]
  distance_range: [15.0, 30.0]
  pitch_noise_deg: 5.0
  yaw_noise_deg: 10.0

augmentation:
  enabled: true
  brightness_range: [0.8, 1.2]
  contrast_range: [0.8, 1.2]
  noise_std: 0.01

hydra:
  run:
    dir: ${run.output_dir}/generate_dataset/${now:%Y-%m-%d_%H-%M-%S}
