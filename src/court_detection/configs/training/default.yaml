max_epochs: 100
learning_rate: 1.0e-4
weight_decay: 1.0e-4
warmup_epochs: 5

optimizer:
  name: adamw
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  min_lr: 1.0e-6

gradient_clip_val: 1.0

early_stopping:
  patience: 20
  monitor: val/loss
  mode: min

checkpoint:
  save_top_k: 3
  monitor: val/pck
  mode: max
