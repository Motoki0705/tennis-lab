# ---- Trainer (Lightning Trainer settings) ----
trainer:
  max_epochs: 100
  gradient_clip_val: 1.0
  deterministic: true
  precision: "16-mixed"
  log_every_n_steps: 50
  check_val_every_n_epoch: 1

# ---- Optimizer / schedule (LightningModule references) ----
learning_rate: 1.0e-4
weight_decay: 1.0e-5
warmup_steps: 1000
scheduler: cosine
min_lr: 1.0e-6

# ---- Callbacks (BaseTrainingRunner references) ----
checkpoint:
  enabled: true
  filename: "plcs-{epoch:02d}"
  monitor: val/epoch_position_error_m
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: val/epoch_position_error_m
  mode: min
  patience: 10
  min_delta: null

lr_monitor:
  enabled: true
  interval: step

