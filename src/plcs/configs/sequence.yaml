# PLCS Sequence Configuration
# Player Localization in Court System - Sequential model

model:
  # Base model dimensions (same as frame model by default)
  hidden_dim: 256
  num_layers: 8
  num_heads: 8
  dropout: 0.1
  max_seq_len: 120

  # Architecture type
  architecture: "sequence"  # explicit marker (informational)

data:
  # Scene data directory
  scene_dir: "data/plcs/scenes"
  # DataLoader settings
  batch_size: 64
  num_workers: 4
  # Train/Val/Test split
  val_split: 0.1
  test_split: 0.1
  # Camera selection mode: "random", "all", or camera index
  camera_mode: "all"

  # Sequence settings for PLCSSequenceDataModule
  mode: "sequence"   # use sequence-based dataset
  seq_len: 32         # sequence length (frames)
  seq_stride: 8       # stride between sequence start indices

  # Augmentation (applied per-frame inside sequences)
  augmentation:
    keypoint_noise_std: 0.01
    visibility_drop_prob: 0.05

training:
  max_epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  warmup_steps: 1000
  gradient_clip_val: 1.0
  # Loss weights
  position_loss_weight: 1.0
  rotation_loss_weight: 1.0
  # Scheduler
  scheduler: cosine
  min_lr: 1.0e-6

metrics:
  # Accuracy thresholds
  position_threshold_m: 0.5   # Position accuracy threshold (meters)
  angle_threshold_deg: 15.0   # Angle accuracy threshold (degrees)
  velocity_threshold_m: 1.0   # Velocity accuracy threshold (meters per frame)
