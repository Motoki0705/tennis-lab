# Multi-view PLCS data configuration
scene_dir: data/plcs
batch_size: 64
num_workers: 4
val_split: 0.1
test_split: 0.1

# Mode: "multiview" (frame-based) or "multiview_sequence" (temporal)
mode: multiview_sequence

# Multi-view specific settings
num_views: 2
min_cameras: 2

# Sequential settings
seq_len: 16

# Range sampling for dynamic view/seq (optional)
# When enabled, each sample will randomly pick a value from the range
num_views_range: [1, 8]  # min, max inclusive
seq_len_range: [8, 64]   # min, max inclusive

augmentation:
  keypoint_noise_std: 0.01
  visibility_drop_prob: 0.05
