defaults:
  - data: multiview
  - run: analyze_dataset_distribution
  - _self_

analysis:
  # "per_frame" uses the stored per-frame trajectory.
  # "initial_only" only exports `initial_conditions.csv` and camera statistics.
  mode: per_frame
  max_scenes: null
  max_frames_per_scene: null
  radius_thresholds_m: [0.5, 1.0, 2.0, 4.0]

  xy_hist:
    bins_x: 64
    bins_y: 96
    # Court coordinate system is centered at net center (origin).
    # Defaults cover the whole doubles court (no fence/run-off).
    x_range_m: [-5.485, 5.485]
    y_range_m: [-11.885, 11.885]

  yaw_hist:
    bins: 72

plots:
  enabled: true
  dpi: 150

hydra:
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  output_subdir: null
  job:
    chdir: false

