# PLCS Sequence Model Configuration
# Tokens: court(20) + T * (CLS_po, CLS_ro, player_kp[17])

name: plcs_sequence

# Architecture
hidden_dim: 256
num_layers: 8
num_heads: 8
ffn_dim: null        # Defaults to 8/3 * hidden_dim (rounded to 64)
dropout: 0.1
invisible_init_std: 0.02

# Maximum temporal length T
max_seq_len: 2048

# RoPE (applied to all tokens)
rope_dim: null       # Defaults to head_dim (hidden_dim / num_heads)
rope_theta: 10000.0

# YaRN (optional long-context extrapolation for RoPE)
yarn: null

# MoE (optional; applied to all blocks)
use_moe: true
moe_config:
  moe_inter_dim: 704
  n_routed_experts: 8
  n_shared_experts: 2
  n_activated_experts: 2
  n_expert_groups: 1
  n_limited_groups: 1
  score_func: softmax
  route_scale: 1.0

# Model type
architecture: sequence
