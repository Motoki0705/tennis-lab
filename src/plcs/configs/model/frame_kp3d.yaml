## PLCS frame keypoint-3D model configuration
## Reuses PLCS transformer backbone and predicts per-keypoint 3D directly.

name: plcs_kp3d

io:
  input_profile: frame_kp3d
  strict_input: true

hidden_dim: 256
num_layers: 4
num_heads: 8
ffn_dim: null
dropout: 0.1
invisible_init_std: 0.02

num_register_tokens: 4
use_kp_id_embedding: true
use_rope: false

rope_dim: null
rope_theta: 10000.0
yarn: null

use_moe: true
moe_config:
  moe_inter_dim: 704
  n_routed_experts: 8
  n_shared_experts: 2
  n_activated_experts: 2
  n_expert_groups: 1
  n_limited_groups: 1
  score_func: softmax
  route_scale: 1.0
