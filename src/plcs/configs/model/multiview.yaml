# Multi-view PLCS model configuration
# Per-camera tokens: court_m(20) + T * (CLS_po_{m,t}, CLS_ro_{m,t}, player_{m,t}[17])
# Uses 2D RoPE over (time, camera) axes.

name: plcs_multiview

# Architecture
hidden_dim: 256
num_layers: 6
num_heads: 8
ffn_dim: null        # Defaults to 8/3 * hidden_dim (rounded to 64)
dropout: 0.1
invisible_init_std: 0.02

# Limits
max_views: 8
max_seq_len: 120

# 2D RoPE
rope_dim: null       # Defaults to head_dim; must satisfy rope_dim % 4 == 0
rope_theta: 10000.0

# MoE (optional; applied to all blocks)
use_moe: false
moe_config:
  moe_inter_dim: 704
  n_routed_experts: 8
  n_shared_experts: 2
  n_activated_experts: 2
  n_expert_groups: 1
  n_limited_groups: 1
  score_func: softmax
  route_scale: 1.0

# Model type
architecture: multiview
