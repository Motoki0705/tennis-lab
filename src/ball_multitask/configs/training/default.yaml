trainer:
  max_epochs: 20
  gradient_clip_val: 1.0
  deterministic: true
  precision: "16-mixed"
  log_every_n_steps: 50
  check_val_every_n_epoch: 1

learning_rate: 1.0e-4
weight_decay: 1.0e-5
warmup_steps: 200
scheduler: cosine
min_lr: 1.0e-6

loss:
  uv:
    weight: 0.3
    masked_weight: 1.0
    observed_weight: 0.1
    smoothness_weight: 0.0
    huber_delta: 0.02
    in_frame_weight: 0.2
  traj3d:
    weight: 1.0
    position_weight: 1.0
    velocity_weight: 0.1
    smoothness_weight: 0.05
  event:
    weight_uv: 0.2
    weight_3d: 0.2
    pos_weight: [1.0, 1.0]

curriculum:
  uv_steps_per_3d: 4
  start_3d_epoch: 0

checkpoint:
  enabled: true
  filename: "ball-multitask-{epoch:02d}"
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: val/loss
  mode: min
  patience: 5
  min_delta: 1.0e-3

lr_monitor:
  enabled: true
  interval: step
