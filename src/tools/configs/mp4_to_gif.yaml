# MP4 to GIF conversion configuration
# Usage: uv run python -m src.tools.mp4_to_gif input=path/to/video.mp4 output=path/to/output.gif

# Required parameters
input: ???  # Path to input MP4 file
output: ???  # Path to output GIF file

# Optional parameters
fps: 10  # Frames per second for output GIF (lower = smaller file)
width: 480  # Output width in pixels (null to preserve original)
height: null  # Output height in pixels (null to preserve aspect ratio)

# Timing options
start_time: 0.0  # Start time in seconds
duration: null  # Duration in seconds (null for full video)

# GIF options
optimize: true  # Optimize GIF for smaller file size
loop: 0  # Loop count (0 = infinite loop)
