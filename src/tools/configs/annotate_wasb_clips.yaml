mode: clip # clip or annotation
video_path: null

output:
  output_dir: data/tennis
  game_name: game_manual
  frame_format: frame_{:04d}.jpg
  label_format: '{:04d}.jpg'
  jpeg_quality: 95
  frame_step: 2
  precise_seek: true
  overwrite: false
  skip_existing: true

clip:
  window_name: WASB Clip Selector
  step_small: 1
  step_large: 10
  skip_multipliers: [1, 5, 10, 20]
  display_scale: 1.0

annotate:
  clip_indices: []
  window_name: WASB Annotator
  circle_radius: 6
  circle_color_bgr: [0, 0, 255]
  text_color_bgr: [255, 255, 255]
  font_scale: 0.6
  line_thickness: 2
