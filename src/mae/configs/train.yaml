# MAE Training Configuration
#
# Train Masked Autoencoder on tennis domain videos.
#
# **Configuration Structure Note**:
# MAE uses a flattened config structure (seed, trainer, training at top-level)
# instead of the nested config.run.* schema used by other tasks.
# This is documented in docs/config_architecture.md as an intentional exception
# for pre-training workflows.
#
# Usage:
#   uv run python -m src.mae.scripts.train
#   uv run python -m src.mae.scripts.train model.hidden_dim=512
#   uv run python -m src.mae.scripts.train data=cached_batches data.bucket_alpha=2.5

defaults:
  - _self_
  - model: base
  - data: cached_batches
  - training: default
  - optional override trainer: default

# Random seed
seed: 42

# Checkpoint configuration
checkpoint:
  dirpath: checkpoints
  filename: "mae-{epoch:03d}-{val/loss:.4f}"
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true

# Early stopping (disabled by default)
early_stopping:
  enabled: false
  monitor: val/loss
  patience: 50
  mode: min

# Logger configuration
logger:
  save_dir: logs
  name: mae
  version: null

# Trainer configuration
trainer:
  accelerator: auto
  devices: auto
  strategy: auto
  precision: 16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 50
  val_check_interval: 1.0
  enable_progress_bar: true
  deterministic: false
