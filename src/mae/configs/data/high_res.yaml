# High Resolution Data Configuration
#
# Higher resolution for better feature learning.

# Video source
video_dir: data/tennis/raw/videos

# Resolution range (higher resolution)
min_resolution: 256
max_resolution: 448

# Frame sampling
frames_per_video: 100
patch_size: 16

# Data loading (smaller batch for higher resolution)
batch_size: 16
num_workers: 4
val_split: 0.1
pin_memory: true

# Video reading backend
use_decord: true
