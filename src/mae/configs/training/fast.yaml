# Fast Training Configuration for MAE
#
# Shorter training for quick experiments.

# Learning rate
learning_rate: 3.0e-4  # Higher LR for faster convergence
weight_decay: 0.05
min_lr: 1.0e-6

# Schedule (shorter)
warmup_epochs: 10
max_epochs: 100

# Trainer settings
precision: 16-mixed
gradient_clip_val: 1.0
accumulate_grad_batches: 1
log_every_n_steps: 50
val_check_interval: 1.0
enable_progress_bar: true
deterministic: false
strategy: auto

# ---- Callbacks（BaseTrainingRunnerが参照）----
checkpoint:
  enabled: true
  filename: "mae-{epoch:03d}-{val/loss:.4f}"
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: false
  monitor: val/loss
  mode: min
  patience: 50
  min_delta: null

lr_monitor:
  enabled: true
  interval: step

# Logging
log_reconstruction_every_n_epochs: 5
