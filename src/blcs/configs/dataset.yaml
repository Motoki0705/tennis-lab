# BLCS Dataset Generation Configuration
# Usage: python -m blcs.scripts.generate_dataset --config blcs/configs/dataset.yaml

# Physics simulation parameters (blcs.md §2)
physics:
  gravity: 9.81          # m/s^2
  k_drag: 0.01           # Air drag coefficient
  k_magnus: 0.001        # Magnus effect coefficient
  e_z: 0.75              # Bounce restitution (vertical)
  mu: 0.1                # Bounce friction (horizontal)
  alpha_net: 0.3         # Net collision velocity reduction
  dt: 0.00416667         # Simulation timestep (1/240 s)
  use_drag: true
  use_magnus: true

# Shot generation parameters (blcs.md §4)
shot:
  # Initial position height range
  z_range: [0.8, 1.4]

  # Initial speed range (m/s)
  speed_range: [15.0, 35.0]

  # Azimuth angle range (degrees, 0 = straight ahead)
  azimuth_range_deg: [-30.0, 30.0]

  # Elevation angle range (degrees, positive = upward)
  elevation_range_deg: [5.0, 25.0]

  # Spin ranges (rad/s) - default is topspin
  spin_x_range: [-20.0, 20.0]
  spin_y_range: [-80.0, -40.0]  # Topspin (negative y-spin)
  spin_z_range: [-20.0, 20.0]

  # Simulation limits
  max_sim_frames: 2000   # Max frames at sim_fps (~8 seconds)
  output_fps: 30         # Output frame rate
  sim_fps: 240           # Internal simulation rate

# Camera parameters (blcs.md §7)
camera:
  z_min: 3.0             # Min camera height
  z_max: 5.0             # Max camera height
  hfov_deg: 60.0         # Horizontal field of view
  image_size: [1280, 720]

# Sampling distribution parameters
sampling:
  # Category ratios (must sum to 1.0)
  category_ratios:
    direct_net: 0.05      # Direct net hits (5%)
    direct_fence: 0.05    # Direct fence hits (5%)
    in_court: 0.60        # In-court bounces (60%)
    out_court: 0.30       # Out-of-court bounces (30%)

  # Cell weights within categories ("uniform" or list of weights)
  in_court_cell_weights: "uniform"   # 9 cells (0-8)
  out_court_cell_weights: "uniform"  # 11 cells (9-19)

  # Target samples per from_cell
  per_from_cell_samples: 100

# Camera filtering parameters (PLCS-unified)
# Cameras are sampled and filtered by ball visibility
num_cameras_sampled: 8         # Number of cameras to try per scene
ball_visibility_threshold: 0.8  # Min ratio of frames where ball is visible (0.0-1.0)

# Generation parameters
max_attempts_per_cell: 10000
device: "cpu"
