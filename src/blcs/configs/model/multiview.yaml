# Multi-view BLCS model configuration
# Uses alternating Sequential/Camera attention architecture (like PLCS)
name: blcs_multiview

hidden_dim: 256
num_layers: 4      # Number of alternating attention layer pairs
num_heads: 8
dropout: 0.1
max_seq_len: 120
max_views: 8
predict_velocity: false
encoder_layers: 2  # Number of MLP layers in BallCourtEncoder

# Input dimensions (per view, per frame)
ball_input_dim: 2
court_kp_dim: 40

# Output dimensions
position_dim: 3
