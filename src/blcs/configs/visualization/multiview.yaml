# BLCS Visualization Configuration (Multi-Camera Mode)
# All visualization is now animation-based
mode: visualize  # visualize | predict

# Scene and frame selection
scene_path: data/blcs/scenes/rally_000000.npz
frame: 0

# Animation view: 2d_camera (camera perspective) or 3d (top-down with height)
animation_view: 3d  # 2d_camera | 3d

# Cameras to use for multi-view prediction
# Can be: "all", comma-separated "0,1,2", or list [0, 1, 2]
cameras: all

# Output settings
fps: null  # null = use scene fps
save: null  # Output path for animation
save_input: null  # Path to save 2D input scene animation (camera view)

# Info mode: print scene details and exit
info: false

# Prediction mode settings
checkpoint: outputs/blcs/multiview/logs/version_0/checkpoints/last.ckpt
output: null  # Path to save prediction outputs (.pt or .json)
