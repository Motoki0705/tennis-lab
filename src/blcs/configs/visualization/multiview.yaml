# Multi-view visualization mode
mode: visualize  # visualize | predict | predict-multiview

# Scene file path
scene_path: data/blcs/scenes/scene_000003.npz

# Frame index for static views
frame: 0

# View type
view: multi          # 3d | 2d | camera | multi | animation

# Cameras to use for multi-view prediction
# Can be: "all", comma-separated "0,1,2", or list [0, 1, 2]
cameras: all

# Animation view type (when view=animation)
animation_view: 3d   # 3d | 2d | camera

# Animation FPS (null = use scene fps)
fps: null

# Output path for saving visualization
save: null

# Path to save 2D input scene animation (camera view)
save_input: null

# Print scene info and exit
info: false

# Checkpoint path for prediction mode
checkpoint: outputs/blcs_multiview/checkpoints/last.ckpt

# Output path for saving prediction results (.pt or .json)
output: null
