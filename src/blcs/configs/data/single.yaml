# Scene data directory (matches dataset generation default)
scene_dir: "data/blcs"
output_mode: single

# DataLoader settings
batch_size: 32
num_workers: 4
cache_max_scenes: 128

# Scene sampler settings: none | scene | mixed | chunked
scene_sampler_mode: chunked
scenes_per_batch: 16
chunk_max_scenes: 64

# Train/Val/Test split
val_split: 0.1
test_split: 0.1

# Sequence settings
min_seq_len: 15   # Minimum 0.5 seconds
max_seq_len: 1024  # Maximum 4 seconds
fps: 30

# Camera selection mode: "random", "all", or camera index
camera_mode: "random"

# Augmentation
augmentation:
  uv_noise_std: 0.0001
  visibility_drop_prob: 0.1
  scale_range: [0.9, 1.1]
