# Review sub-agent configuration
defaults:
  - _self_
  - claude: default
  - gemini: default
  - codex: default
  - copilot: default
  - system_prompt: review
  - execution: default
  - output: default
  - task: default

# Review-specific settings
review:
  # Scope of changes to review
  # Options: all, staged, unstaged, head
  #   - all: All changes (staged + unstaged) vs HEAD
  #   - staged: Only staged changes
  #   - unstaged: Only unstaged changes
  #   - head: Changes between HEAD~1 and HEAD (last commit)
  scope: all

  # Optional focus area for the review
  # e.g., "security", "performance", "code style"
  focus: null

hydra:
  run:
    dir: ${hydra:runtime.cwd}
  output_subdir: null
  job:
    chdir: false
