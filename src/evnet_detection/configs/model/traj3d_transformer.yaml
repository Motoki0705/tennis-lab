name: traj3d_transformer
hidden_dim: 256
num_layers: 6
num_heads: 8
dropout: 0.1
mlp_inter_dim: null
use_moe: false

moe:
  moe_inter_dim: 256
  n_routed_experts: 64
  n_shared_experts: 0
  n_activated_experts: 6
  n_expert_groups: 1
  n_limited_groups: 1
  score_func: softmax
  route_scale: 1.0

rope_theta: 10000.0
yarn: null
causal: false
max_seq_len: 256
num_events: 2  # [shot, bounce]
