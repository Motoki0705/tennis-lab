# MAE Training Configuration
#
# Train Masked Autoencoder on tennis domain videos.
#
# Usage:
#   uv run python -m src.experiments.mae.scripts.train
#   uv run python -m src.experiments.mae.scripts.train model.hidden_dim=512
#   uv run python -m src.experiments.mae.scripts.train data=cached_batches data.bucket_alpha=2.5

defaults:
  - _self_
  - model: base
  - data: cached_batches
  - training: default
  - run: train

# Checkpoint configuration
checkpoint:
  dirpath: checkpoints
  filename: "mae-{epoch:03d}-{val/loss:.4f}"
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true

# Early stopping (disabled by default)
early_stopping:
  enabled: false
  monitor: val/loss
  patience: 50
  mode: min

# Logger configuration
logger:
  save_dir: logs
  name: mae
  version: null

hydra:
  run:
    dir: ${run.output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
