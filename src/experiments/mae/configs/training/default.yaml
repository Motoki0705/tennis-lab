# Default Training Configuration for MAE
#
# Standard MAE training schedule (400 epochs with warmup).

# Learning rate
learning_rate: 1.5e-4  # Base LR, scaled by batch size
weight_decay: 0.05
min_lr: 1.0e-6

# Schedule
warmup_epochs: 40
max_epochs: 400

# Trainer settings
precision: 16-mixed
gradient_clip_val: 1.0
accumulate_grad_batches: 1
log_every_n_steps: 50
val_check_interval: 1.0
enable_progress_bar: true
deterministic: false
strategy: auto

# Logging
log_reconstruction_every_n_epochs: 10
