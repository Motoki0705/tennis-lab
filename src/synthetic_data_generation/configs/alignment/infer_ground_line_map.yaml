# @package _global_
defaults:
  - /roots: runtime
  - _self_

stage: ground_line
artifact_id: b00-ground-line-map-v1
provider_bundle: tennis/3dgs_scenes/b00-default-v1
line_checkpoint: court_detection/line/court-detection-epoch19.ckpt
backbone_repository: dinov3
backbone_checkpoint: dinov3/checkpoints/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
output_dir: tennis/3dgs_alignment/b00-default-v1/ground_line_maps
device: cuda
seed: 20260725
expected_short_side: 256
verify_provider_files: false
holdout_group_ids: [2, 6, 10, 14]

ground_plane:
  seed: ${seed}
  footprint_quantile: 0.01
  footprint_margin: 0.5
  min_camera_height: 0.08
  max_camera_height: 0.30
  histogram_bin_width: 0.005
  candidate_half_width: 0.035
  ransac_threshold: 0.006
  refine_threshold: 0.008
  ransac_iterations: 3000
  ransac_sample_limit: 25000
  refine_iterations: 5
  min_candidate_points: 1000
  min_support_points: 10000
  min_normal_up_cosine: 0.98
  min_positive_camera_fraction: 1.0
  support_bounds_quantile: 0.01

line_projection:
  probability_threshold: 0.5
  proximity_scale: 0.35
  proximity_power: 2.0
  min_ray_plane_cosine: 0.05
  max_ray_distance: 3.0
  bounds_margin: 0.05
  grid_spacing: 0.0025
  min_projected_pixels: 20

hydra:
  run:
    dir: ${tennis_lab_path:output,${roots.output_root},tennis_scene/ground_line_map,${now:%Y-%m-%d_%H-%M-%S}}
  output_subdir: null
  job:
    chdir: false
