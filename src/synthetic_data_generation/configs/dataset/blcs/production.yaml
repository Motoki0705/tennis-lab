timeline:
  frame_selection: all_source_frames
  chunk_size_frames: 256
  require_contiguous_frame_indices: true
  require_exact_frame_inventory: true
  reuse_shards_within_stage_attempt: true
  discard_shards_on_rerun: true

trajectory_source:
  scene_count: 3
  split_scene_counts:
    train: 1
    validation: 1
    test: 1
  multi_object: true
  maximum_physics_attempts_per_object: 64
  timeline:
    num_frames: 1024
    min_tracks: 3
    max_tracks: 10
    max_concurrent: 4
    min_reuse_gap_frames: 4
    start_index_range: [-128, 992]
    min_active_frames: 32
    overlap_probability: 0.3
    min_gap_frames: 8
    max_gap_frames: 256
  device: cpu

generator:
  physics:
    gravity: 9.81
    k_drag: 0.01
    k_magnus: 0.001
    e_z: 0.75
    mu: 0.1
    alpha_net: 0.3
    alpha_net_cord: 0.05
    alpha_fence: 0.3
    net_half_thickness: 0.03
    net_cord_radius: 0.03
    dt: 0.00416667
    use_drag: true
    use_magnus: true
    wind: [0.0, 0.0, 0.0]
    gravity_range: [9.70, 9.90]
    k_drag_range: [0.005, 0.02]
    k_magnus_range: [0.0005, 0.002]
    e_z_range: [0.65, 0.85]
    mu_range: [0.05, 0.2]
    wind_speed_range: [0.0, 3.0]
    wind_direction_range_deg: [0.0, 360.0]

  rally:
    z_range: [0.8, 1.4]
    spin_x_range: [-200.0, 200.0]
    spin_y_range: [-80.0, -40.0]
    spin_z_range: [-200.0, 200.0]
    max_sim_frames: 2000
    output_fps: 30
    sim_fps: 240
    max_rallies: 10
    max_total_frames: 12000
    hit_timing_range: [0.2, 0.8]
    return_z_range: [0.8, 1.4]
    serve_probability: 0.3
    serve_z_range: [2.0, 2.8]
    toss_vz_range: [4.5, 7.0]
    toss_xy_noise_range: [-0.35, 0.35]
    toss_max_frames: 240
    toss_z0_tolerance: 0.03
    volley_probability: 0.05
    normal_return_probability: 0.85
    late_return_probability: 0.10
    out_court_target_probability: 0.10

  camera:
    layout: fixed
    z_min: 3.0
    z_max: 5.0
    hfov_deg: 60.0
    image_size: [1280, 720]
    fixed_look_at: [0.0, 0.0, 0.0]
    fixed_baseline_clear_extra: 0.0
    fixed_position_noise_radius: 1.5
    fixed_look_at_xy_radius: 1.0
    broadcast_setback: 20.0
    broadcast_height: 7.0
    broadcast_hfov_deg: 35.0
    broadcast_look_at_y: 0.0
    broadcast_look_at_height: 0.5
    broadcast_position_noise_radius: 1.0
    broadcast_look_at_xy_radius: 1.0
    broadcast_hfov_jitter_deg: 2.0
    broadcast_setback_range: null
    broadcast_height_range: null
    broadcast_court_width_frac_range: null

  targeted_velocity:
    drive_elevation_range_deg: [5.0, 25.0]
    lob_elevation_range_deg: [35.0, 70.0]
    lob_probability: 0.25
    max_ballistic_apex_height_m: 8.0
    gravity: ${dataset.blcs.generator.physics.gravity}
    net_elevation_step_deg: 2.0
    landing_refine_enabled: true
    landing_refine_max_iters: 14
    landing_refine_tolerance_m: 0.25
    landing_sim_max_frames: 1200
    target_margin_m: 0.35

  court:
    net_post_offset_x: 0.914
    net_post_offset_x_range: [-0.3, 0.914]

assets:
  rendering: gaussian
  mesh:
    # Data-root-relative .glb path. It must remain null unless rendering=mesh.
    path: null
    maximum_file_bytes: 33554432
    maximum_source_vertices: 500000
    maximum_source_faces: 1000000
    maximum_faces: 4096
  ball:
    schema: tennis_gaussian_asset_semantic_v1
    asset_id: regulation-tennis-ball
    asset_class: ball
    role: movable
    coordinates:
      frame: asset_local
      unit: metre
      convention: right_handed_asset_local_metres
    gaussian_count: 256
    feature_dim: 3
    floating_dtype: float32
    appearance_model: rgb
    appearance_space: linear_rgb
    tensor_encoding: raw_gaussian_parameters_v1
  settings:
    radius_m: 0.0335
    radial_scale_m: 0.0018
    tangential_scale_m: 0.0048
    opacity: 0.94
    base_color_linear_rgb: [0.72, 0.92, 0.08]
    seam_color_linear_rgb: [0.92, 0.95, 0.80]
    seam_width_radians: 0.08
    visibility_threshold: 0.0001

render_timeout_seconds: ${nht.render_timeout_seconds}

performance:
  maximum_wall_seconds: 3600.0
  maximum_published_bytes: 37580963840
  maximum_published_fraction_of_dense_reference: 0.2
  maximum_nht_invocations: 3
  maximum_background_cache_misses: 18
  maximum_complete_array_scans_per_sample: 1
  # Composed NHT keeps the scene resident and rasterizes one complete frame at a time.
  maximum_batch_frames: 1
  execution_device: cuda:0
  require_cuda: true

metadata_fields:
  - source_trajectory
  - source_frame
  - target_court
  - candidate_id
  - transform
  - camera_profile
  - camera_parameters
  - seed
