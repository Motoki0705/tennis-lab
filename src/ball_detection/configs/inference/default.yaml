# Switch between single-model inference and ensemble inference.
# strategy: single | ensemble
strategy: ensemble

# run.device has higher priority than this field.
device: auto

# Video inference batch/window options
batch_size: 16
max_frames: null
window_size: null
image_h: 288
image_w: 512

# Final visibility decision threshold (used for fused outputs).
visibility_threshold: 0.5

single:
  backend: ball_detection
  checkpoint: outputs/ball_detection/tracknetv3_wbce_full_e30/logs/version_0/checkpoints/last.ckpt
  weight: 1.0
  score_threshold: 0.5

ensemble:
  members:
    - backend: ball_detection
      checkpoint: outputs/ball_detection/tracknetv3_wbce_full_e30/logs/version_0/checkpoints/last.ckpt
      weight: 0.5
      score_threshold: 0.5
    - backend: wasb
      checkpoint: checkpoints/wasb/wasb_tennis_best.pth.tar
      weight: 0.5
      score_threshold: 0.5
