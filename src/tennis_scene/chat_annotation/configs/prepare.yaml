defaults:
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

paths:
  project_root: .
  data_root: data
  checkpoint_root: ckpt
  artifact_root: outputs
  output_root: outputs
  cache_root: .cache
  external_asset_root: third_party

source:
  url: null
  local_video: null # Optional offline input relative to paths.data_root; mutually exclusive with URL.
  # Annotation output is 8-bit H.264; select the best SDR stream up to 1080p without limiting FPS.
  format_selector: bv[dynamic_range=SDR][height<=1080]/b[dynamic_range=SDR][height<=1080]
  js_runtimes: null
  remote_components: null
output_directory: chat_annotation
clip:
  duration_seconds: 15
  context_seconds: 1
  max_bytes: 500000000
encoding:
  crf: 18
  preset: medium
annotation:
  static_tolerance_px_at_1080p: 3
  homography_max_error_px_at_1080p: 3
  ball_max_gap_seconds: 0.1
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
