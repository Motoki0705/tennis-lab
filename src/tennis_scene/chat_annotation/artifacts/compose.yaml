services:
  artifact-mcp:
    build:
      context: ../../../..
      dockerfile: src/tennis_scene/chat_annotation/artifacts/Dockerfile
    restart: unless-stopped
    user: "${ARTIFACT_UID:-1000}:${ARTIFACT_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "${CHAT_ANNOTATION_ROOT:?Set the absolute chat_annotation output directory}/annotated/raw:/artifacts"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
