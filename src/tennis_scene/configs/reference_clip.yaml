  short_side: 800
  max_long_side: 1333
  batch_size: 8
plcs_checkpoint: plcs/plcs-axial-reference-corners-v3-4-t128-seed42-epoch47.ckpt
blcs_checkpoint: blcs/blcs-axial-reference-kp14-corners-v3-4-t128-seed42-best.ckpt
