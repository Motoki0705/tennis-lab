defaults:
  - build_slcs_dataset_base
  - _self_
dataset_directory: tennis_multivew/processed/tennis_clip_source/curated_ball_v1
dataset_output_directory: slcs/broadcast_rgb_v4
output_dir: ${tennis_output:tennis_scene,generate,broadcast_rgb_v4,s42-001}
observation_directory: ${tennis_output:tennis_scene,precompute,broadcast_dino_vitpose,s42-002}
excluded_clips:
  broadcast_hamburg/clip_000: Far-player supported label fraction 0.253 is below the fixed 0.5 acceptance threshold.
  broadcast_hamburg/clip_007: Far-player supported label fraction 0.492 is below the fixed 0.5 acceptance threshold.
  broadcast_monte_carlo/clip_003: Near player is outside the image and a foreground spectator is selected; rejected by label-coverage QC and RGB review.
  broadcast_outdoor_hard/clip_008: Camera moves within the clip (sampled court points drift up to 19.4px at width 640); static calibration is unsupported.
ball_source: saved_scene
coordinate_mode: physical
court_calibration_clips: null
reference_camera: null
view_half_turns: null
sample_stride: 1
plcs_checkpoint: plcs/real-rgb-broadcast-e60-v1-epoch52.ckpt
blcs_checkpoint: blcs/real-rgb-broadcast-e60-v1-epoch53.ckpt
people:
  court_half_width_m: 5.8
  court_half_length_m: 18.0
  min_sample_coverage: 0.6
  max_gap_seconds: 1.8
  long_gap_policy: error
court:
  ball_crop_margins: {cam0: null, cam1: null, cam2: null}
