defaults:
  # Shared compatibility default; opt in with court_coordinate_normalization=v2.
  - court_coordinate_normalization: v1
  - paths: default
  - _self_
dataset_directory: tennis_scene/dataset
clip_ids: null
overwrite: false
continue_on_error: true
pipeline_overrides:
  - court_kp.mode=model
  - court_kp.save_result=false
  - gvhmr.save_result=false
  - player_association.save_result=false
  - ball_detection.save_result=false
  - plcs.save_result=false
  - blcs.save_result=false
hydra:
  searchpath:
    - pkg://src.tasks.base.configs
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},tennis_scene/generate_dataset,${now:%Y-%m-%d_%H-%M-%S}}
  output_subdir: null
  job:
    chdir: false
