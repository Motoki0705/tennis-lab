defaults:
  # Shared compatibility default; opt in with court_coordinate_normalization=v2.
  - court_coordinate_normalization: v1
  - paths: default
  - _self_

video_paths: [samples/tennis_clip.mp4]
camera_ids: [cam0]
output_name: tennis_clip_norm_${court_coordinate_normalization.version}
device: cuda

court_kp:
  enabled: true
  source: execute
  checkpoint: court_detection/kp/run-i621-court-kp512-resume-r4-epoch21.ckpt
  frame_index: 0
  mode: model
  num_keypoints: 14
  subpixel_refine: true
  postprocess:
    enabled: true
    min_score: 0.3
    ransac_reproj_threshold: 30.0
    temporal_median_window: 9
  save_result: true
  output_path: tennis_scene/court_kp_result.json
  load_path: null

gvhmr:
  enabled: true
  source: execute
  gvhmr_checkpoint: gvhmr/gvhmr_siga24_release.ckpt
  detector: dino
  yolo_checkpoint: yolo/yolov8x.pt
  dino_checkpoint: dino/checkpoint0029_4scale_swin.pth
  dino_repository: DINO
  vitpose_checkpoint: vitpose/vitpose-h-multi-coco.pth
  hmr2_checkpoint: hmr2/epoch=10-step=25000.ckpt
  body_models_dir: body_models
  bundled_assets:
    hmr2_mean_params: src/submodules/vendor/gvhmr/hmr2/smpl_mean_params.npz
    smplx_to_smpl: src/submodules/vendor/gvhmr/body_model/data/smplx2smpl_sparse.pt
    smpl_coco17_regressor: src/submodules/vendor/gvhmr/body_model/data/smpl_coco17_J_regressor.pt
    smplx_verts437: src/submodules/vendor/gvhmr/body_model/data/smplx_verts437.pt
    smpl_neutral_joint_regressor: src/submodules/vendor/gvhmr/body_model/data/smpl_neutral_J_regressor.pt
  runtime:
    device: ${device}
    tracking:
      yolo_confidence: 0.5
      bbox_enlarge: 1.2
    dino_detector:
      confidence: 0.3
      short_side: 800
      max_long_side: 1333
    vitpose:
      flip_test: true
      batch_size: 16
      head:
        in_channels: 1280
        out_channels: 17
        num_deconv_layers: 2
        num_deconv_filters: [256, 256]
        num_deconv_kernels: [4, 4]
        final_conv_kernel: 1
        num_conv_layers: 0
        num_conv_kernels: []
    hmr2:
      batch_size: 16
    static_cam: true
  track_selection: auto
  num_tracks: 2
  save_result: true
  output_path: tennis_scene/gvhmr_result.json
  load_path: null

player_association:
  source: execute
  mode: manual_ui
  frame_index: 0
  reference_camera: cam0
  save_result: true
  output_path: tennis_scene/player_association_result.json
  load_path: null

ball_detection:
  enabled: true
  source: execute
  checkpoint: ball_detection/run-i618-convnext-v2-ft-epoch13.ckpt
  batch_size: 4
  image_size: [288, 512]
  normalize_imagenet: true
  score_threshold: 0.5
  subpixel_refine: true
  checkpoint_strict: true
  checkpoint_weights_only: false
  prefetch_batches: 2
  window_stride: 4
  tail_policy: backfill
  overlap_aggregation: max_score
  pin_memory: true
  trajectory_gate:
    enabled: true
    max_residual_px: 60
    k_support: 2
    max_support_gap: 5
    max_passes: 2
  save_result: true
  output_path: tennis_scene/ball_detection_result.json
  load_path: null

plcs:
  enabled: true
  source: execute
  checkpoint: plcs/run-multiview-plcs-i590-courtkp14-epoch197.ckpt
  save_result: true
  output_path: tennis_scene/plcs_result_norm_${court_coordinate_normalization.version}.json
  load_path: null
  window_size: 1024
  window_overlap: 64
  human_vis_threshold: 0.15

blcs:
  enabled: true
  source: execute
  checkpoint: blcs/run-multiview-blcs-v3-simfix-c3-6-epoch129.ckpt
  save_result: true
  output_path: tennis_scene/blcs_result_norm_${court_coordinate_normalization.version}.json
  load_path: null
  window_size: 1024
  window_overlap: 64

max_frames: null

hydra:
  searchpath:
    - pkg://src.tasks.base.configs
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},tennis_scene/hydra,${now:%Y-%m-%d_%H-%M-%S}}
  output_subdir: null
  job:
    chdir: false
