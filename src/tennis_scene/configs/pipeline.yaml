defaults:
  - _self_

video_path: data/samples/clip.mp4

output_dir: outputs/tennis_scene
output_name: null

device: cuda

court_kp:
  checkpoint: outputs/court_detection/checkpoints/last.ckpt
  frame_index: 0
  mode: manual_ui  # model/manual_ui
  save_result: true
  output_path: ${output_dir}/court_kp_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

gvhmr:
  checkpoint: third_party/GVHMR/inputs/checkpoints/gvhmr/gvhmr_siga24_release.ckpt
  yolo_checkpoint: third_party/GVHMR/inputs/checkpoints/yolo/yolov8x.pt
  vitpose_checkpoint: third_party/GVHMR/inputs/checkpoints/vitpose/vitpose-h-multi-coco.pth
  hmr2_checkpoint: third_party/GVHMR/inputs/checkpoints/hmr2/epoch=10-step=25000.ckpt
  skip: false
  # GVHMR runs as CLI subprocess in separate venv
  python_executable: third_party/GVHMR/.venv/bin/python
  output_path: ${output_dir}/gvhmr_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

wasb:
  checkpoint: third_party/WASB-SBDT/pretrained/wasb_tennis_best.pth.tar
  batch_size: 64
  skip: false
  save_result: true
  output_path: ${output_dir}/wasb_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

trajectory:
  checkpoint: checkpoints/trajectory_completion/uv/last.ckpt
  skip: true
  merge_observed: false
  in_frame_threshold: 0.5
  cut_out_of_frame: true
  use_in_frame_pred_for_visibility: true
  save_result: true
  output_path: ${output_dir}/trajectory_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

event_uv:
  checkpoint: checkpoints/event_detection/uv/last.ckpt
  skip: true
  threshold: 0.5
  min_distance: 1
  top_k: null
  save_result: true
  output_path: ${output_dir}/event_uv_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

plcs:
  checkpoint: checkpoints/plcs/frame/last.ckpt
  save_result: true
  output_path: ${output_dir}/plcs_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

blcs:
  checkpoint: checkpoints/blcs/single/last.ckpt
  skip: false
  save_result: true
  output_path: ${output_dir}/blcs_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

event_3d:
  checkpoint: checkpoints/event_detection/traj3d/last.ckpt
  skip: true
  threshold: 0.5
  min_distance: 1
  top_k: null
  save_result: true
  output_path: ${output_dir}/event_3d_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

max_frames: null

hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
