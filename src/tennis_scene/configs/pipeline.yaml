defaults:
  - _self_

video_paths:
  - data/samples/test.mp4
camera_ids: null

output_dir: outputs/tennis_scene/test
output_name: null

device: cuda

court_kp:
  checkpoint: outputs/court_detection/checkpoints/last.ckpt
  annotation_frame_index: 0  # Frame shown in manual_ui mode, then repeated across T
  mode: manual_ui  # model/manual_ui
  num_keypoints: 14
  save_result: true
  output_path: ${output_dir}/court_kp_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

gvhmr:
  checkpoint: third_party/GVHMR/inputs/checkpoints/gvhmr/gvhmr_siga24_release.ckpt
  yolo_checkpoint: third_party/GVHMR/inputs/checkpoints/yolo/yolov8x.pt
  vitpose_checkpoint: third_party/GVHMR/inputs/checkpoints/vitpose/vitpose-h-multi-coco.pth
  hmr2_checkpoint: third_party/GVHMR/inputs/checkpoints/hmr2/epoch=10-step=25000.ckpt
  smplx_model_type: supermotion
  smplx2smpl_path: third_party/GVHMR/hmr4d/utils/body_model/smplx2smpl_sparse.pt
  smplx_body_model_path: null  # Optional override for SMPL/SMPL-X body model directory
  skip: false
  # GVHMR runs as CLI subprocess in separate venv
  python_executable: third_party/GVHMR/.venv/bin/python
  output_path: ${output_dir}/gvhmr_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

player_association:
  mode: manual_ui
  initial_frame_index: 0
  reference_camera: cam0
  save_result: true
  output_path: ${output_dir}/player_association_result.json
  load_path: null  # Path to load pre-computed result (skips manual UI)

ball_detection:
  checkpoint: outputs/ball_detection/stunet/logs/version_2/checkpoints/ball-detection-epoch=18.ckpt
  batch_size: 4
  image_size: [288, 512]
  normalize_imagenet: true
  score_threshold: 0.5
  prefetch_batches: 2
  window_stride: null  # null means model.num_frames
  tail_policy: backfill  # backfill/drop
  overlap_aggregation: last_window_wins  # last_window_wins/max_score
  pin_memory: true
  skip: false
  save_result: true
  output_path: ${output_dir}/ball_detection_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

plcs:
  checkpoint: checkpoints/plcs/frame/last.ckpt
  save_result: true
  output_path: ${output_dir}/plcs_result.json
  load_path: null  # Path to load pre-computed result (skips inference)
  # Example: load_path: outputs/tennis_scene/plcs_result.json

blcs:
  checkpoint: checkpoints/blcs/single/last.ckpt
  skip: false
  save_result: true
  output_path: ${output_dir}/blcs_result.json
  load_path: null  # Path to load pre-computed result (skips inference)
  # Example: load_path: outputs/tennis_scene/blcs_result.json

max_frames: null

hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
