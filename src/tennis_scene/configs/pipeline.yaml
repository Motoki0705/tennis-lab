defaults:
  - _self_

video_paths:
  - data/samples/test.mp4
camera_ids: null

output_dir: outputs/tennis_scene/test
output_name: null

device: cuda

court_kp:
  checkpoint: ckpt/court_detection/last.ckpt
  frame_index: 0  # Frame shown in manual_ui mode, then repeated across T
  mode: manual_ui  # model/manual_ui
  num_keypoints: 14
  save_result: true
  output_path: ${output_dir}/court_kp_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

gvhmr:
  gvhmr_checkpoint: ckpt/gvhmr/gvhmr_siga24_release.ckpt
  yolo_checkpoint: ckpt/yolo/yolov8x.pt
  vitpose_checkpoint: ckpt/vitpose/vitpose-h-multi-coco.pth
  hmr2_checkpoint: ckpt/hmr2/epoch=10-step=25000.ckpt
  smplx_body_model_path: null  # Optional override for the SMPL-X body model directory (default: ckpt/body_models)
  track_selection: auto  # interactive (UI) / auto (largest num_tracks)
  num_tracks: 2
  skip: false
  # GVHMR runs as a CLI subprocess in the same venv (isolates GPU memory per camera)
  python_executable: .venv/bin/python
  output_path: ${output_dir}/gvhmr_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

player_association:
  mode: manual_ui
  frame_index: 0
  reference_camera: cam0
  save_result: true
  output_path: ${output_dir}/player_association_result.json
  load_path: null  # Path to load pre-computed result (skips manual UI)

ball_detection:
  checkpoint: ckpt/ball_detection/last.ckpt
  batch_size: 4
  image_size: [288, 512]
  normalize_imagenet: true
  score_threshold: 0.5
  prefetch_batches: 2
  window_stride: null  # null means model.num_frames
  tail_policy: backfill  # backfill/drop
  overlap_aggregation: last_window_wins  # last_window_wins/max_score
  pin_memory: true
  skip: false
  save_result: true
  output_path: ${output_dir}/ball_detection_result.json
  load_path: null  # Path to load pre-computed result (skips inference)

plcs:
  checkpoint: ckpt/plcs/last.ckpt
  save_result: true
  output_path: ${output_dir}/plcs_result.json
  load_path: null  # Path to load pre-computed result (skips inference)
  # Example: load_path: outputs/tennis_scene/plcs_result.json
  window_size: 256  # max frames per model call (stay inside trained seq_len_range)
  window_overlap: 64
  # Binarize pose-detector confidence. Swept on tennis_clip (far-player XY
  # speed p99 / frames>10m/s): 0.35 -> 53.7 / 69, 0.25 -> 30.5 / 38,
  # 0.15 -> 16.0 / 20. Low-confidence ViTPose joints on the tiny far player
  # are still roughly correct, so keep all but true garbage.
  human_vis_threshold: 0.15

blcs:
  checkpoint: ckpt/blcs/last.ckpt
  skip: false
  save_result: true
  output_path: ${output_dir}/blcs_result.json
  load_path: null  # Path to load pre-computed result (skips inference)
  # Example: load_path: outputs/tennis_scene/blcs_result.json
  window_size: 256  # max frames per model call (stay inside trained seq_len_range)
  window_overlap: 64

max_frames: null

hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
