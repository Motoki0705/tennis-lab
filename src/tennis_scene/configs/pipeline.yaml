defaults:
  - paths: default
  - _self_

# Replace these synchronized example paths and declare each camera orientation below.
# The default BLCS model requires 3 or 4 cameras.
video_paths: [samples/cam0.mp4, samples/cam1.mp4, samples/cam2.mp4]
camera_ids: [cam0, cam1, cam2]
output_name: tennis_clip
device: cuda

court_keypoints:
  selector: camera_view_v2

court_reference:
  reference_camera: cam0
  # Required: one bool per camera_ids entry; reference_camera must be false.
  # Set true for a view facing the opposite baseline from the reference camera.
  view_half_turns: null

court_kp:
  enabled: true
  source: execute
  checkpoint: court_detection/hybrid/court-detection-epoch=17.ckpt
  frame_index: 0
  mode: model
  num_keypoints: 14
  subpixel_refine: true
  postprocess:
    min_score: 0.05
    threshold_diagonal_ratio: 0.005
    line_probability_threshold: 0.5
    max_kp: 8
    max_candidates: 1001
    refine_candidates: 6
    samples_per_line: 40
    max_line_observations: 768
    max_selection_rounds: 4
    max_nfev: 70
    kp_weight: 0.25
    min_line_support: 0.55
    ambiguity_gap: 0.02
    ambiguity_displacement_ratio: 0.03
  save_result: true
  output_path: tennis_scene/court_kp_result.json
  load_path: null

gvhmr:
  enabled: true
  source: execute
  gvhmr_checkpoint: GVHMR/inputs/checkpoints/gvhmr/gvhmr_siga24_release.ckpt
  detector: dino
  yolo_checkpoint: GVHMR/inputs/checkpoints/yolo/yolov8x.pt
  dino_checkpoint: dino/checkpoint0029_4scale_swin.pth
  dino_repository: DINO
  vitpose_checkpoint: GVHMR/inputs/checkpoints/vitpose/vitpose-h-multi-coco.pth
  hmr2_checkpoint: GVHMR/inputs/checkpoints/hmr2/epoch=10-step=25000.ckpt
  body_models_dir: GVHMR/inputs/checkpoints/body_models
  bundled_assets:
    hmr2_mean_params: src/submodules/vendor/gvhmr/hmr2/smpl_mean_params.npz
    smplx_to_smpl: src/submodules/vendor/gvhmr/body_model/data/smplx2smpl_sparse.pt
    smpl_coco17_regressor: src/submodules/vendor/gvhmr/body_model/data/smpl_coco17_J_regressor.pt
    smplx_verts437: src/submodules/vendor/gvhmr/body_model/data/smplx_verts437.pt
    smpl_neutral_joint_regressor: src/submodules/vendor/gvhmr/body_model/data/smpl_neutral_J_regressor.pt
  runtime:
    device: ${device}
    tracking:
      yolo_confidence: 0.5
      bbox_enlarge: 1.2
    dino_detector:
      confidence: 0.3
      short_side: 800
      max_long_side: 1333
    vitpose:
      flip_test: true
      batch_size: 16
      head:
        in_channels: 1280
        out_channels: 17
        num_deconv_layers: 2
        num_deconv_filters: [256, 256]
        num_deconv_kernels: [4, 4]
        final_conv_kernel: 1
        num_conv_layers: 0
        num_conv_kernels: []
    hmr2:
      batch_size: 16
    static_cam: true
  track_selection: auto
  num_tracks: 2
  court_footpoint_filter:
    enabled: false
    sideline_margin_m: 1.0
    baseline_margin_m: 5.0
  save_result: true
  output_path: tennis_scene/gvhmr_result.json
  load_path: null

player_association:
  source: execute
  mode: manual_ui
  frame_index: 0
  reference_camera: cam0
  save_result: true
  output_path: tennis_scene/player_association_result.json
  load_path: null

player_motion:
  scale_mode: fixed
  alignment:
    sigma_position_m: 0.5
    sigma_heading_deg: 30.0
    heading_weight: 1.0
    scale_prior: 1.0
    min_scale: 0.5
    max_scale: 2.0
    huber_delta: 1.0
    heading_resultant_threshold: 0.5
    max_nfev: 500

ball_detection:
  enabled: true
  source: execute
  checkpoint: ball_detection/run-i618-convnext-v2-ft-epoch13.ckpt
  batch_size: 4
  image_size: [288, 512]
  normalize_imagenet: true
  score_threshold: 0.5
  subpixel_refine: true
  checkpoint_strict: true
  checkpoint_weights_only: false
  prefetch_batches: 2
  window_stride: 4
  tail_policy: backfill
  overlap_aggregation: max_score
  pin_memory: true
  trajectory_gate:
    enabled: true
    max_residual_px: 60
    k_support: 2
    max_support_gap: 5
    max_passes: 2
  save_result: true
  output_path: tennis_scene/ball_detection_result.json
  load_path: null

plcs:
  enabled: true
  source: execute
  checkpoint: plcs/real-rgb-meiji-foot-e60-v1.ckpt
  save_result: true
  output_path: tennis_scene/plcs_result.json
  load_path: null
  window_size: 128
  window_overlap: 64
  sample_stride: 1
  human_vis_threshold: 0.15

blcs:
  enabled: true
  source: execute
  checkpoint: blcs/real-rgb-meiji-e60-v1.ckpt
  save_result: true
  output_path: tennis_scene/blcs_result.json
  load_path: null
  window_size: 128
  window_overlap: 64
  sample_stride: 1

max_frames: null

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},tennis_scene/hydra,${now:%Y-%m-%d_%H-%M-%S}}
  output_subdir: null
  job:
    chdir: false
