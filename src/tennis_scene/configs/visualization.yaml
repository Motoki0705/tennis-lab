defaults:
  - _self_

# Input scene result file (required)
input: outputs/tennis_scene/clip.npz

# Output video path (optional, if null only displays or saves preview)
output: null

# Display animation in matplotlib window
display: true

# Frame range
start_frame: 0
end_frame: null  # null for all frames

# FPS (null to use scene's original FPS)
fps: null

# Video output settings
dpi: 100
writer: ffmpeg

# Rendering style
style:
  trail_length: 30
  show_direction: true
  show_trail: true
  figsize: [12, 8]
  # "smpl" or "skeleton"
  player_representation: skeleton
  mesh_alpha: 0.6
  # "fixed" keeps the court-space camera stable across frames.
  # "player_centered" preserves the old player-following zoomed view.
  view_mode: fixed
  fixed_view_margin: 2.0
  player_centered_half_span: [8.0, 10.0]

hydra:
  run:
    dir: outputs/visualization/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
