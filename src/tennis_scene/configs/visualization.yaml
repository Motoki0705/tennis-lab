defaults:
  - paths: default
  - _self_
assets:
  smpl_faces: smplh/neutral/model.npz
  smpl_joint_regressor: GVHMR/hmr4d/utils/body_model/smpl_neutral_J_regressor.pt
input: tennis_scene/tennis_clip.npz
output: tennis_scene/tennis_clip.gif
preview_output: tennis_scene/preview.png
display: false
start_frame: 0
end_frame: null
fps: null
dpi: 100
writer: ffmpeg
style:
  trail_length: 30
  show_trail: true
  figsize: [12, 8]
  player_representation: skeleton
  mesh_alpha: 0.6
  theme: dark
  show_ball_shadow: true
  show_player_shadow: true
  show_player_trail: true
  player_trail_length: 60
  show_bounces: true
  show_hud: true
  show_minimap: true
camera:
  preset: broadcast
  elev: null
  azim: null
  zoom: null
  mode: static
  orbit_period_s: 24.0
  keyframes: null
hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},visualization/hydra,${now:%Y-%m-%d_%H-%M-%S}}
  output_subdir: null
  job:
    chdir: false
