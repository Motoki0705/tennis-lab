defaults:
  - _self_

# Input scene result file (required)
input: outputs/tennis_scene/baseline/tennis_clip.npz

# Output video path (optional, if null only displays or saves preview)
output: outputs/tennis_scene/baseline/tennis_clip.gif

# Display animation in matplotlib window
display: false

# Frame range
start_frame: 0
end_frame: null  # null for all frames

# FPS (null to use scene's original FPS)
fps: null

# Video output settings
dpi: 100
writer: ffmpeg

# Rendering style
style:
  trail_length: 30
  show_direction: true
  show_trail: true
  figsize: [12, 8]
  # "smpl" or "skeleton"
  player_representation: skeleton
  mesh_alpha: 0.6
  # "light" (matplotlib axes visible) or "dark" (broadcast-style look)
  theme: dark
  show_ball_shadow: true
  show_player_shadow: true
  show_player_trail: true
  player_trail_length: 60
  show_bounces: true
  show_hud: true
  show_minimap: true

# Virtual camera work
camera:
  # Named preset (broadcast/side/top/corner/behind_far), or set elev/azim instead
  preset: broadcast
  # Zoom override (null keeps the preset zoom; >1 zooms in)
  zoom: null
  # "static", "orbit" (slow azimuth revolution), or "keyframes"
  mode: static
  # Seconds per full revolution in orbit mode
  orbit_period_s: 24.0
  # Keyframed camera moves (mode: keyframes), e.g.
  #   keyframes:
  #     - {frame: 0, preset: broadcast}
  #     - {frame: 120, preset: corner}
  keyframes: null

hydra:
  run:
    dir: outputs/visualization/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
