defaults:
  - paths: default
  - _self_
dataset_directory: slcs/meiji_rgb_v9
expected_dataset_directory: tennis_multivew/processed/meiji_3cam/dataset
generation_directories:
  - tennis_scene/generate/meiji_rgb_v9/s42-001
observation_directories:
  - tennis_scene/precompute/meiji_dino_vitpose/s42-005
excluded_clips:
  video_002/clip_001: Explicit exclusion in build_slcs_dataset.yaml (insufficient outsourced multiview ball coverage).
allow_incomplete: false
# Same frame-label policy as SLCS train_real_rgb; window selection is not simulated.
quality:
  min_player_confidence: 0.3
  min_ball_cameras: 1
  label_weight_power: 1.0
  min_window_label_ratio: 0.5
output_dir: ${tennis_output:tennis_scene,analyze,meiji_rgb_v9_quality,${tennis_run_id:}}
hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${output_dir},hydra}
  output_subdir: null
  job:
    chdir: false
