root_dir: data/tennis
train_matches: ["game1", "game2", "game3", "game4", "game5", "game6", "game7"]
val_matches: ["game8", "game9"]
test_matches: ["game10"]
frames_in: 8
frames_out: 1
step: 1
visibility_mode: all_visible
image_ext: ".jpg"
csv_filename: Label.csv
batch_size: 4
num_workers: 4
resize_hw: [288, 512]
heatmap_hw: [288, 512]
heatmap_sigma: 2.0
pin_memory: true
augment:
  enabled: true
  color_jitter:
    prob: 0.8
    brightness: 0.5
    contrast: 0.5
    saturation: 0.5
    hue: 0.05
  random_grayscale:
    prob: 0.3
  gaussian_blur:
    prob: 0.8
    kernel_size: 3
    sigma_min: 0.1
    sigma_max: 1.0
  random_erasing:
    prob: 0.2
    scale: [0.02, 0.05]
    ratio: [0.3, 3.3]
    value: 0
  # Ball position masking for occlusion simulation.
  # Masks the heatmap of selected frames so the model must predict
  # the ball location from temporal context.
  ball_masking:
    enabled: false
    prob: 0.3
    max_masked_ratio: 0.5

# Sampling strategy (curriculum).
# - Warmup: standard shuffle sampling (as before).
# - After `switch_step`: oversample so that vis=1 and vis=2 appear equally often.
sampling:
  curriculum:
    enabled: true
    switch_step: 50000
    balance_visibility: [1, 2]
    target_ratio: [0.5, 0.5]
    replacement: true
    # Optional override for epoch length (defaults to dataset size).
    num_samples_per_epoch: null
