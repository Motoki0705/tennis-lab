defaults:
  - model: dinov3_heatmap

data:
  root_dir: data/tennis
  train_matches: ["game1", "game2", "game3", "game4", "game5", "game6", "game7", "game11", "game12", "game13", "game15", "game16"]
  val_matches: ["game8", "game9", "game14"]
  test_matches: ["game10"]
  frames_in: 1
  frames_out: 1
  step: 1
  visibility_mode: all_visible
  image_ext: ".jpg"
  csv_filename: Label.csv
  batch_size: 4
  num_workers: 4
  resize_hw: [288, 512]
  heatmap_hw: [288, 512]
  heatmap_sigma: 2.0
  pin_memory: true

training:
  max_epochs: 20
  freeze_backbone_epochs: 10
  learning_rate: 1e-4
  backbone_learning_rate: 1e-5
  weight_decay: 1e-4
  warmup_steps: 1000
  min_lr: 1e-6
  bce_weight: 1.0
  mse_weight: 1.0
  precision: "bf16-mixed"
  resume:
    enabled: false
    ckpt_path: null
    auto_last: true

metrics:
  target_rmse_px: 5.0
  target_detection_rate: 0.9
  accuracy_thresh_px: 10.0

logging:
  level: INFO     # DEBUG / INFO / WARNING / ERROR / CRITICAL
  fmt: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
