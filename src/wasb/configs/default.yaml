defaults:
  - model: hrnet_gru

data:
  root_dir: data/tennis
  train_matches: ["game1", "game2", "game3", "game4", "game5", "game6", "game7", "game8"]
  val_matches: ["game9"]
  test_matches: ["game10"]
  frames_in: 6
  frames_out: 6
  step: 1
  visibility_mode: none
  image_ext: ".jpg"
  csv_filename: Label.csv
  batch_size: 8
  num_workers: 4
  resize_hw: [288, 512]
  heatmap_sigma: 2.0
  pin_memory: true

training:
  max_epochs: 50
  freeze_backbone_epochs: 3
  learning_rate: 1e-4
  weight_decay: 1e-4
  warmup_steps: 1000
  min_lr: 1e-6
  heatmap_loss_weight: 1.0
  precision: "bf16-mixed"

metrics:
  target_rmse_px: 5.0
  target_detection_rate: 0.9
  accuracy_thresh_px: 10.0

logging:
  level: INFO     # DEBUG / INFO / WARNING / ERROR / CRITICAL
  fmt: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
