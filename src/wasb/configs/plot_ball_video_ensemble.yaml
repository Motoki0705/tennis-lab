defaults:
  - _self_

# Configuration for `src.wasb.scripts.visualize.ball_video_ensemble`.
video_path: data/samples/clip.mp4
output_path: outputs/plot_ball_video_ensemble/clip.mp4

device: cpu            # cpu | cuda
batch_size: 64
max_frames: null

ensemble:
  # Five-pattern ensemble checkpoints (edit to your trained checkpoints).
  checkpoints:
    - outputs/hrcnet_frames3/logs/version_0/checkpoints/last.ckpt
    - outputs/hrcnet_frames5/logs/version_0/checkpoints/last.ckpt
    - outputs/hrnet_frames3/logs/version_0/checkpoints/last.ckpt
    - outputs/hrnet_frames5/logs/version_0/checkpoints/last.ckpt
    - outputs/dinov3_heatmap_frames1/logs/version_0/checkpoints/last.ckpt
  # If set, resizes each model output heatmap to this size before ensembling.
  output_heatmap_hw: null  # e.g. [288, 512]
  tta:
    enabled: false
    transforms:
      - type: identity
  calibration:
    temperature: 1.0
    bias: 0.0
  fusion:
    weight_mode: fixed     # fixed | entropy | peak
    model_weights: 1.0
    eps: 1.0e-6
  smoothing:
    enabled: true
    kernel:
      type: disk           # disk | gaussian
      radius: 4
    accel_weight: 0.0
    warmup_tau: 5.0
  decode:
    mode: fit              # expected | map | fit
    fit_mode: quadratic    # quadratic | gaussian
    fit_window: 3
    confidence_mode: peak  # peak | entropy
    visibility_threshold: 0.0
    return_heatmap: true

completion:
  enabled: false
  method: bilstm       # physics | bilstm | transformer | refiner | hybrid
  checkpoint_path: outputs/trajectory/trajectory_bilstm/logs/version_0/checkpoints/last.ckpt
  device: ${device}
  max_gap: 15
  physics_gap_threshold: 5

render:
  use_completion: true
  radius: 6
  thickness: -1
  color_detected_bgr: [0, 255, 0]
  color_completed_bgr: [0, 255, 255]

hydra:
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
