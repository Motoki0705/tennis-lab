defaults:
  - model: trajectory_refiner

data:
  root_dir: data/tennis
  train_matches: ["game1", "game2", "game3", "game4", "game5", "game6", "game7", "game8"]
  val_matches: ["game9"]
  test_matches: ["game10"]
  sequence_length: 64
  step: 8
  min_visible_per_window: 4
  image_ext: ".jpg"
  csv_filename: Label.csv
  block_mask_min_len: 0
  block_mask_max_len: 0
  sparse_mask_prob: 0.0
  noise_prob: 0.5
  noise_std_px: 5.0
  batch_size: 32
  num_workers: 4
  pin_memory: true

training:
  max_epochs: 50
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 1000
  min_lr: 1.0e-6
  lambda_block: 0
  lambda_sparse: 0
  lambda_noise: 1.0
  precision: "32"
  resume:
    enabled: false
    ckpt_path: null
    auto_last: true

logging:
  level: INFO
  fmt: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
