name: hrcnet
frames_in: 1
frames_out: 1
inp_height: 288
inp_width: 512

# HRCNet architecture parameters
high_channels: 32
low_channels: 128
num_stages: 3
high_block: BASIC
low_block: BASIC
num_high_blocks: 2
num_low_blocks: 1
upsample_mode: nearest

downsample_kwargs:
  num_downsample: 4

transformer_kwargs:
  d_model: 128
  num_heads: 8
  dim_ff: 512
  dropout: 0.1
  depth: 2
