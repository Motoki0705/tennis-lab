defaults:
  - data: ball_detection
  - _self_

# Which split to sample from: "train", "val", or "test".
split: train

# Dataset index to visualize.
sample_index: 0

# Number of samples to visualize when sampling randomly.
# Ignored when `sample_indices` is provided.
num_samples: 5

# Explicit dataset indices to visualize.
# If provided, overrides `sample_index` and `num_samples`.
sample_indices: null

# Which of the target frames (0..frames_out-1) to visualize.
target_index: 0

# Overlay alpha for the heatmap.
overlay_alpha: 0.5

# RNG seed for deterministic sampling/augmentations where possible.
seed: 42

hydra:
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
