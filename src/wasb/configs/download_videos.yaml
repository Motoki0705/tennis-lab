defaults:
  - download: default
  - _self_

mode: download   # download | status | reset_failed | reset_all | reset_url
urls_path: data/tennis/raw/urls.yaml
reset_url: null
resume: true
verbose: true

hydra:
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  output_subdir: null
  job:
    chdir: false

