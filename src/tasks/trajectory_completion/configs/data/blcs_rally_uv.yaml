defaults:
  - _augmentation
  - _self_

# BLCS rally scene dataset (npz) used for UV trajectory completion training.

scene_dir: data/blcs

# Number of court keypoints to use (first N from canonical order)
num_court_kp: 20
split:
  train_file: train.txt
  val_file: val.txt
  test_file: test.txt

camera_mode: random  # random | int camera index
seq_len_range: [16, 1024]

batch_size: 16
num_workers: 4
pin_memory: true

supervise_visible_only: true
