# Visualization settings for trajectory completion.

mode: predict  # visualize | predict

# Input scene (BLCS scene directory)
scene_path: data/blcs/scenes/scene_000000
camera: random  # random | int

# Rendering
fps: null
save: assets/trajectory_completion/gt_vs_pred.gif

# Output
info: false
checkpoint: checkpoints/trajectory_completion/last.ckpt
merge_observed: true
in_frame_threshold: 0.5
cut_out_of_frame: true
output: null

# Input construction
use_scene_visibility: true
apply_corruption: true
start: 0
max_frames: null

# Metrics / plots
show_court_lines: true
