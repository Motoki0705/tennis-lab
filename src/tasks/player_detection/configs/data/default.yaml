dataset_dir: ${tennis_dataset:player_detection,chat-player-v1}
batch_size: 2
eval_batch_size: 4
num_workers: 6
pin_memory: false
# Consecutive frames are near-duplicates: each epoch draws this many train
# frames without replacement from the whole train pool.
train_samples_per_epoch: 8000
val_frame_stride: 5
test_frame_stride: 1

selection:
  require_reviewed: true
  # Frames with an unresolved (present but unlocated) player are excluded.
  require_located_players: true
  # Truncated amodal boxes are clipped to the image; thinner remnants dropped.
  min_visible_box_px: 4.0

# Deployed DinoPersonDetector resize (pipeline dino_detector short/long side).
input_size:
  short_side: 800
  max_long_side: 1333

augmentation:
  hflip_prob: 0.5
  # 1920x1080 frames hit the 1333 long-side cap from short side 750 upward.
  short_side_choices: [608, 640, 672, 704, 736, 800]
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
