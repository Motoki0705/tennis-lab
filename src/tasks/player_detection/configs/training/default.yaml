trainer:
  max_epochs: 8
  # Official DINO clip_max_norm.
  gradient_clip_val: 0.1
  # Deformable-attention backward uses atomics; not deterministic.
  deterministic: false
  # The DINO deformable-attention kernel implements float32/float64 only.
  precision: 32-true
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 2
  reload_dataloaders_every_n_epochs: 0
  enable_progress_bar: true
  enable_model_summary: true
  # Multi-scale inputs change shapes every batch.
  benchmark: false

learning_rate: 3.0e-5
weight_decay: 1.0e-4
warmup_steps: 300
warmup_epochs: null
min_lr: 3.0e-7
steps_per_epoch: null

optimizer:
  name: adamw
  betas: [0.9, 0.999]

# Disabled for DINO: per-image resolutions and an opaque custom CUDA op.
compile:
  enabled: false
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

matmul_precision: high
allow_tf32: true

checkpoint:
  enabled: true
  filename: "player-dino-{epoch:02d}"
  monitor: val/map
  mode: max
  save_top_k: 1
  save_last: true

early_stopping:
  enabled: true
  monitor: val/map
  mode: max
  patience: 3
  min_delta: 1.0e-4
  check_on_train_epoch_end: false

lr_monitor:
  enabled: true
  interval: step

# Disabled: visual checks use scripts.evaluate overlays on deployable exports.
qualitative_logging:
  enabled: false
  every_n_epochs: 1
  num_samples: 1
  selection_mode: random
  selected_indices: null

gan:
  enabled: false
  target_weight: 0.0
  warmup_epochs: 1
  generator_gradient_clip_val: null
  discriminator_gradient_clip_val: null
  transition:
    start_epoch: 0
