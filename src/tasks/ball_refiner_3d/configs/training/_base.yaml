steps: 4000
batch_size: 32
learning_rate: 0.0003
weight_decay: 0.01
gradient_clip: 1.0
evaluate_every: 500
log_every: 100
cpu_threads: 2
trainer:
  max_epochs: ${refiner_epochs:${training.steps},${training.evaluate_every}}
  gradient_clip_val: null
  deterministic: true
  precision: 32-true
  log_every_n_steps: ${training.log_every}
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  reload_dataloaders_every_n_epochs: 1
  enable_progress_bar: false
  enable_model_summary: true
  benchmark: false
warmup_steps: 0
warmup_epochs: null
min_lr: 1.5e-05
steps_per_epoch: ${training.evaluate_every}
optimizer:
  betas:
  - 0.9
  - 0.999
compile:
  enabled: false
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false
checkpoint:
  enabled: true
  filename: best
  monitor: val/rmse
  mode: min
  save_top_k: 1
  save_last: true
early_stopping:
  enabled: false
  monitor: val/rmse
  mode: min
  patience: 10
  min_delta: 0.0
  check_on_train_epoch_end: false
lr_monitor:
  enabled: true
  interval: step
qualitative_logging:
  enabled: false
  every_n_epochs: 1
  num_samples: 1
  selection_mode: random
  selected_indices: null
matmul_precision: highest
allow_tf32: false
