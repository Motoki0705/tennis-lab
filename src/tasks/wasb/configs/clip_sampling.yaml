defaults:
  - _self_

# Configuration for `src.tasks.wasb.scripts.generate_dataset.clip_sampling`.

# One of:
#   - generate_samples
#   - apply_clip_selection
mode: generate_samples

output_dir: data/tennis
fps: 50

# Clip sampling workflow
generate_samples: []      # e.g. ["game11"] or ["all"]
apply_clip_selection: []  # e.g. ["game11"] or ["all"]

quiet: false

hydra:
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
