<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dataset Scene Review</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="workspace">
      <aside class="browser" aria-label="データセット選択">
        <header class="browser-head">
          <p class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" />
                <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" />
                <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" />
              </svg>
            </span>
            <span id="brand-task">DATASET</span> <b>REVIEW</b>
          </p>
          <p class="brand-sub" id="brand-sub">物理コート座標 / メートル</p>
        </header>
        <div class="search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21 21-4.34-4.34" />
            <circle cx="11" cy="11" r="8" />
          </svg>
          <input
            id="query"
            type="search"
            placeholder="形式・シーンを検索"
            aria-label="形式・シーンを検索"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="clear" class="search-clear" type="button" aria-label="検索を消去" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <p class="result-count" id="result-count" role="status"></p>
        <nav class="tree" id="tree" aria-label="シーン一覧"></nav>
        <footer class="browser-foot" id="data-root"></footer>
      </aside>
      <section class="viewport" aria-label="3Dビュー">
        <header class="viewport-head">
          <div class="title-block">
            <span class="eyebrow" id="scene-dataset">シーンを選択してください</span>
            <h1 id="scene-title">データセットシーン</h1>
          </div>
          <div class="chips" id="chips"></div>
          <div class="controls">
            <div class="segmented" role="group" aria-label="プリセット視点">
              <button type="button" data-preset="overhead" title="俯瞰視点">俯瞰</button>
              <button type="button" data-preset="corner" title="コーナー視点">コーナー</button>
              <button type="button" data-preset="broadcast" title="ブロードキャスト視点">放送</button>
              <button type="button" data-preset="side" title="サイド視点">横</button>
            </div>
            <button id="cameras" class="icon-toggle" type="button" aria-pressed="true" title="カメラのフラスタムを表示">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" />
                <rect x="2" y="6" width="14" height="12" rx="2" />
              </svg>
            </button>
            <button id="follow" class="icon-toggle" type="button" aria-pressed="false" title="対象に追従">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <line x1="22" x2="18" y1="12" y2="12" />
                <line x1="6" x2="2" y1="12" y2="12" />
                <line x1="12" x2="12" y1="6" y2="2" />
                <line x1="12" x2="12" y1="22" y2="18" />
              </svg>
            </button>
            <button id="trail" class="icon-toggle" type="button" aria-pressed="true" title="軌跡を表示">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="6" cy="19" r="3" />
                <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
                <circle cx="18" cy="5" r="3" />
              </svg>
            </button>
            <button id="open-camera" class="icon-button" type="button" title="選択カメラの視点へ" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span id="camera-readout">カメラ</span>
            </button>
            <button id="reset" class="icon-button" type="button" title="視点を戻す">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
            </button>
          </div>
        </header>
        <div class="stage">
          <canvas
            id="view"
            tabindex="0"
            aria-label="3Dコートビュー"
          ></canvas>
          <div class="legend" id="legend" aria-hidden="true"></div>
          <dl class="hud" id="hud" hidden>
            <div><dt>frame</dt><dd id="hud-frame">–</dd></div>
            <div><dt>time</dt><dd id="hud-time">–</dd></div>
            <div><dt>position</dt><dd id="hud-pos">–</dd></div>
            <div><dt>yaw</dt><dd id="hud-yaw">–</dd></div>
          </dl>
          <p class="overlay" id="status" role="status" hidden></p>
          <div class="transport" id="transport" hidden>
            <button id="to-start" class="icon-button" type="button" title="先頭へ">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m11 17-5-5 5-5" />
                <path d="m18 17-5-5 5-5" />
              </svg>
            </button>
            <button id="prev" class="icon-button" type="button" title="1フレーム戻る">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <button id="play" class="icon-button primary" type="button" title="再生">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" fill="currentColor" stroke="none" />
              </svg>
            </button>
            <button id="next" class="icon-button" type="button" title="1フレーム進む">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
            <button id="to-end" class="icon-button" type="button" title="末尾へ">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 17 5-5-5-5" />
                <path d="m13 17 5-5-5-5" />
              </svg>
            </button>
            <input
              id="scrub"
              class="scrub"
              type="range"
              min="0"
              max="0"
              step="1"
              value="0"
              aria-label="再生フレーム"
            />
            <span class="clock" id="clock">0 / 0</span>
            <div class="speeds" role="group" aria-label="再生速度">
              <button type="button" data-speed="0.25">0.25×</button>
              <button type="button" data-speed="0.5">0.5×</button>
              <button type="button" data-speed="1" aria-pressed="true">1×</button>
              <button type="button" data-speed="2">2×</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
