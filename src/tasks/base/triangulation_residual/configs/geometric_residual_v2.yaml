# @package _global_
# All magnitudes are experiment assumptions, not estimates fitted to Meiji.
defaults:
  - geometric_residual
  - _self_

data:
  max_views: 6

corruption:
  camera_rotation_std_deg: 0.0
  camera_center_std_m: 0.0
  camera_focal_log_std: 0.0
  camera_principal_std_px: 0.0
  focal_scale_min: 0.33

v2:
  camera_preset: four_corners_front_pair
  evaluation_views: 3
  true_camera_position_jitter_m: 0.75
  true_camera_height_jitter_m: 0.5
  calibration_min_points: 6
  court_noise_px: 2.0
  court_bias_px: 1.5
  court_dropout_probability: 0.05
  court_outlier_probability: 0.02
  court_outlier_sigma_px: 12.0
  persistent_rate_per_view_second: 0.08
  persistent_min_seconds: 0.12
  persistent_max_seconds: 1.2
  persistent_offset_scale: 1.0
  persistent_high_confidence_probability: 0.25
  error_mode: mixed
  loss_mode: balanced_regret
  regret_weight: 0.2
  regret_tolerance_m: 0.002
  balanced_world_weight: 0.25

training:
  early_stopping:
    patience: 8
