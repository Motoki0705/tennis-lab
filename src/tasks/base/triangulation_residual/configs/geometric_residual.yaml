# @package _global_

model:
  name: ???
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  ffn_dim: 768
  ffn_type: swiglu
  dropout: 0.1
  rope_base: 10000.0

features:
  residual_encoding: raw
  residual_scale: 1.0

data:
  scene_dir: ???
  batch_size: 32
  num_workers: 6
  pin_memory: true
  sequence_length: 64
  target_fps: 30.0
  min_views: 2
  max_views: 4
  train_limit: 0
  val_limit: 0
  test_limit: 0
  cache_scenes: 128

initializer:
  min_score: 0.3
  refinement_steps: 5

corruption:
  observation_sigma_px: 2.0
  temporal_sigma_px: 1.0
  view_bias_px: 1.5
  confidence_noise: 0.12
  outlier_probability: 0.025
  outlier_sigma_px: 20.0
  dropout_probability: 0.08
  burst_probability: 0.3
  burst_max_frames: 16
  time_shift_probability: 0.2
  time_shift_max_frames: 2
  camera_rotation_std_deg: 0.5
  camera_center_std_m: 0.12
  camera_focal_log_std: 0.025
  camera_principal_std_px: 2.0
  radial_std: 0.025
  focal_scale_min: 0.4
  focal_scale_max: 1.3
  clean_probability: 0.15
  hard_probability: 0.2

loss:
  root_weight: 1.0
  relative_weight: 1.0
  world_weight: 0.5
  reprojection_weight: 10.0
  velocity_weight: 0.02
  bone_weight: 0.1
  huber_delta_m: 0.1

training:
  trainer:
    max_epochs: 30
    gradient_clip_val: 1.0
    deterministic: true
    precision: bf16-mixed
    log_every_n_steps: 50
    check_val_every_n_epoch: 1
    accumulate_grad_batches: 1
    reload_dataloaders_every_n_epochs: 0
    enable_progress_bar: true
    enable_model_summary: true
    benchmark: false
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_steps: null
  warmup_epochs: 1
  min_lr: 1.0e-6
  steps_per_epoch: null
  optimizer:
    betas: [0.9, 0.999]
  compile:
    enabled: false
    backend: inductor
    mode: default
    fullgraph: false
    dynamic: false
  checkpoint:
    enabled: true
    filename: "${task}-residual-{epoch:02d}"
    monitor: val/world_mpjpe_m
    mode: min
    save_top_k: 1
    save_last: true
  early_stopping:
    enabled: true
    monitor: val/world_mpjpe_m
    mode: min
    patience: 6
    min_delta: 0.0001
    check_on_train_epoch_end: false
  lr_monitor:
    enabled: true
    interval: step
  qualitative_logging:
    enabled: false
    every_n_epochs: 1
    num_samples: 1
    selection_mode: random
    selected_indices: null
  gan:
    enabled: false
    target_weight: 0.0
    warmup_epochs: 1
    generator_gradient_clip_val: 1.0
    discriminator_gradient_clip_val: 1.0
    transition:
      start_epoch: 0
  matmul_precision: high
  allow_tf32: true

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${run.output_dir}}/hydra
  output_subdir: null
  job:
    chdir: false
