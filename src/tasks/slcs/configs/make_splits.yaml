defaults:
  - paths: default
  - data: default
  - _self_

splits:
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 0
  overwrite: false
  # Assign every recording to train; pair with data.overfit=true.
  overfit: false

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},slcs/make_splits,${now:%Y-%m-%d_%H-%M-%S}}
  output_subdir: null
  job:
    chdir: false
