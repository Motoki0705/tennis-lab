# ---- Trainer (Lightning Trainer settings) ----
trainer:
  max_epochs: 100
  gradient_clip_val: 1.0
  deterministic: true
  precision: "bf16-mixed"
  log_every_n_steps: 20
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  reload_dataloaders_every_n_epochs: 0
  enable_progress_bar: true
  enable_model_summary: true
  benchmark: false

# ---- Optimizer / schedule (LightningModule references) ----
learning_rate: 1.0e-4
weight_decay: 1.0e-5
warmup_steps: 500
warmup_epochs: null
min_lr: 1.0e-6
steps_per_epoch: null
optimizer:
  betas: [0.9, 0.999]

compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

# ---- Callbacks (BaseTrainingRunner references) ----
checkpoint:
  enabled: true
  filename: "slcs-{epoch:02d}"
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: val/loss
  mode: min
  patience: 15
  min_delta: 1.0e-5
  check_on_train_epoch_end: false

lr_monitor:
  enabled: true
  interval: step

qualitative_logging:
  enabled: false
  every_n_epochs: 1
  num_samples: 4
  selection_mode: random
  selected_indices: null

gan:
  enabled: false
  target_weight: 0.0
  warmup_epochs: 1
  generator_gradient_clip_val: null
  discriminator_gradient_clip_val: null
  transition:
    start_epoch: 0

matmul_precision: high
allow_tf32: true
