# Small SLCS fusion model for smoke tests and quick iteration.
name: slcs_fusion
hidden_dim: 64
num_shared_layers: 2
num_position_layers: 0
num_rotation_layers: 0
num_heads: 4
ffn_dim: 192
dropout: 0.1
rope_dim: 16
rope_theta_time: 10000.0
rope_theta_entity: 10000.0
attention_type: mha
ffn_type: swiglu
invisible_init_std: 0.02
dino_patch_downsample_factor: 1
dino_cross_attn_every: 1
log_b_min: -6.0
log_b_max: 3.0
