# Small web-derived tennis sample built from in-repo assets so the pipeline is
# reproducible offline. Swap/extend `sources` with real web videos and image
# URLs to scale up domain coverage.
name: tennis_sample
output_dir: data/dino_ssl/tennis_sample
overwrite: true
dedup: true

# If real sources yield fewer than `min_images`, top up with deterministic
# synthetic images so smoke tests stay self-contained.
min_images: 32
synthetic_fallback:
  enabled: true
  size: 256

sources:
  - type: video_frames
    path: data/samples/tennis_clip.mp4
    stride: 8
    max_frames: 40
    min_size: 64
  - type: image_dir
    path: data/court/images
    pattern: "*.png"
    max_images: 60
    min_size: 64
  # Example remote sources (disabled by default; require network access):
  # - type: video_frames
  #   path: "https://www.youtube.com/watch?v=<id>"
  #   stride: 30
  #   max_frames: 200
  # - type: image_urls
  #   urls:
  #     - "https://example.com/tennis_rally.jpg"
