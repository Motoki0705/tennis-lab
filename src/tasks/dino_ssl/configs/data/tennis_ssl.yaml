# Multi-crop SSL dataset built from the collected tennis image folder.
root: data/dino_ssl/tennis_sample
batch_size: 16
num_workers: 8
pin_memory: true
val_fraction: 0.1
patch_size: 16

augmentation:
  global_crops_scale: [0.32, 1.0]
  local_crops_scale: [0.05, 0.32]
  local_crops_number: 6
  global_size: 224
  local_size: 96
  mask_ratio_min: 0.1
  mask_ratio_max: 0.5
