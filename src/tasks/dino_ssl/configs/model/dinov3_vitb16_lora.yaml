# DINOv3 ViT-B/16 backbone fine-tuned with LoRA adapters.
name: dinov3_vitb16_lora
backbone_name: dinov3_vitb16
checkpoint_path: third_party/dinov3/checkpoints/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
load_pretrained: true

# LoRA keeps the pretrained weights frozen and only learns low-rank adapters,
# minimising catastrophic forgetting of DINOv3's general visual capability.
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  bias: none
  target_modules: [qkv, proj, fc1, fc2]

# DINO/iBOT projection heads (trained from scratch alongside the LoRA adapters).
head:
  hidden_dim: 2048
  bottleneck_dim: 256
  nlayers: 3

dino:
  out_dim: 65536

ibot:
  enabled: true
  out_dim: 65536
