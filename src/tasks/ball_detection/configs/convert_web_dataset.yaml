# Convert data/tennis/web heterogeneous sources into the unified web ball store.
#
# Usage:
#   python -m src.tasks.ball_detection.scripts.convert_web_dataset
#   python -m src.tasks.ball_detection.scripts.convert_web_dataset convert.sources.racketvision=false
#   python -m src.tasks.ball_detection.scripts.convert_web_dataset convert.limit_per_source=50 convert.overwrite=true
convert:
  web_root: tennis/web
  output_dir: tennis/web/unified
  overwrite: false

  # Packing / encoding.
  jpeg_quality: 90
  shard_size_bytes: 1073741824 # 1 GiB per shard

  # Group-level split assignment. Roboflow augmentation groups and complete
  # video sequences stay in one split. RacketVision uses its official split.
  val_ratio: 0.1
  test_ratio: 0.1
  split_seed: 1234

  # Kaggle "missing ball" sentinel: a point inside the top-right corner of this
  # fractional size is retained as an explicit negative frame.
  kaggle_corner_frac: 0.05

  # Domain cleaning: drop a frame when any ball bbox spans at least this
  # fraction of the matching image side (max(w/W, h/H)). Targets zoomed-in
  # close-ups (a different domain than rally-camera detection). Only the
  # bbox-bearing sources (roboflow, ball_yolo) are affected; the point-only
  # temporal sources carry no bbox and pass through unchanged. null disables.
  # Threshold chosen from the outputs/web_bbox_ratio_sweep visual review.
  max_bbox_side_ratio: 0.10

  # 0 = all samples; >0 caps each source for fast smoke validation.
  limit_per_source: 0

  sources:
    roboflow: true
    racketvision: true
    kaggle: true
    ball_yolo: true
hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},ball_detection/convert_web_dataset,${now:%Y-%m-%d_%H-%M-%S}}
  output_subdir: null
  job:
    chdir: false
defaults:
  - paths: default
  - _self_
