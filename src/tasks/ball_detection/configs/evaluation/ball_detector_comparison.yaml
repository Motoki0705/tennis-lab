schema: ball_detection_evaluation_manifest_v1
# evaluation/ holds pre-#618 legacy-protocol results; keep them separate.
output_dir: ball_detection/evaluation_native
device: auto
resume: true
fail_fast: false

# Native-resolution protocol (issue #618): heatmaps stay on the model's output
# lattice (72x128 for 288x512 inputs) so log-parabolic sub-pixel refinement
# operates on the unresized Gaussian. nms_kernel 3 matches the 4x coarser grid.
# Distances/thresholds remain in original-image pixels.
metrics:
  peak_threshold: 0.5
  ball_distance_threshold: 4.0
  nms_kernel: 3
  max_predictions_per_frame: 8
  subpixel_refine: true

performance:
  warmup_batches: 1
  max_batches_per_split: null

datasets:
  tracknet:
    config: rgb_sequence
    splits: [val, test]
    overrides:
      batch_size: 4
      num_workers: 4
      heatmap_size: [72, 128]
  web:
    config: web_frames
    splits: [test]
    overrides:
      batch_size: 8
      num_workers: 4
      sampling:
        mode: static

models:
  - id: convnext-tracknet
    enabled: true
    category: architecture-controlled
    checkpoint: ball_detection/convnext/logs/version_0/checkpoints/last.ckpt
    expected_model_name: conv_next_unet
    datasets: [tracknet]
    strict: true
    weights_only: false

  # issue #618: val/f1-monitored fine-tune of convnext-tracknet; deployed as
  # ckpt/ball_detection/run-i618-convnext-v2-ft-epoch13.ckpt (2026-07-07).
  - id: convnext-v2-ft
    enabled: true
    category: architecture-controlled
    checkpoint: ball_detection/convnext_v2_ft/logs/version_0/checkpoints/ball-detection-epoch=13.ckpt
    expected_model_name: conv_next_unet
    datasets: [tracknet]
    strict: true
    weights_only: false

  # issue #618: from-scratch retrain with the same val/f1-monitored recipe as
  # convnext-v2-ft (60-epoch budget, early-stopped at 36; best val/f1 at ep25).
  - id: convnext-v2-scratch
    enabled: true
    category: architecture-controlled
    checkpoint: ball_detection/convnext_v2_scratch/logs/version_0/checkpoints/ball-detection-epoch=25.ckpt
    expected_model_name: conv_next_unet
    datasets: [tracknet]
    strict: true
    weights_only: false

  # Enable after a TrackNet-only DINOv3 run is available.
  - id: dinov3-tracknet
    enabled: false
    category: architecture-controlled
    checkpoint: ball_detection/dinov3_rope_tracknet/checkpoints/last.ckpt
    expected_model_name: dinov3_rope
    datasets: [tracknet]
    strict: true
    weights_only: false

  # Enable after Web-static + temporal training is available.
  - id: dinov3-full
    enabled: false
    category: full-strategy
    checkpoint: ball_detection/dinov3_rope_full/checkpoints/last.ckpt
    expected_model_name: dinov3_rope
    datasets: [tracknet, web]
    strict: true
    weights_only: false
