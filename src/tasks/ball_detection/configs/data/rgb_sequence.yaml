# Unified ball frame store (src/tasks/ball_detection/data/store.py), read by
# BallStoreDataModule (data/store_datamodule.py). Remove a source with e.g.
# `data.sources=[tracknet] data.train_sampling.source_weights='{tracknet: 1.0}'`.
defaults:
  - augmentation: default
  - _self_

source: store
# DATA-root-relative store version.
data_dir: ${tennis_dataset:ball_detection,ball-mix-v1}
# Store sources used for train, val and test.
sources: [tracknet, meiji, chat_annotation]

# One epoch = windows_per_epoch train windows drawn with these exact source
# proportions (null: every train window once, shuffled, natural proportions).
train_sampling:
  windows_per_epoch: 8000
  seed: 1234
  source_weights:
    tracknet: 1.0
    meiji: 1.0
    chat_annotation: 1.0

# Window starts every N frames (windows are model.num_frames long).
train_stride: 1
# null uses model.num_frames; validation also backfills the real tail.
eval_stride: null

# Every point_kind gets exactly one role (data/supervision.py). A frame with an
# `ignore` ball, or not reviewed, is excluded from the loss and the metrics.
supervision:
  positive: [observed]
  absent: [out_of_frame]
  ignore: [interpolated, occlusion_estimated, unresolved]

batch_size: 4
num_workers: 4
pin_memory: true

image_size: [288, 512]
heatmap_size: [288, 512]
sigma_ratio: 0.012
max_instances: 16
