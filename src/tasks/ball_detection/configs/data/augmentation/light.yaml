# Light augmentation: lower probabilities / milder geometric perturbations.
# Photometric jitter and ImageNet normalization stay on. Select with
# `data/augmentation=light`.
camera_rotation:
  enabled: false
  prob: 0.0
  max_center_angle_deg: 1.2
  max_angular_velocity_deg_per_frame: 0.2
  border_mode: reflect101
horizontal_flip:
  enabled: true
  prob: 0.5
affine:
  enabled: true
  prob: 0.2
  rotation_deg_range: [-5.0, 5.0]
  scale_range: [1.0, 1.0]
  translate_x_ratio_range: [-0.05, 0.05]
  translate_y_ratio_range: [-0.05, 0.05]
  shear_x_deg_range: [-1.0, 1.0]
  shear_y_deg_range: [-0.5, 0.5]
  border_mode: reflect101
scale_and_crop:
  enabled: true
  prob: 0.2
  scale_range: [1.0, 1.5]
  border_mode: reflect101
ball_area_zero_mask:
  enabled: false
  prob: 0.0
  mask_width_ratio_range: [0.04, 0.12]
  mask_height_ratio_range: [0.04, 0.12]
  num_frames_range: [1, 3]
brightness_gain:
  enabled: true
  jitter: 0.05
contrast:
  enabled: true
  jitter: 0.05
gamma:
  enabled: true
  jitter: 0.04
gaussian_noise:
  enabled: true
  std: 0.006
gaussian_blur:
  enabled: false
  prob: 0.0
  kernel_size: 3
normalize_imagenet:
  enabled: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
