defaults:
  - augmentation: default
  - _self_

source: mixed_tracknet
data_dir: tennis/tracknet

split:
  root_role: project
  train_file: src/tasks/ball_detection/configs/data/splits/train.txt
  val_file: src/tasks/ball_detection/configs/data/splits/val.txt
  test_file: src/tasks/ball_detection/configs/data/splits/test.txt

synthetic:
  data_dir: tennis/3dgs_synthetic/b00-default-v1/full-scale-v1/5d108d8c9cc2e27224a4d294095b01c6f1de702e634367eafe0aef2771412c9f
  split:
    root_role: data
    train_file: tennis/3dgs_synthetic/b00-default-v1/full-scale-v1/5d108d8c9cc2e27224a4d294095b01c6f1de702e634367eafe0aef2771412c9f/splits/train.txt
  sample_stride: 4

batch_size: 6
synthetic_per_batch: 1
synthetic_batch_period: 1
steps_per_epoch: 655
sampling_seed: ${run.seed}
