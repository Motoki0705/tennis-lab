defaults:
  - paths: default
  - model: stunet
  - data: rgb_sequence
  - _self_

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${preview.output_dir},hydra}
  output_subdir: null
  job:
    chdir: false

preview:
  split: train
  sample_indices: [0]
  max_samples: 4
  seed: 42
  output_dir: ${tennis_output:ball_detection,visualize,augmentation,${tennis_run_id:}}
  draw:
    radius: 5
    thickness: 2
  layout:
    tile_gap: 12
    row_gap: 18
    header_height: 30
    text_scale: 0.6
    text_thickness: 1
    background_rgb: [24, 24, 24]
