hydra:
  run:
    dir: outputs/ball_detection/prepare_dinov3_ssl_images/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false

workflow:
  root: data/tennis/dino_ssl

  sources: []

  discovery:
    enabled: true
    # Duration is filtered before download (min/max_duration_sec + download
    # match-filter), so queries do not need "short"/length hints. Queries span
    # many languages to surface a more diverse tennis-domain corpus.
    queries:
      # English
      - tennis match highlights
      - tennis rally
      - ATP tennis highlights
      - WTA tennis highlights
      - tennis practice session
      - tennis serve slow motion
      - grand slam final highlights
      - tennis doubles match
      - clay court tennis match
      - grass court tennis
      - hard court tennis match
      - tennis baseline rally
      - tennis tournament match
      # Japanese
      - テニス 試合 ハイライト
      - テニス ラリー
      - テニス 練習
      - 全米オープン テニス
      - テニス サーブ
      - テニス ダブルス
      - プロ テニス 試合
      # Chinese (Simplified)
      - 网球 比赛 集锦
      - 网球 训练
      - 网球 精彩回合
      - 网球 双打
      # Spanish
      - tenis partido completo
      - tenis mejores puntos
      - tenis entrenamiento
      # French
      - tennis match complet
      - Roland Garros tennis
      - tennis échange
      # German
      - tennis spiel highlights
      - tennis training
      # Korean
      - 테니스 경기 하이라이트
      - 테니스 랠리
      # Russian
      - теннис матч
      - теннис розыгрыш
      # Italian
      - tennis partita
      # Portuguese
      - tênis melhores momentos
      # Arabic
      - تنس مباراة
    max_results_per_query: 40
    min_duration_sec: 20
    max_duration_sec: 600
    allow_unknown_duration: false

  paths:
    videos_dir: videos
    source_dir: source
    h264_dir: h264
    sampled_dir: sampled
    images_dir: images
    manifests_dir: manifests

  processing:
    max_new_videos: 2000
    reprocess_existing: false
    cleanup_videos_after_processing: true
    cleanup_keep_info_json: true

  storage:
    enabled: true
    max_root_gb: 20

  download:
    enabled: true
    format: "bestvideo[vcodec^=avc1][height<=360]+bestaudio/bestvideo[height<=360]+bestaudio/best[height<=360]"
    merge_output_format: mkv
    js_runtimes: node
    remote_components: null
    download_archive: data/tennis/dino_ssl/manifests/download_archive.txt
    overwrite: false
    extra_args:
      - --match-filter
      - "duration >= 20 & duration <= 600"

  transcode:
    enabled: false
    fallback_on_decode_error: true
    ffmpeg_binary: ffmpeg
    encoder: libx264
    hwaccel: null
    hwaccel_output_format: null
    preset: veryfast
    tune: null
    rate_control: null
    cq: null
    bitrate: null
    maxrate: null
    bufsize: null
    profile: high
    pix_fmt: yuv420p
    crf: 24
    overwrite: false

  frames:
    frames_per_video: 100
    output_ext: jpg
    jpeg_quality: 92
    overwrite: false

  gate:
    backend: vllm
    mock:
      accept_all: false
    contact_sheet:
      max_images: 8
      columns: 4
      thumb_width: 160
      thumb_height: 90
    vllm:
      base_url: http://127.0.0.1:8000/v1
      model: Qwen/Qwen3.5-0.8B
      timeout_sec: 300
      max_tokens: 256
      accept_labels:
        - tennis
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
      server:
        enabled: true
        # CPU vLLM is a separate runtime from the project .venv. Override this
        # path with VLLM_CPU_PYTHON, or replace command with an OpenAI-compatible
        # llama.cpp server command if vLLM CPU is not suitable on the host.
        command:
          - ${oc.env:VLLM_CPU_PYTHON,/home/kamimura/.cache/tennis-lab/vllm-cpu/bin/python}
          - -m
          - vllm.entrypoints.openai.api_server
          - --model
          - Qwen/Qwen3.5-0.8B
          - --host
          - 127.0.0.1
          - --port
          - "8000"
          - --max-model-len
          - "2048"
          - --max-num-seqs
          - "1"
          - --max-num-batched-tokens
          - "2048"
          - --enforce-eager
          - --skip-mm-profiling
          - --reasoning-parser
          - qwen3
          - --limit-mm-per-prompt
          - '{"image":1}'
          - --trust-remote-code
        env:
          VLLM_CPU_KVCACHE_SPACE: "2"
          VLLM_LOGGING_LEVEL: INFO
        health_url: http://127.0.0.1:8000/v1/models
        startup_timeout_sec: 300
        poll_interval_sec: 5
        request_timeout_sec: 5
        shutdown_timeout_sec: 20
        stop_on_exit: true
        log_path: outputs/ball_detection/prepare_dinov3_ssl_images/vllm_cpu_server.log
        preflight:
          enabled: true
          command:
            - ${oc.env:VLLM_CPU_PYTHON,/home/kamimura/.cache/tennis-lab/vllm-cpu/bin/python}
            - -c
            - "from vllm.platforms import current_platform; assert current_platform.is_cpu(), f'vLLM runtime must use CPU backend, got {current_platform.device_type}'"
      prompt: "Classify the image grid for a DINOv3 tennis SSL corpus. Return JSON only, with keys label, confidence, and reason. label must be tennis, non_tennis, or unknown. Use tennis only when a tennis court, player, racket, or net is visible."
