hydra:
  run:
    dir: outputs/ball_detection/prepare_dinov3_ssl_images/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false

workflow:
  root: data/tennis/dino_ssl

  sources: []

  discovery:
    enabled: true
    queries:
      - tennis rally highlights short
      - tennis practice rally short
      - tennis match point short
      - tennis court rally 5 minutes
    max_results_per_query: 25
    min_duration_sec: 20
    max_duration_sec: 600
    allow_unknown_duration: false

  paths:
    videos_dir: videos
    source_dir: source
    h264_dir: h264
    sampled_dir: sampled
    images_dir: images
    manifests_dir: manifests

  processing:
    max_new_videos: 20
    reprocess_existing: false

  download:
    enabled: true
    format: "bestvideo[vcodec^=avc1][height<=360]+bestaudio/bestvideo[height<=360]+bestaudio/best[height<=360]"
    merge_output_format: mkv
    js_runtimes: node
    remote_components: null
    download_archive: data/tennis/dino_ssl/manifests/download_archive.txt
    overwrite: false
    extra_args:
      - --match-filter
      - "duration >= 20 & duration <= 600"

  transcode:
    enabled: false
    fallback_on_decode_error: true
    ffmpeg_binary: ffmpeg
    encoder: libx264
    hwaccel: null
    hwaccel_output_format: null
    preset: veryfast
    tune: null
    rate_control: null
    cq: null
    bitrate: null
    maxrate: null
    bufsize: null
    profile: high
    pix_fmt: yuv420p
    crf: 24
    overwrite: false

  frames:
    frames_per_video: 50
    output_ext: jpg
    jpeg_quality: 92
    overwrite: false

  gate:
    backend: openai_compatible
    mock:
      accept_all: false
    contact_sheet:
      max_images: 12
      columns: 4
      thumb_width: 224
      thumb_height: 126
    command_backend:
      # Example for a local wrapper around Qwen3.5-0.8B LiteRT/ONNX INT8.
      command:
        - python
        - -m
        - tools.qwen35_vlm_gate
        - --image
        - "{image_path}"
        - --prompt
        - "{prompt}"
      accept_labels:
        - tennis
      prompt: "Classify this contact sheet. Return exactly one label: tennis, non_tennis, or unknown."
    openai_compatible:
      base_url: http://127.0.0.1:8000/v1
      model: GabrieleConte/Qwen3.5-0.8B-LiteRT
      timeout_sec: 60
      accept_labels:
        - tennis
      prompt: "Classify this contact sheet. Return exactly one label: tennis, non_tennis, or unknown."
