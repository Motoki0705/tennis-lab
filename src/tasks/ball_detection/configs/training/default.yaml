# ---- Training loop settings ----
trainer:
  max_epochs: 20
  gradient_clip_val: 1.0
  deterministic: warn
  precision: bf16-mixed
  log_every_n_steps: 50
  check_val_every_n_epoch: 1

# ---- Optimizer / scheduler ----
learning_rate: 1.0e-4
weight_decay: 1.0e-4
warmup_steps: 200
min_lr: 1.0e-6

optimizer:
  name: adamw
  betas: [0.9, 0.999]

# ---- Runtime settings ----
matmul_precision: high
allow_tf32: true

# ---- Checkpoint / stopping ----
checkpoint:
  enabled: true
  filename: "ball-detection-{epoch:02d}"
  monitor: val/loss
  mode: min
  save_top_k: 2
  save_last: true

early_stopping:
  enabled: true
  monitor: val/loss
  mode: min
  patience: 5
  min_delta: 2.0e-6

lr_monitor:
  enabled: true
  interval: step
