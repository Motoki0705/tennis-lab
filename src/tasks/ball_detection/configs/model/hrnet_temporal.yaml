name: wasb_hrnet_temporal

# third_party/WASB-SBDT model config
wasb_model_config_path: third_party/WASB-SBDT/src/configs/model/wasb.yaml

# override WASB backbone frame settings when needed
backbone_frames_in: 3
backbone_frames_out: 3

# temporal head
temporal_hidden_channels: [64]
temporal_kernel_size: 3

# optional warm-start from WASB pretrained weights
pretrained_backbone_checkpoint: checkpoints/wasb/wasb_tennis_best.pth.tar
strict_pretrained_load: false
