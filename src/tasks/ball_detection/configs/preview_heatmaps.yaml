defaults:
  - paths: default
  - model: stunet
  - data: rgb_sequence
  - _self_

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${preview.output_dir},${now:%Y-%m-%d_%H-%M-%S}}
  output_subdir: null
  job:
    chdir: false

preview:
  split: train
  sample_indices: [0, 4, 8]
  max_samples: 3
  ratios: [0.003, 0.006, 0.012, 0.024]
  output_dir: ball_detection/heatmap_preview
  layout:
    tile_gap: 12
    header_height: 30
    text_scale: 0.55
    text_thickness: 1
    background_rgb: [24, 24, 24]
  draw:
    gt_radius: 5
    argmax_radius: 4
    thickness: 2
