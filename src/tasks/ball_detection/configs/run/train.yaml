output_dir: ${tennis_output:ball_detection,train,${model.name},${tennis_run_id:}}
seed: 42
gpus: 1
resume: null
# Weights-only initialization for fine-tuning. Unlike full-state `resume`,
# this starts a fresh optimizer at epoch 0. null trains from scratch.
init_weights: null
fast_dev_run: false
dry_run: false
# Final-test evaluation is normally retained for backwards compatibility.
# Controlled experiments set this false while tuning on validation data.
test_after_fit: true
artifact_store:
  mode: local
  remote: null
  remote_root: null
  sync_interval_seconds: null
