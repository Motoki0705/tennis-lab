defaults:
  - _self_

package_target: both
overwrite: false
output_dir: outputs/ball_detection/packages
archive_date: ${now:%Y-%m-%d}

code:
  archive_name: tennis-lab-ball-detection-code-${archive_date}.7z
  paths:
    - pyproject.toml
    - requirements.txt
    - requirements-dev.txt
    - src/__init__.py
    - src/tasks/__init__.py
    - src/tasks/ball_detection

data:
  archive_name: tennis-lab-ball-detection-data-${archive_date}.7z
  paths:
    - data/tennis

compression:
  level: 5

hydra:
  run:
    dir: outputs/ball_detection/package/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
