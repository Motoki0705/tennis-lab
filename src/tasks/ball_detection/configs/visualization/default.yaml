store_dir: ${data.data_dir}
clip_id: tracknet/game1/Clip1
checkpoint:
  role: artifact
  path: ball_detection/i935-mixed-ft-s42-epoch09.ckpt
save: ${run.output_dir}/game1_clip1_prediction.gif
fps: 12
window_stride: 1
inference_batch_size: 4
peak_threshold: ${metrics.peak_threshold}
start_frame: 0
max_frames: null
info: false
strict: true
weights_only: false
layout: grid_2x2

overlay:
  output_width: 960
  frame_stride: 1
  styles: [ring]
  # Marker sizes below are pixels at output width 960, scaled with the width.
  ring:
    radius: 9
    thickness: 2
    center_radius: 2
    glow_radius: 3
    glow_opacity: 0.12
  trail:
    radius: 4
    length: 8
    thickness: 2
    opacity: 0.55

draw:
  gt_radius: 6
  pred_radius: 6
  thickness: 2
  gt_color_rgb: [255, 96, 96]
  pred_color_rgb: [96, 255, 128]
  text_color_rgb: [245, 245, 245]
  muted_text_color_rgb: [168, 168, 168]

grid:
  header_height: 44
  tile_gap: 12
  text_scale: 0.52
  text_thickness: 1
  background_rgb: [18, 18, 18]
  panel_label_height: 24

gif:
  loop: 0
