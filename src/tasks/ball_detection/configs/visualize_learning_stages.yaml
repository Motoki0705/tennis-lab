defaults:
  - paths: default
  - _self_

runs:
  pretraining: knowledge/runs/run-i1050-convnext-v2-pretrain-s42
  posttraining: knowledge/runs/run-i1049-convnext-query-posttrain-s42
training_summary: assets/ball_detection/learning_stages/scalars.json
# Required: real_clip | schematic. Never switch panels on a read failure.
input_panel: ???
# real_clip: {store_dir: <data-root-relative store>, clip_id: <id>, frame: <window start>}
input_clip: null
durations:
  intro: 3
  phase1: 18
  handoff12: 4
  phase2: 20
  handoff23: 3
  phase3: 9
  outro: 3
fps: 30
width: 1920
height: 1080
gif_width: 960
gif_fps: 15
run_id: ${tennis_run_id:}
run:
  output_dir: ${tennis_output:ball_detection,visualize,learning_stages,${run_id}}

# Hydra owns run.output_dir/hydra; the exporter owns the fresh presentation/
# child, so Hydra cannot pre-create or overwrite the media destination.
hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${run.output_dir},hydra}
  output_subdir: null
  job:
    chdir: false
