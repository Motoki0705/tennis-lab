_target_: src.tasks.court_alignment.models.dino_detector.load_pretrained_dino_court_detector
repository: DINO
checkpoint_path: ckpt/dino/checkpoint0029_4scale_swin.pth
device: cpu

# Released DINO-DETR evaluation resize. The square procedural dataset is 800x800.
short_side: 800
max_long_side: 1333

# Ablation axis: repeat_rgb | learnable_1x1 | red_only
input_mode: repeat_rgb

lora_rank: 8
lora_alpha: 16.0
lora_dropout: 0.05
lora_target_modules:
  - qkv
  - proj
  - value_proj
  - output_proj
  - linear1
  - linear2
