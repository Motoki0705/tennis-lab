# @package data
defaults:
  - b00_scale_v1
  - _self_

# B00 pilot factor: missing segments, parallel ghosts, and long false lines.
augmentations:
  - name: random_line_dropout
    params:
      probability: 0.3
      gap_count_range: [1, 4]
      gap_length_px_range: [2.0, 12.0]
      gap_width_px_range: [1.0, 4.0]
  - name: random_ghost_lines
    params:
      probability: 0.5
      copy_count_range: [1, 3]
      offset_px_range: [3, 15]
      amplitude_range: [0.55, 1.0]
      long_line_count_range: [0, 3]
      long_line_length_px_range: [48.0, 220.0]
      long_line_width_px_range: [1.0, 4.0]
      long_line_amplitude_range: [0.55, 1.0]
