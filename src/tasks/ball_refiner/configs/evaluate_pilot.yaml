paths:
  project_root: .
  data_root: data
  checkpoint_root: ckpt
  artifact_root: outputs
  output_root: outputs
  cache_root: data
  external_asset_root: third_party

evaluate:
  training_run: ball_refiner/train/detector_only/i935-ft-e13-s42-r4-20260928
  partition: calibration
  levels: [0.5, 0.9, 0.95]
  samples: 2048
  seed: 1729
  chunk_size: 32
  bootstrap_repetitions: 2000
  bootstrap_confidence: 0.95

compile:
  enabled: true
  backend: inductor
  mode: default
  fullgraph: false
  dynamic: false

run:
  output_dir: ${tennis_output:ball_refiner,evaluate,detector_only,${tennis_run_id:}}
  device: cuda

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${run.output_dir},hydra}
  output_subdir: null
  job:
    chdir: false
