# Cross-camera player association (#933). Every field is required (association/config.py).
# players_per_side (1 = singles, 2 = doubles) is a property of the clip: callers pass it.
# Semantics: association/associate.py and the modules named per section.
# Data-driven values (geometry.sigma_m, appearance.slope/center) are fitted by
# `tests/benchmarks/player_association_clips.py --phase calibrate` on unlabelled Meiji clips.
footpoints:                    # geometry/footpoints.py
  bottom_border_px: 4.0
switches:                      # geometry/switches.py
  window_s: 0.25
  max_jump_m: 3.0              # a person covers ~2 m between the two window centres (0.25 s at 8 m/s)
geometry:                      # geometry/affinity.py
  sigma_m: 1.05                # calibrated: run-i933-association-meiji (60 pseudo-positive pairs, 7 unlabelled clips)
  area_m2: 539.3               # the play region below: (2 * (5.485 + 2.5)) * (2 * (11.885 + 5))
  full_evidence_s: 1.0
  max_abs_score: 10.0
appearance:                    # appearance/affinity.py; null = geometry only
  encoder: clipreid_vitb16_market1501
  slope: 62.7                  # calibrated: run-i933-association-meiji (40 / 45 pseudo pairs with crops)
  center: 0.847
  max_abs_score: 4.0
continuity_score: 2.0          # consecutive segments of one track (a cut switch candidate)
min_segment_s: 0.25
max_handoff_overlap_s: 0.2
region:                        # geometry/region.py
  sideline_margin_m: 2.5
  baseline_margin_m: 5.0
min_presence_fraction: 0.25
max_runner_up_ratio: 0.5
min_margin: 1.0
max_undecided_segment_s: 1.0
time_limit_s: 10.0
