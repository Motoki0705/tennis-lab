<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLCS Inference</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="workspace">
      <aside class="panel" aria-label="チェックポイントとシーン">
        <header class="panel-head">
          <p class="brand"><span class="brand-mark" aria-hidden="true">◎</span>PLCS <b>INFERENCE</b></p>
          <p class="brand-sub">物理コート座標 / メートル (+Z up)</p>
        </header>
        <div class="panel-body">
          <section class="block">
            <h2 class="block-title">チェックポイント</h2>
            <div class="search">
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21 21-4.34-4.34" />
                <circle cx="11" cy="11" r="8" />
              </svg>
              <input
                id="checkpoint-search"
                type="search"
                placeholder="モデル名・パスで検索"
                aria-label="チェックポイントを検索"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
            <div id="checkpoint-list" class="list" role="listbox" aria-label="チェックポイント候補"></div>
            <label class="field-label" for="path-input">パスを直接入力</label>
            <div class="row">
              <input
                id="path-input"
                type="text"
                placeholder="/path/to/plcs.ckpt"
                aria-label="チェックポイントのパスを直接入力"
                autocomplete="off"
                spellcheck="false"
              />
              <button id="path-submit" class="icon-button" type="button" title="パスを読み込む">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 18 6-6-6-6" />
                </svg>
              </button>
            </div>
          </section>

          <section class="block">
            <h2 class="block-title">シーンファミリ</h2>
            <div id="family-list" class="list" aria-label="シーンファミリ"></div>
            <details id="family-unsupported" class="unsupported" hidden>
              <summary>非対応 <span class="count" id="family-unsupported-count">0</span></summary>
              <div id="family-unsupported-list" class="list"></div>
            </details>
          </section>

          <section class="block">
            <h2 class="block-title">シーン</h2>
            <div id="split-tabs" class="tabs" role="tablist" aria-label="split"></div>
            <div class="search">
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21 21-4.34-4.34" />
                <circle cx="11" cy="11" r="8" />
              </svg>
              <input
                id="scene-search"
                type="search"
                placeholder="シーン ID で検索"
                aria-label="シーンを検索"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
            <p class="result-count" id="result-count" role="status"></p>
            <div id="scene-list" class="list" aria-label="シーン一覧"></div>
          </section>
        </div>
      </aside>

      <section class="viewport" aria-label="コートの3Dビュー">
        <header class="viewport-head">
          <div class="title-block">
            <span class="eyebrow" id="scene-eyebrow">シーン未選択</span>
            <h1 id="scene-title">シーンを選択してください</h1>
          </div>
          <div class="view-actions">
            <button id="toggle-gt" class="icon-toggle" type="button" aria-pressed="true" title="GT を表示">
              <i class="swatch gt"></i><span>GT</span>
            </button>
            <button id="toggle-pred" class="icon-toggle" type="button" aria-pressed="true" title="推論を表示">
              <i class="swatch pred"></i><span>推論</span>
            </button>
            <button id="toggle-trails" class="icon-toggle" type="button" aria-pressed="true" title="軌跡を表示">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="6" cy="19" r="3" />
                <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
                <circle cx="18" cy="5" r="3" />
              </svg>
            </button>
            <button id="reset-view" class="icon-button" type="button" title="視点を戻す">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
            </button>
          </div>
        </header>
        <div class="stage">
          <canvas
            id="court"
            tabindex="0"
            aria-label="ドラッグで回転、Shift＋ドラッグで移動、ホイールで拡大、ダブルクリックで視点リセット"
          ></canvas>
          <div class="legend" id="legend">
            <span data-kind="gt"><i class="swatch gt"></i>GT</span>
            <span data-kind="pred"><i class="swatch pred"></i>推論</span>
          </div>
          <dl class="hud" id="hud">
            <div><dt>frame</dt><dd id="hud-frame">–</dd></div>
            <div><dt>time</dt><dd id="hud-time">–</dd></div>
            <div><dt>GT xyz</dt><dd id="hud-gt">–</dd></div>
            <div><dt>推論 xyz</dt><dd id="hud-pred">–</dd></div>
            <div><dt>model</dt><dd id="hud-model">–</dd></div>
          </dl>
          <p class="overlay" id="status" role="status" hidden></p>
          <div class="transport" id="transport">
            <button id="to-start" class="icon-button" type="button" title="先頭へ">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m11 17-5-5 5-5" />
                <path d="m18 17-5-5 5-5" />
              </svg>
            </button>
            <button id="prev" class="icon-button" type="button" title="1フレーム戻る">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <button id="play" class="icon-button primary" type="button" title="再生 / 一時停止">
              <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" fill="currentColor" stroke="none" />
              </svg>
            </button>
            <button id="next" class="icon-button" type="button" title="1フレーム進む">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
            <button id="to-end" class="icon-button" type="button" title="末尾へ">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 17 5-5-5-5" />
                <path d="m13 17 5-5-5-5" />
              </svg>
            </button>
            <input
              id="scrub"
              class="scrub"
              type="range"
              min="0"
              max="0"
              step="1"
              value="0"
              aria-label="再生フレーム"
            />
            <span class="clock" id="clock">0 / 0</span>
            <div class="speeds" role="group" aria-label="再生速度">
              <button type="button" data-speed="0.25">0.25×</button>
              <button type="button" data-speed="0.5">0.5×</button>
              <button type="button" data-speed="1" aria-pressed="true">1×</button>
              <button type="button" data-speed="2">2×</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="panel" aria-label="推論設定">
        <header class="panel-head">
          <h2 class="panel-title">推論設定</h2>
        </header>
        <div class="panel-body">
          <section class="block">
            <label class="field-label" for="device">デバイス</label>
            <select id="device">
              <option value="cuda">cuda</option>
              <option value="cpu">cpu</option>
            </select>
          </section>

          <section class="block">
            <div class="block-head">
              <h3 class="block-subtitle">カメラ</h3>
              <span class="count" id="camera-count">0</span>
            </div>
            <div id="cameras" class="camera-list"></div>
            <label class="field-label" for="reference-camera">参照カメラ</label>
            <select id="reference-camera"></select>
          </section>

          <section class="block">
            <h3 class="block-subtitle">ウィンドウ</h3>
            <div class="grid-2">
              <label class="mini" for="window-start">開始</label>
              <label class="mini" for="window-length">長さ</label>
              <input id="window-start" type="number" min="0" step="1" value="0" />
              <input id="window-length" type="number" min="1" step="1" value="1" />
            </div>
            <p class="hint" id="window-hint">–</p>
          </section>

          <section class="block">
            <fieldset class="fieldset" id="pose-source">
              <legend>canonical pose</legend>
              <label class="radio">
                <input
                  type="radio"
                  class="pose-source"
                  name="pose-source"
                  value="gt"
                  checked
                />
                <span>GT</span>
              </label>
              <label class="radio">
                <input type="radio" class="pose-source" name="pose-source" value="prediction" />
                <span>推論</span>
              </label>
            </fieldset>
          </section>

          <section class="block">
            <button id="run" class="run-button" type="button" disabled>推論を実行</button>
            <p class="hint" id="run-hint"></p>
          </section>

          <section class="block">
            <h3 class="block-subtitle">指標</h3>
            <div id="metrics" class="metrics"></div>
          </section>

          <section class="block">
            <h3 class="block-subtitle">警告</h3>
            <div id="warnings" class="warnings"></div>
          </section>
        </div>
      </aside>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
