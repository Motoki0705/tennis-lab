defaults:
  - court_keypoints: physical_v1
  - data: multiview_sequence
  - paths: default
  - _self_

analysis:
  # Split to iterate; "train" measures GT training-data velocity distributions.
  split: train
  # Cap number of batches for speed (null = all). null reproduces the
  # per-angle dominance weights baked into loss/canonical_rot_vel.yaml.
  max_batches: null
  # Output filename for the JSON results.
  output_filename: angle_velocity_dominance.json

run:
  output_dir: ${tennis_output:plcs,analyze,angle_velocity,${tennis_run_id:}}
  seed: 42

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${run.output_dir},hydra}
  output_subdir: null
  job:
    chdir: false
