defaults:
  # Compatibility default. Select court_coordinate_normalization=v2 explicitly.
  - court_coordinate_normalization: v1
  - model: multiview_axial_base
  - data: multiview_sequence
  - training: default
  - loss: canonical
  - metrics: default
  - qualitative: default
  - run: train
  - paths: default
  - _self_

external_assets:
  smplh_model_path: smplx/smplh

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${run.output_dir}}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
