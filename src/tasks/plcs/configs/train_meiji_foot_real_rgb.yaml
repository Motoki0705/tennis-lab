# Geometry residual adaptation, keeping the pretrained source-motion split.
defaults:
  - train
  - override court_keypoints: camera_view_v2
  - override model: multiview_axial_foot_residual
  - override loss: all_outputs_beta01_reprojection
  - _self_
model:
  max_seq_len: 128
data:
  scene_dir: plcs/camera_view_real_rgb_ft_v1
  camera_candidates: [0, 1, 2, 3]
  num_views_range: [3, 3]
  min_cameras: 3
  seq_len_range: [32, 128]
  evaluation_reference_camera_id: camera_0
  batch_size: 4
training:
  trainer:
    max_epochs: 60
    check_val_every_n_epoch: 1
    enable_progress_bar: false
  learning_rate: 0.00005
  warmup_steps: 200
  compile:
    enabled: false
run:
  init_weights: plcs/plcs_multiview_axial_split/logs/version_0/checkpoints/plcs-epoch=29.ckpt
  output_dir: ${tennis_output:plcs,train,meiji_foot_real_rgb,${tennis_run_id:}}
paths:
  checkpoint_root: outputs
