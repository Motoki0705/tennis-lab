# Public-broadcast ("high main") TV camera layout.
#
# Two elevated cameras, one behind each baseline, centred on the court and
# looking down its length -- the classic tennis broadcast framing. Use this to
# generate a monocular training set that transfers to real broadcast footage
# (e.g. data/samples/tennis_clip.mp4):
#
#     .venv/bin/python -m src.tasks.plcs.scripts.generate_dataset \
#         camera=broadcast run.output_dir=plcs/single_object_broadcast
#
# Sim-to-real note (2026-07-05): the real tennis_clip camera PnP-fits to
# setback 32.7 m / height 11.4 m / HFOV 28 deg -- far outside the previous
# fixed 20 m / 7 m / 35 deg preset. Wide per-camera ranges below cover real
# broadcast variation; HFOV is solved from the sampled apparent court width
# (baseline u-span fraction; real clip = 0.64) so the court always frames
# sensibly regardless of setback/height.
layout: broadcast
image_size: [1280, 720]
z_min: 3.0
z_max: 5.0
hfov_deg: 60.0
fixed_look_at: [0.0, 0.0, 0.0]
fixed_baseline_clear_extra: 0.0
fixed_position_noise_radius: 2.0
fixed_look_at_xy_radius: 1.0
broadcast_setback: 20.0
broadcast_height: 7.0
broadcast_hfov_deg: 35.0

broadcast_setback_range: [15.0, 40.0]   # metres behind the baseline
broadcast_height_range: [5.0, 15.0]     # camera elevation (m)
broadcast_court_width_frac_range: [0.5, 0.9]  # near-baseline u-span / image width

broadcast_look_at_y: 0.0        # look-at target Y (0 = court centre)
broadcast_look_at_height: 0.5   # look-at target Z above the court (m)

# Per-camera variation. hfov jitter must stay 0 while the framing-fraction
# range is active (mutually exclusive).
broadcast_position_noise_radius: 1.0
broadcast_look_at_xy_radius: 2.0
broadcast_hfov_jitter_deg: 0.0
