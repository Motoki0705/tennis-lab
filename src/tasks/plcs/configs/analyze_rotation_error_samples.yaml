defaults:
  - court_coordinate_normalization: v1
  - run: analyze_rotation_error_samples
  - paths: default
  - visualization: default
  - _self_

analysis:
  # Split file under run.scene_dir, e.g. test / val / train.
  split: test
  # Inference device. "auto" selects cuda when available, else cpu.
  device: auto
  # Number of final samples to visualize.
  top_k: 10
  # Prefer one worst frame per scene before falling back to duplicates.
  unique_scenes: true
  # Keep this many worst candidate frames from each scene before global ranking.
  candidates_per_scene: 5
  # Number of frames on each side of the target frame in the cropped clip.
  clip_half_window: 15
  # Camera selector for multiview inference: "all" or comma-separated indices.
  cameras: all
  # Visualization options passed to the PLCS visualization orchestrator.
  render_visualizations: true
  animation_view: 2d_topdown
  fps: 8
  # Output layout under run.output_dir.
  scene_subdir: scenes
  report_filename: top_rotation_error_samples.json
  output_suffix: topdown.gif
  overwrite: true

visualization:
  device: ${analysis.device}

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${run.output_dir}}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
