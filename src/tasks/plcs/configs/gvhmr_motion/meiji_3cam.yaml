schema_version: plcs_gvhmr_selection_v1
dataset_id: meiji_3cam
cameras:
  # Side view: retain only footpoints on the near half of the main court.
  - camera_id: cam1
    player_role: near_player_cam1
    footpoint_polygon_normalized:
      - [0.28, 0.47]
      - [0.91, 0.45]
      - [0.84, 0.88]
      - [0.18, 0.92]

  # Baseline view: exclude the small far player and the adjacent right court.
  - camera_id: cam2
    player_role: near_player_cam2
    footpoint_polygon_normalized:
      - [0.05, 0.45]
      - [0.84, 0.45]
      - [0.90, 0.92]
      - [0.00, 0.92]
