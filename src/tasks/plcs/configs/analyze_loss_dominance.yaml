defaults:
  - court_keypoints: physical_v1
  - run: analyze_loss_dominance
  - paths: default
  - _self_

analysis:
  # Split file (under data.scene_dir) to evaluate, e.g. test / val / train.
  split: test
  # Inference device; null selects cuda when available, else cpu.
  device: null
  # Limit the number of evaluated scenes (null = all).
  max_batches: null
  # Report and plot filenames written under run.output_dir.
  report_filename: loss_dominance_summary_test.json
  plot_filename: loss_dominance_distribution_test.png
  plot_dpi: 160
  # Optional path to a loss YAML (e.g. configs/loss/canonical.yaml) whose weights
  # override those from the checkpoint's hparams. Use to preview how a candidate
  # weighting would rebalance the objective. null = use hparams weights as-is.
  loss_config: null

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${run.output_dir}}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
