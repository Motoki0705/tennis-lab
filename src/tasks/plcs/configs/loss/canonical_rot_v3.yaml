# PLCS loss config: balanced rotation+position, for the BRANCHED model (exp4).
# Use with model=multiview_axial_base_branched (num_task_layers > 0) where the
# rotation head has its own axial branch.
#
# Motivation (experiment: feat/plcs-rotation-improvement, exp4):
#   Mapping the no-branch frontier showed a hard pos/rot trade-off:
#     exp1 (pos 2,  ang 1.0): rot 20.4 deg, pos 1.10 m
#     exp2 (pos 30, ang 0.3): rot 52.0 deg, pos 0.30 m
#   The branched model (exp3, same loss as exp1) improved BOTH (rot 13.6 deg,
#   pos 0.82 m) by giving rotation a dedicated readout branch -- but the shared
#   trunk was still rotation-dominated, so position stayed high.
#
#   exp4 keeps the branched model and re-weights toward position (as in exp2)
#   while keeping a strong anti-flip angle signal. Because rotation now has its
#   own branch, lifting position should NOT collapse rotation the way it did in
#   exp2 on the shared trunk. Goal: position ~0.3 m AND rotation <~20 deg.
position_weight: 30.0
rotation_weight: 0.2
angle_weight: 0.6
canonical_pose_weight: 1.0
joint_angle_weight: 0.1
torsion_angle_weight: 0.1
torso_twist_weight: 0.1
bone_length_weight: 0.5
