# PLCS loss config: strong rotation + strong position, for the DETACHED-pose
# branched model (exp6). Use with model=multiview_axial_base_branched_detach.
#
# Motivation (experiments/README.md exp6): with the pose branch detached from
# the shared trunk, up-weighting position can no longer corrupt the rotation
# trunk, so we can run BOTH a strong anti-flip rotation objective (angle 1.0,
# rotation 0.5 -- as in exp1/exp3 that reached ~13.6 deg) AND a strong position
# objective (position 30 -- as in exp2 that reached ~0.30 m). The two no longer
# trade off because they no longer share trunk gradient.
position_weight: 30.0
rotation_weight: 0.5
angle_weight: 1.0
canonical_pose_weight: 1.0
joint_angle_weight: 0.1
torsion_angle_weight: 0.1
torso_twist_weight: 0.1
bone_length_weight: 0.5
