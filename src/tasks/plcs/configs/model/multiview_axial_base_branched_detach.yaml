defaults:
  - _multiview_axial
  - _self_

# Same trunk + branches as multiview_axial_base_branched (8 shared + 2 rot + 2
# pose axial pairs), but the pose (position + canonical) branch is fed a
# stop-gradient copy of the shared trunk output (detach_pose_branch: true).
#
# Motivation (experiments/README.md exp6): exp3 showed the rotation task needs a
# DEEP trunk (13.6 deg with effective 10 rot layers); exp5 (separate 6-layer
# trunks) collapsed rotation (71 deg). exp4 showed up-weighting position
# corrupts the shared trunk and collapses rotation. Detaching the pose branch
# lets the trunk be shaped purely by rotation (preserving exp3's rotation trunk)
# while the easy position task reads detached features and can be up-weighted
# freely. Goal: keep rotation ~13 deg AND recover position to ~0.26 m.
hidden_dim: 512
num_layers: 8
num_task_layers: 2
detach_pose_branch: true
num_heads: 8
rope_dim: 16
