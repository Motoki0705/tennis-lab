# Shared base for reference-camera-conditioned persistent PLCS track queries.
# Unlike the v1 profile, this contract never interprets role_rope_enabled.

name: plcs_track_query_reference

hidden_dim: ???
num_heads: ???
ffn_dim: ???
num_stages: ???
rope_dim: ???

num_queries: 4
num_joints: 17
rope_theta: 10000.0
ffn_type: swiglu
dropout: 0.1
invisible_init_std: 0.02
presence_competition: none

