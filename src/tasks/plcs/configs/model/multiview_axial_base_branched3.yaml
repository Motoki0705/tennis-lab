defaults:
  - _multiview_axial
  - _self_

# exp3 branched architecture with slightly deeper task branches (3 instead of 2)
# to give the pose (position) branch more capacity to extract absolute position
# from the rotation-rich shared trunk, without changing the trunk's rotation
# priority. See experiments/README.md (exp8).
hidden_dim: 512
num_layers: 8
num_task_layers: 3
num_heads: 8
rope_dim: 16
