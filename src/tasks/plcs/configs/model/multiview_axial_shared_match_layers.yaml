defaults:
  - _multiview_axial
  - _self_

# Issue #525 control: SHARED trunk, parameter-matched to the split EX10
# (multiview_axial_base_split_auxpos, 78.06M params) by DEPTH.
#
# EX10 uses two separate 6-layer task trunks (0 shared + 6/6), which doubles the
# trunk parameters relative to a single 6-layer shared trunk (39.3M -> 78.06M).
# This config restores a single shared trunk but raises its depth to 12 layers
# so the total parameter count matches the split model (77.86M, -0.26% vs EX10),
# isolating "separate trunks" from "more parameters". All heads (rotation,
# position, canonical) read the one shared trunk; train with loss=canonical_rot.
hidden_dim: 512
num_layers: 12
num_task_layers: 0
num_heads: 8
rope_dim: 16
