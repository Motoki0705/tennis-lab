# Multi-view PLCS model configuration
# Per-camera tokens: court_m(20) + T * (CLS_po_{m,t}, CLS_ro_{m,t}, player_{m,t}[17])
# Uses 3-axis interleaved MROPE over (time, camera, type).

name: plcs_multiview

io:
  input_profile: multiview
  strict_input: true

# Architecture
hidden_dim: 512
num_layers: 12
num_heads: 8
ffn_dim: null        # Defaults to 8/3 * hidden_dim (rounded to 64)
ffn_type: swiglu
dropout: 0.1
invisible_init_std: 0.02

# Limits
max_views: 6
max_seq_len: 10240

# 3-axis interleaved MROPE
rope_dim: null            # Defaults to head_dim; must be even
rope_theta_time: 10000.0
rope_theta_camera: 1000.0
rope_theta_type: 1000.0
predict_canonical_pose: false

# Model type
architecture: multiview
