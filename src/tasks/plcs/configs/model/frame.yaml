## PLCS frame model configuration
## Decoder-only Transformer with MHA (+ optional RoPE) + SDPA

name: plcs

io:
  input_profile: frame
  strict_input: true

hidden_dim: 256
num_layers: 4
num_heads: 8
ffn_dim: null        # Defaults to 8/3 * hidden_dim (rounded to 64)
dropout: 0.1
invisible_init_std: 0.02

# Token identity / robustness settings
num_register_tokens: 4
use_kp_id_embedding: true
use_rope: false

# RoPE settings
rope_dim: null       # Defaults to head_dim (hidden_dim / num_heads)
rope_theta: 10000.0

# YaRN (optional long-context extrapolation for RoPE)
# Set to null to disable.
yarn: null

# MoE (optional; applied to all blocks)
use_moe: true
# MoEConfig fields (src/utils/models/components/moe.py:MoEConfig)
# Note: `dim` is always `hidden_dim` and is not configured here.
# `moe_inter_dim` should be set explicitly when use_moe=true.
moe_config:
  moe_inter_dim: 704
  n_routed_experts: 8
  n_shared_experts: 2
  n_activated_experts: 2
  n_expert_groups: 1
  n_limited_groups: 1
  score_func: softmax
  route_scale: 1.0
