## PLCS frame model configuration
## Decoder-only Transformer with MHA (+ optional RoPE) + SDPA

name: plcs

io:
  input_profile: frame
  strict_input: true

hidden_dim: 256
num_layers: 4
num_heads: 8
ffn_dim: 704         # Matches the former wide FFN width
ffn_type: swiglu
dropout: 0.1
invisible_init_std: 0.02

# Token identity / robustness settings
num_register_tokens: 4
use_kp_id_embedding: true
use_rope: false

# RoPE settings
rope_dim: null       # Defaults to head_dim (hidden_dim / num_heads)
rope_theta: 10000.0
