defaults:
  - _multiview_axial
  - _self_

# Fully-separated task trunks: no shared axial layers (num_layers=0), each task
# (rotation vs pose=position+canonical) gets its own 6-deep axial stack.
# Total axial depth (6+6=12 pairs) matches the branched model (8 shared + 2+2),
# so this isolates "separate trunk" vs "shared trunk + small branch".
#
# Motivation (experiments/README.md exp5): exp4 showed branches alone do NOT
# break the pos/rot tradeoff -- the SHARED trunk is the bottleneck. Whichever
# task dominates the gradient owns the trunk features; the hard task (rotation)
# cannot recover orientation from a position-cleaned trunk. Fully separate
# trunks remove the competition entirely.
hidden_dim: 512
num_layers: 0
num_task_layers: 6
num_heads: 8
rope_dim: 16
