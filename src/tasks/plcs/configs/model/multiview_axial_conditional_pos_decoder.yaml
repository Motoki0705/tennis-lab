# Issue #559 architecture 2: Conditional Pos Decoder.
#
# Uses the S=4/H=4 balanced allocation, then inserts a small position decoder
# that conditions learnable per-frame position queries on shared+rotation tokens.
defaults:
  - _multiview_axial_conditional_pos
  - _self_

hidden_dim: 512
num_heads: 8
rope_dim: 16
num_layers: 4
num_task_layers: 4

pos_context:
  architecture: conditional_pos_decoder
  source: both
  decoder_layers: 2
  gate_init_bias: -4.0
  query_init_std: 0.02
