# Private base for the separate-trunk axial PLCS model
# (PLCSMultiViewAxialSplitModel). Presets compose from this via defaults and
# override hidden_dim / depth. See plcs_multiview_axial_split_model.py and
# issue #518 (exp10) for the architecture rationale.
defaults:
  - _multiview_axial
  - _self_

name: plcs_multiview_axial_split

# 0 shared layers + a 6-deep stack per task trunk (rotation / pose).
num_layers: 0
num_task_layers: 6
rot_num_task_layers: 6
pose_num_task_layers: 6
# Rotation trunk carries the canonical-pose head (geometry regularisation) and
# an auxiliary position head (teaches multiview triangulation); the dedicated
# pose trunk produces the precise final position.
canonical_on_rotation_branch: true
aux_position_on_rotation_branch: true
detach_pose_branch: false
