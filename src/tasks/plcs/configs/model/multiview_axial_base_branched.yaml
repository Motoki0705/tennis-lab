defaults:
  - _multiview_axial
  - _self_

# Same trunk as multiview_axial_base, plus task-specific axial branches.
# num_task_layers > 0 splits the head readout into a rotation branch and a
# pose (position + canonical) branch so the strong rotation gradient does not
# corrupt the position-clean feature on a single shared trunk. See
# experiments/README.md (exp3) for motivation: scalar loss reweighting could
# only trade position vs rotation; the two compete for shared-trunk capacity.
hidden_dim: 512
num_layers: 8
num_task_layers: 2
num_heads: 8
rope_dim: 16
