defaults:
  - _multiview_axial
  - _self_

# Issue #525 reference: single 6-layer SHARED trunk (39.3M params), i.e. half the
# parameters of the split EX10 (78.06M = two 6-layer trunks). This is the
# "before doubling" point: the param-matched shared controls
# (multiview_axial_shared_match_{layers,dim}) grow this to ~78M by depth/width.
# Establishes the shared-trunk baseline at its native parameter count. All heads
# read the one shared trunk; train with loss=canonical_rot.
hidden_dim: 512
num_layers: 6
num_task_layers: 0
num_heads: 8
rope_dim: 16
