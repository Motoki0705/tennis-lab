  - _self_

# Issue #525 control: SHARED trunk, parameter-matched to the split EX10
# (multiview_axial_base_split_auxpos, 78.06M params) by WIDTH.
#
# Companion to multiview_axial_shared_match_layers (depth-matched). Here the
# shared trunk keeps the single-trunk depth (6 layers) but widens hidden_dim
# 512 -> 728 so the total parameter count matches the split model (78.97M,
# +1.17% vs EX10). head_dim = 728 / 8 = 91 (> rope_dim 16). Together the two
# controls show whether EX10's win comes from the separate-trunk architecture
# or simply from ~2x parameters (added as depth vs width). Train with
# loss=canonical_rot.
hidden_dim: 728
num_layers: 6
num_task_layers: 0
num_heads: 8
rope_dim: 16
