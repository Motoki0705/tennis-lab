# Axial multi-view PLCS model configuration
# Uses one court-player token per (camera, time) element and alternates
# camera-wise and time-wise self-attention.

name: plcs_multiview_axial

io:
  input_profile: multiview
  strict_input: true

hidden_dim: 512
num_layers: 12
num_heads: 8
ffn_dim: null
ffn_type: swiglu
dropout: 0.1
invisible_init_std: 0.02

max_views: 6
max_seq_len: 10240

rope_dim: null
rope_theta: 10000.0
rope_theta_time: 1000.0
rope_theta_camera: 1000.0
predict_canonical_pose: false

architecture: multiview_axial
