scene_dir: data/plcs
batch_size: 128
num_workers: 4
pin_memory: true
val_split: 0.1
test_split: 0.1

mode: frame
camera_mode: random

# Scene sampler: none | scene | mixed | chunked
scene_sampler_mode: chunked
scenes_per_batch: 32
chunk_max_scenes: 64

augmentation:
  keypoint_noise_std: 0.0001
  visibility_drop_prob: 0.05
