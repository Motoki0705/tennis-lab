scene_dir: data/plcs

# Number of court keypoints to use (first N from canonical order; default: 20)
# num_court_kp: 20

batch_size: 128
num_workers: 4
pin_memory: true

mode: frame
camera_mode: random

# Temporal/view sampling (1 frame, 1 camera per sample)
seq_len_range: [1, 1]
num_views_range: [1, 1]

# Scene sampler: none | scene | mixed | chunked
scene_sampler: true
scenes_per_batch: 32
chunk_max_scenes: 64

augmentation:
  keypoint_noise_std: 0.0001
  visibility_drop_prob: 0.05
