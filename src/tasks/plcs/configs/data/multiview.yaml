scene_dir: data/plcs

# Number of court keypoints to use (first N from canonical order)
num_court_kp: 20

batch_size: 4
num_workers: 4
pin_memory: true

mode: multiview_sequence

# Scene sampler: none | scene | mixed | chunked
scene_sampler: true
scenes_per_batch: 8
chunk_max_scenes: 64

# Multi-view sampling
min_cameras: 2
num_views_range: [1, 8]  # [min, max]

# Sequence sampling
seq_len_range: [64, 512]  # [min, max]

augmentation:
  keypoint_noise_std: 0.0001
  visibility_drop_prob: 0.05
