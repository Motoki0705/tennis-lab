# @package _global_
# Internal component composed only by train_triangulation_residual.yaml.

data:
  scene_dir: plcs/single_object_camera_view_v2
  batch_size: 32
  num_workers: 6
  pin_memory: true
  sequence_length: 64
  target_fps: 30.0
  min_views: 2
  max_views: 6
  train_limit: 0
  val_limit: 0
  test_limit: 0
  cache_scenes: 128
initializer:
  min_score: 0.3
  refinement_steps: 5
augmentation:
  observation_sigma_px: 2.0
  temporal_sigma_px: 1.0
  view_bias_px: 1.5
  confidence_noise: 0.12
  outlier_probability: 0.025
  outlier_sigma_px: 20.0
  dropout_probability: 0.08
  burst_probability: 0.3
  burst_max_frames: 16
  time_shift_probability: 0.2
  time_shift_max_frames: 2
  radial_std: 0.025
  focal_scale_min: 0.33
  focal_scale_max: 1.3
  clean_probability: 0.15
  hard_probability: 0.2
  camera_preset: four_corners_front_pair
  evaluation_views: 3
  true_camera_position_jitter_m: 0.75
  true_camera_height_jitter_m: 0.5
  calibration_min_points: 6
  court_noise_px: 2.0
  court_bias_px: 1.5
  court_dropout_probability: 0.05
  court_outlier_probability: 0.02
  court_outlier_sigma_px: 12.0
  persistent_rate_per_view_second: 0.08
  persistent_min_seconds: 0.12
  persistent_max_seconds: 1.2
  persistent_offset_scale: 1.0
  persistent_high_confidence_probability: 0.25
  error_mode: mixed
