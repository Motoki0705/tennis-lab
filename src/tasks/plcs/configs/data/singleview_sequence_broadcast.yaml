defaults:
  - _augmentation
  - _singleview
  - _self_

# Fixed single-object scenes rendered with the two-camera broadcast layout.
# The sequence model consumes one selected camera per sample.
backend: default
scene_dir: plcs/single_object_broadcast
adapter_camera_index: 0
num_court_kp: 14

num_workers: 4
pin_memory: true

mode: sequence
seq_stride: 128
seq_len_range: [64, 512]
