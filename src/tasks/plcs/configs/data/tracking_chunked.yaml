defaults:
  - _augmentation
  - _multiview
  - _observation_tracking
  - _chunked
  - _self_

scene_dir: plcs/multi_object
adapter_camera_index: 0
batch_size: 8
num_workers: 4
pin_memory: true

seq_len_range: [512, 1024]

# Stable scene-artifact identity used only by validation/test.
evaluation_reference_camera_id: camera_1

lifecycle:
  pack_to_query_slots: true
  min_reuse_gap_frames: 4

chunk:
  scenes_per_chunk: 1000
  epochs_per_chunk: 20
  prefetch_chunks: 5
  chunks_dir: plcs/multi_object/chunks
  generation_workers: 16
