# Chunked multi-view data configuration
# Val/test are fixed from scene_dir; train chunks are generated in the background.
backend: "chunked"
scene_dir: "data/plcs"

# Number of court keypoints to use (first N from canonical order)
num_court_kp: 20

# DataLoader settings
batch_size: 8
num_workers: 4
pin_memory: true

mode: multiview_sequence

# Multi-view sampling
min_cameras: 2
num_views_range: [3, 6]

# Sequence sampling
seq_len_range: [64, 512]

# Generator device for background scene synthesis
generator_device: "cpu"

# Chunk settings
chunk:
  scenes_per_chunk: 1000
  epochs_per_chunk: 10
  prefetch_chunks: 3
  chunks_dir: "data/plcs/chunks"
  generation_workers: 8  # parallel scene generation workers (must be >= 1)

augmentation:
  keypoint_noise_std: 0.0001
  visibility_drop_prob: 0.05