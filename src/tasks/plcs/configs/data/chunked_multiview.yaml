backend: "chunked"
scene_dir: data/plcs

# Number of court keypoints to use (first N from canonical order)
num_court_kp: 20

batch_size: 4
num_workers: 4
pin_memory: true

mode: multiview_sequence

# Multi-view sampling
min_cameras: 2
num_views_range: [1, 8]

# Sequence sampling
seq_len_range: [64, 512]

generator_device: auto

chunk:
  scenes_per_chunk: 1000
  epochs_per_chunk: 3
  prefetch_chunks: 1
  chunks_dir: data/plcs/chunks
  generation_workers: 0
  max_attempt_factor: 10

augmentation:
  keypoint_noise_std: 0.0001
  visibility_drop_prob: 0.05