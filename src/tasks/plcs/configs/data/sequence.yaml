scene_dir: data/plcs
batch_size: 8
num_workers: 4
pin_memory: true
val_split: 0.1
test_split: 0.1

mode: sequence
camera_mode: random

# Scene sampler: none | scene | mixed | chunked
scene_sampler_mode: chunked
scenes_per_batch: 8
chunk_max_scenes: 64

# Sequence sampling
seq_stride: 128
seq_len_range: [64, 512]  # [min, max]

augmentation:
  keypoint_noise_std: 0.0001
  visibility_drop_prob: 0.05
