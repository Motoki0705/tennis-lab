defaults:
  - _augmentation
  - _multiview
  - _self_

backend: default
scene_dir: plcs/multi_object
adapter_camera_index: 0
batch_size: 8
num_workers: 4
pin_memory: true

seq_len_range: [512, 1024]

# Stable scene-artifact identity used only by validation/test. Training uses
# independent worker-seeded reference selection.
evaluation_reference_camera_id: camera_1

lifecycle:
  pack_to_query_slots: true
  min_reuse_gap_frames: 4
  randomize_slots_train: true
