defaults:
  - _mcmc
  - _self_

# ---- Trainer (Lightning Trainer settings) ----
trainer:
  max_epochs: 200
  gradient_clip_val: 1.0
  deterministic: true
  precision: "bf16-mixed"
  log_every_n_steps: 50
  check_val_every_n_epoch: 3
  # Effective batch = batch_size * accumulate_grad_batches. Lets VRAM-bound large
  # models keep a target effective batch on small GPUs (e.g. 16GB WSL2). 1 = off.
  accumulate_grad_batches: 1
  reload_dataloaders_every_n_epochs: 0
  enable_progress_bar: true
  enable_model_summary: true
  benchmark: false

# ---- Optimizer / schedule (LightningModule references) ----
learning_rate: 1.0e-4
weight_decay: 1.0e-5
warmup_steps: 1000
warmup_epochs: null
min_lr: 1.0e-6
steps_per_epoch: null
optimizer:
  betas: [0.9, 0.999]

matmul_precision: high
allow_tf32: true

# ---- Callbacks (BaseTrainingRunner references) ----
checkpoint:
  enabled: true
  filename: "plcs-{epoch:02d}"
  monitor: val/pos_error_m
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: val/pos_error_m
  mode: min
  patience: 10
  min_delta: 2.0e-5
  check_on_train_epoch_end: false

lr_monitor:
  enabled: true
  interval: step

# ---- Qualitative validation logging ----
qualitative_logging:
  enabled: true
  every_n_epochs: 10
  num_samples: 4
  selection_mode: random
  selected_indices: null

gan:
  enabled: false
  target_weight: 0.0
  warmup_epochs: 1
  generator_gradient_clip_val: null
  discriminator_gradient_clip_val: null
  transition:
    start_epoch: 0
