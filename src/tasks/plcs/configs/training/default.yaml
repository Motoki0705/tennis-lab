defaults:
  - _mcmc
  - _self_

# ---- Trainer (Lightning Trainer settings) ----
trainer:
  max_epochs: 200
  gradient_clip_val: 1.0
  deterministic: true
  precision: "bf16-mixed"
  log_every_n_steps: 50
  check_val_every_n_epoch: 3

# ---- Optimizer / schedule (LightningModule references) ----
learning_rate: 1.0e-4
weight_decay: 1.0e-5
warmup_steps: 1000
scheduler: cosine
min_lr: 1.0e-6

# ---- Callbacks (BaseTrainingRunner references) ----
checkpoint:
  enabled: true
  filename: "plcs-{epoch:02d}"
  monitor: val/pos_error_m
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: val/pos_error_m
  mode: min
  patience: 10
  min_delta: 2.0e-5
  check_on_train_epoch_end: false

lr_monitor:
  enabled: true
  interval: step

# ---- Qualitative validation logging ----
qualitative_logging:
  enabled: true
  every_n_epochs: 10
  num_samples: 4
