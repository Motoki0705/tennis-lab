# ---- Trainer (Lightning Trainer settings) ----
trainer:
  max_epochs: 100
  gradient_clip_val: 1.0
  deterministic: true
  precision: "16-mixed"
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  benchmark: null

# ---- Optimizer / schedule (LightningModule references) ----
learning_rate: 1.0e-5
weight_decay: 1.0e-5
warmup_steps: 1000
warmup_epochs: null
scheduler: cosine
min_lr: 1.0e-6
matmul_precision: high
allow_tf32: true
steps_per_epoch: null
num_samples_per_epoch: null
max_epochs: ${training.trainer.max_epochs}
optimizer:
  betas: null

# ---- Callbacks (BaseTrainingRunner references) ----
checkpoint:
  enabled: true
  filename: "plcs-{epoch:02d}"
  monitor: train/epoch_position_error_m
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: train/epoch_position_error_m
  mode: min
  patience: 20
  min_delta: 2.0e-5
  check_on_train_epoch_end: false

lr_monitor:
  enabled: true
  interval: step
