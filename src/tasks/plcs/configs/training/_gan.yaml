defaults:
  - /model@_model: multiview_axial_base
  - _self_

gan:
  enabled: false
  target_weight: 0.1
  warmup_epochs: 5
  generator_gradient_clip_val: 1.0
  discriminator_gradient_clip_val: 1.0

  transition:
    # Deterministic epoch-based transition: pure supervised for epochs 0..99,
    # then the adversarial phase begins at epoch 100 (default max_epochs=200),
    # ramping the GAN weight over `warmup_epochs`.
    start_epoch: 100

  discriminator:
    name: pose_sequence_transformer
    hidden_dim: ???
    num_layers: ???
    num_heads: 4
    ffn_dim: 256
    ffn_type: swiglu
    dropout: 0.1
    rope_dim: null
    rope_theta: 10000.0
    max_seq_len: ${_model.max_seq_len}
    invalid_init_std: 0.02
    cls_init_std: 0.02
