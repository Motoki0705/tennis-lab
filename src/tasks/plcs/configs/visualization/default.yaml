mode: visualize  # visualize | predict
scene_path: data/plcs/scenes/scene_000000
# Single-view camera index used when cameras is unset.
camera: 0
# Optional multi-camera selector: "all" or comma-separated "0,1,2"
cameras: null
animation_view: 3d  # 3d | 2d_topdown | camera
fps: 30
save: assets/plcs/gt.gif           # Optional output file for comparison animation (e.g., .mp4, .gif)
info: false
checkpoint: checkpoints/plcs/frame/last.ckpt
  

# Shared scene style for animation_view=3d (parsed by
# src/tasks/base/visualization/style.py; 2D/camera views ignore it).
style:
  theme: dark          # light | dark
  show_shadow: true
  show_trail: true
  trail_length: 60
  show_hud: true
  show_minimap: true

# Shared 3D viewpoint (src/utils/rendering/camera_view.py). Unrelated to the
# input-camera selector `camera`/`cameras` above.
view_3d:
  preset: broadcast    # broadcast | side | top | corner | behind_far
  mode: static         # static | orbit | keyframes
