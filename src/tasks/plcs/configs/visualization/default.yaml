mode: visualize  # visualize | predict
scene_path: data/plcs/scenes/scene_000000
# Single-view camera index used when cameras is unset.
camera: 0
# Optional multi-camera selector: "all" or comma-separated "0,1,2"
cameras: null
animation_view: 3d  # 3d | 2d_topdown | camera
# Separate from `camera`/`cameras`: selects the Matplotlib 3D viewpoint.
# mode: default | look_at | scene_camera. Other fields use shared typed defaults.
view_3d:
  mode: default
  zoom: 1.3
fps: 30
save: assets/plcs/gt.gif           # Optional output file for comparison animation (e.g., .mp4, .gif)
info: false
checkpoint: checkpoints/plcs/frame/last.ckpt
