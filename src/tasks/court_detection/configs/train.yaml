defaults:
  - paths: default
  - data: default
  - model: dinov3_dpt
  - loss: pose
  - training: default
  - run: train
  - render_style: default
  - data/source@mixed.sources.tennis_court_detector: tennis_court_detector
  - override data/source: synthetic_court
  - override data/processing: all
  - override data/augmentation: pose_safe
  - _self_

mixed:
  sources:
    synthetic_court: ${data.source}
  train_batch_counts:
    synthetic_court: 4
    tennis_court_detector: 4

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${run.output_dir},hydra}
  output_subdir: null
  job:
    chdir: false
