defaults:
  - data: court_kp
  - _self_

hydra:
  run:
    dir: ${preview.output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false

preview:
  split: train
  sample_indices: [0, 8, 16]
  max_samples: 3
  ratios: [0.003, 0.006, 0.012, 0.024]
  output_dir: outputs/court_detection/heatmap_preview
  layout:
    tile_gap: 12
    header_height: 30
    text_scale: 0.55
    text_thickness: 1
    background_rgb: [24, 24, 24]
  draw:
    gt_radius: 4
    argmax_radius: 2
    thickness: 2
