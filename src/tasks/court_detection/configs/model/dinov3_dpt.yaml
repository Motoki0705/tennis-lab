# One architecture; numeric settings also reconstruct the saved production checkpoint.
name: court_hierarchical
in_channels: 3
encoder:
  name: dinov3
  backbone_name: dinov3_vitb16
  repository_path: dinov3
  checkpoint_path: dinov3/checkpoints/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  strict: true
  train_mode: frozen
  last_n_blocks: 0
  out_indices:
  - 2
  - 5
  - 8
  - 11
  layer_mode: uniform
  lora:
    enabled: false
    rank: 8
    alpha: 16.0
    dropout: 0.0
    target_modules:
    - qkv
    - proj
    - fc1
    - fc2
transformer_encoder:
  name: transformer
  enabled: true
  dim: 768
  depth: 8
  num_heads: 12
  head_dim: 64
  ffn_dim: 2048
  rope_dim: 64
  rope_theta: 10000.0
  dropout: 0.0
  attention_type: mha
  n_kv_heads: null
  ffn_type: swiglu
decoder:
  name: dpt
  size: large
  channels: 512
  reassemble_factors:
  - 4.0
  - 2.0
  - 1.0
  - 0.5
dense_head:
  name: residual
  normalization_groups: 32
  kp:
    hidden_channels: 256
    depth: 2
  seg:
    hidden_channels: 256
    depth: 2
  line:
    hidden_channels: 256
    depth: 2
  semantic_line:
    hidden_channels: 256
    depth: 2
