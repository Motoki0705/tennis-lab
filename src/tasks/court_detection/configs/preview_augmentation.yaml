defaults:
  - paths: default
  - data: default
  - _self_

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${preview.output_dir},${now:%Y-%m-%d_%H-%M-%S}}
  output_subdir: null
  job:
    chdir: false

preview:
  split: train
  require_pose: false
  sample_indices: []
  max_samples: 4
  num_augmented: 3
  seed: 42
  output_dir: court_detection/augmentation_preview
  draw:
    mask_alpha: 0.45
    heatmap_alpha: 0.55
  layout:
    tile_gap: 12
    header_height: 30
    text_scale: 0.55
    text_thickness: 1
    background_rgb: [24, 24, 24]
