# Default (strong) train-time augmentation for court detection.
# Select with `data/augmentation=default` (active by default).
train_scales: [288]
val_short_side: 288
crop_scale: [0.2, 1.0]
crop_ratio: [0.5, 2.0]
hflip_prob: 0.7
affine_degrees: 25.0
affine_translate: [0.18, 0.18]
affine_scale: [0.65, 1.5]
affine_shear: 18.0
perspective_distortion: 0.25
perspective_prob: 0.6
color_jitter: [0.5, 0.5, 0.5, 0.2]
gaussian_blur_kernel: [3, 5, 7, 9]
gaussian_blur_sigma: [0.1, 3.0]
gaussian_blur_prob: 0.5
