# Light augmentation: milder geometric/photometric perturbations.
# Select with `data/augmentation=light`.
train_scales: [288]
val_short_side: 288
crop_scale: [0.6, 1.0]
crop_ratio: [0.75, 1.333]
hflip_prob: 0.5
affine_degrees: 8.0
affine_translate: [0.06, 0.06]
affine_scale: [0.9, 1.1]
affine_shear: 5.0
perspective_distortion: 0.1
perspective_prob: 0.3
color_jitter: [0.2, 0.2, 0.2, 0.05]
gaussian_blur_kernel: [3, 5]
gaussian_blur_sigma: [0.1, 1.5]
gaussian_blur_prob: 0.2
# See augmentation/default.yaml for the min_visible_kp mechanism.
min_visible_kp: 12
visibility_max_retries: 10
preserve_fx_fy: false
canvas_size: null
