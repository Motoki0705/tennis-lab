# ---- Trainer (Lightning Trainer settings) ----
trainer:
  max_epochs: 100
  gradient_clip_val: 1.0
  deterministic: true
  precision: null
  log_every_n_steps: 10
  check_val_every_n_epoch: 1

# ---- Optimizer / schedule (LightningModule references) ----
learning_rate: 1.0e-4
weight_decay: 1.0e-4
warmup_epochs: 5

optimizer:
  name: adamw
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  min_lr: 1.0e-6

# ---- Callbacks (BaseTrainingRunner references) ----
checkpoint:
  enabled: true
  filename: "epoch_{epoch:03d}_pck_{val/pck:.4f}"
  monitor: val/pck
  mode: max
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: val/loss
  mode: min
  patience: 20
  min_delta: null

lr_monitor:
  enabled: true
  interval: epoch
