trainer:
  max_epochs: 100
  gradient_clip_val: 1.0
  deterministic: warn
  precision: bf16-mixed
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  reload_dataloaders_every_n_epochs: 0
  enable_progress_bar: true
  enable_model_summary: true
  benchmark: false

learning_rate: 1.0e-3
weight_decay: 1.0e-4
warmup_epochs: 5
warmup_steps: null
min_lr: 1.0e-6
steps_per_epoch: null

optimizer:
  name: adamw
  betas: [0.9, 0.999]

matmul_precision: high
allow_tf32: true

checkpoint:
  enabled: true
  filename: "court-detection-{epoch:02d}"
  monitor: val/loss
  mode: min
  save_top_k: 2
  save_last: true

early_stopping:
  enabled: true
  monitor: val/loss
  mode: min
  patience: 10
  min_delta: 1.0e-5
  check_on_train_epoch_end: false

lr_monitor:
  enabled: true
  interval: epoch

# ---- Qualitative validation logging ----
qualitative_logging:
  enabled: true
  every_n_epochs: 1
  num_samples: 4
  selection_mode: random
  selected_indices: null
  fps: 6

gan:
  enabled: false
  target_weight: 0.0
  warmup_epochs: 1
  generator_gradient_clip_val: null
  discriminator_gradient_clip_val: null
  transition:
    start_epoch: 0
