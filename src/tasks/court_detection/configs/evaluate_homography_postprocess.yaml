defaults:
  - data: court_kp
  - model: hierarchical
  - loss: kp
  - _self_

hydra:
  run:
    dir: ${eval.output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false

data:
  batch_size: 8
  num_workers: 0
  pin_memory: false
  augmentation:
    val_short_side: 512

model:
  num_classes: 14

eval:
  checkpoint: /home/kamimura/projects/tennis-lab/outputs/court_detection/kp/logs/version_0/checkpoints/court-detection-epoch=17.ckpt
  output_dir: outputs/court_detection/homography_postprocess_eval
  output_json: ${eval.output_dir}/metrics.json
  val_max_samples: 80
  clip_video_path: data/samples/tennis_clip.mp4
  clip_gt_path: /home/kamimura/projects/tennis-lab/outputs/tennis_scene/baseline/court_kp_result.json
  clip_frame_indices: [0, 10, 30, 60]
  postprocess:
    min_score: 0.3
    ransac_reproj_threshold: 30.0
