defaults:
  - paths: default
  - query_consistency_ablation@consistency_ablation.encoder_scaling: encoder_scaling
  - query_consistency_ablation@consistency_ablation.decoder_scaling: decoder_scaling
  - query_consistency_ablation@consistency_ablation.consistency_ablation: consistency_ablation
  - _self_

consistency_ablation:
  output_path: court_detection/query_consistency_ablation/manifest.json
  python_executable: /home/kamimura/projects/tennis-lab/.venv/bin/python
  train_module: src.tasks.court_detection.scripts.train
  profile_module: src.tasks.court_detection.scripts.profile_query_model
  seeds: [42, 43, 44]
  epochs: 15
  input:
    height: 256
    width: 256
  batch_size: 8
  selected:
    encoder_depth: null
    decoder_family: null
    decoder_size: null
  composition:
    source: synthetic_court
    keypoint_court_scope: target_court
    processing: all
    augmentation: pose_safe
    model: query_encoder_base
    task_encoder: query_base
    heads: query_base
    backbone: query_dinov3
    backbone_checkpoint: dinov3/checkpoints/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    backbone_train_mode: frozen
    derived_target_root: court_detection/derived_targets_issue790_v3
    workspace_root: issue-779-court-query-v3-attempt9/synthetic_data_generation/scenes
  optimizer:
    name: adamw
    learning_rate: 0.001
    weight_decay: 0.0001
    betas: [0.9, 0.999]
  direct_weights:
    kp: 1.0
    line: 1.0
    seg: 1.0
    translation: 1.0
    rotation: 1.0
    focal: 1.0
  auxiliary:
    weight: 1.0
    temperature: 1.0
    huber_delta: 0.01
    min_depth_m: 0.1
    depth_scale_m: 1.0
    cheirality_weight: 0.1
    warmup_fraction: 0.1

paths:
  data_root: /home/kamimura/projects/tennis-lab/data
  external_asset_root: /home/kamimura/projects/tennis-lab/third_party

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},court_detection/query_consistency_ablation/hydra/manifest}
  output_subdir: null
  job:
    chdir: false
