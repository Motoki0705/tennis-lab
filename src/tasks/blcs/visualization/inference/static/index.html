<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLCS Inference</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="workspace">
      <aside class="browser" aria-label="シーン選択">
        <header class="browser-head">
          <p class="brand"><span class="brand-mark" aria-hidden="true">◉</span>BLCS <b>INFERENCE</b></p>
          <p class="brand-sub">物理コート座標 / メートル (+Z up)</p>
        </header>
        <div class="browser-body">
          <section class="panel" aria-labelledby="ckpt-head">
            <h2 class="panel-head" id="ckpt-head">
              <span>チェックポイント</span>
              <span class="panel-count" id="ckpt-count" role="status"></span>
            </h2>
            <div class="search">
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21 21-4.34-4.34" />
                <circle cx="11" cy="11" r="8" />
              </svg>
              <input
                id="ckpt-query"
                type="search"
                placeholder="チェックポイントを検索"
                aria-label="チェックポイントを検索"
                autocomplete="off"
                spellcheck="false"
              />
              <button id="ckpt-query-clear" class="search-clear" type="button" aria-label="検索を消去" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18 6 6 18" />
                  <path d="m6 6 12 12" />
                </svg>
              </button>
            </div>
            <button id="ckpt-none" class="clear-ckpt" type="button" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <path d="m15 9-6 6" />
              </svg>
              <span>ckpt 指定なし</span>
            </button>
            <div id="ckpt-list" class="ckpt-list"></div>
          </section>

          <section class="panel" aria-labelledby="form-head">
            <h2 class="panel-head" id="form-head" title="チェックポイントに応じて選択できる形式が変わります">
              <span>シーン形式</span>
              <span class="panel-count" id="form-count" role="status"></span>
            </h2>
            <div id="form-list" class="form-list"></div>
          </section>

          <section class="panel grow" aria-labelledby="scene-head">
            <h2 class="panel-head" id="scene-head">
              <span>シーン</span>
              <span class="panel-count" id="scene-count" role="status"></span>
            </h2>
            <div class="split" id="split" role="group" aria-label="スプリット">
              <button type="button" data-split="all">all</button>
              <button type="button" data-split="train">train</button>
              <button type="button" data-split="val">val</button>
              <button type="button" data-split="test" aria-pressed="true">test</button>
            </div>
            <div class="search">
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21 21-4.34-4.34" />
                <circle cx="11" cy="11" r="8" />
              </svg>
              <input
                id="scene-query"
                type="search"
                placeholder="シーンを検索"
                aria-label="シーンを検索"
                autocomplete="off"
                spellcheck="false"
              />
              <button id="scene-query-clear" class="search-clear" type="button" aria-label="検索を消去" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18 6 6 18" />
                  <path d="m6 6 12 12" />
                </svg>
              </button>
            </div>
            <div id="scene-list" class="scene-list"></div>
            <button id="scene-more" class="more" type="button" hidden>さらに読み込む</button>
          </section>
        </div>
      </aside>

      <section class="viewport" aria-label="コート3Dビュー">
        <header class="viewport-head">
          <div class="title-block">
            <span class="eyebrow" id="scene-form-label">シーン未選択</span>
            <h1 id="scene-title">シーンを選択してください</h1>
          </div>
          <div class="chips" id="scene-chips"></div>
          <div class="view-actions" role="group" aria-label="視点プリセット">
            <button id="toggle-gt" class="icon-toggle" type="button" aria-pressed="true" title="GT を表示">
              <i class="swatch gt"></i>
            </button>
            <button id="toggle-pred" class="icon-toggle" type="button" aria-pressed="true" title="推論を表示">
              <i class="swatch pred"></i>
            </button>
            <button id="toggle-trails" class="icon-toggle" type="button" aria-pressed="true" title="軌跡を表示">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="6" cy="19" r="3" />
                <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
                <circle cx="18" cy="5" r="3" />
              </svg>
            </button>
            <div class="segmented" role="group" aria-label="視点プリセット">
              <button id="view-broadcast" type="button" data-preset="broadcast" title="放送視点" aria-pressed="true">放送</button>
              <button id="view-side" type="button" data-preset="side" title="サイド視点" aria-pressed="false">横</button>
              <button id="view-overhead" type="button" data-preset="overhead" title="俯瞰視点" aria-pressed="false">俯瞰</button>
            </div>
            <button id="view-reset" class="icon-button" type="button" title="視点を戻す">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
            </button>
          </div>
        </header>
        <div class="stage">
          <canvas
            id="view"
            tabindex="0"
            aria-label="ドラッグで回転、Shift＋ドラッグで移動、ホイールで拡大"
          ></canvas>
          <div class="legend" aria-hidden="true">
            <span><i class="swatch gt"></i>GT</span>
            <span><i class="swatch pred"></i>推論</span>
            <span class="legend-divider"></span>
            <span><i class="swatch axis-x"></i>X</span>
            <span><i class="swatch axis-y"></i>Y</span>
            <span><i class="swatch axis-z"></i>Z</span>
          </div>
          <dl class="hud" id="hud" hidden>
            <div><dt>frame</dt><dd id="hud-frame">–</dd></div>
            <div><dt>time</dt><dd id="hud-time">–</dd></div>
            <div><dt>device</dt><dd id="hud-device">–</dd></div>
            <div><dt>window</dt><dd id="hud-window">–</dd></div>
            <div><dt>mean err</dt><dd id="hud-error">–</dd></div>
          </dl>
          <p class="overlay" id="status" role="status" hidden></p>
          <div class="transport" id="transport" hidden>
            <button id="to-start" class="icon-button" type="button" title="先頭へ" aria-label="先頭へ">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m11 17-5-5 5-5" />
                <path d="m18 17-5-5 5-5" />
              </svg>
            </button>
            <button id="prev" class="icon-button" type="button" title="1フレーム戻る" aria-label="1フレーム戻る">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <button id="play" class="icon-button primary" type="button" title="再生 / 一時停止" aria-label="再生 / 一時停止">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" fill="currentColor" stroke="none" />
              </svg>
            </button>
            <button id="next" class="icon-button" type="button" title="1フレーム進む" aria-label="1フレーム進む">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
            <button id="to-end" class="icon-button" type="button" title="末尾へ" aria-label="末尾へ">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 17 5-5-5-5" />
                <path d="m13 17 5-5-5-5" />
              </svg>
            </button>
            <input
              id="scrub"
              class="scrub"
              type="range"
              min="0"
              max="0"
              step="1"
              value="0"
              aria-label="再生フレーム"
            />
            <span class="clock" id="clock">0 / 0</span>
            <div class="speeds" role="group" aria-label="再生速度">
              <button type="button" data-speed="0.25">0.25×</button>
              <button type="button" data-speed="0.5">0.5×</button>
              <button type="button" data-speed="1" aria-pressed="true">1×</button>
              <button type="button" data-speed="2">2×</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="inspector" aria-label="推論設定">
        <div class="inspector-body">
          <section class="panel" aria-labelledby="insp-ckpt-head">
            <h2 class="panel-head" id="insp-ckpt-head"><span>チェックポイント</span></h2>
            <dl class="summary" id="ckpt-summary">
              <div><dt>状態</dt><dd id="ckpt-summary-state">指定なし</dd></div>
            </dl>
            <p class="notice" id="ckpt-notice" role="status" hidden></p>
          </section>

          <section class="panel" aria-labelledby="insp-run-head">
            <h2 class="panel-head" id="insp-run-head"><span>推論設定</span></h2>
            <label class="field">
              <span class="field-label">デバイス</span>
              <select id="device">
                <option value="cuda" selected>cuda</option>
                <option value="cpu">cpu</option>
                <option value="auto">auto</option>
              </select>
            </label>
            <div class="field">
              <span class="field-label">入力カメラ</span>
              <div id="camera-list" class="check-list"></div>
              <p class="warn" id="camera-warn" role="status" hidden></p>
            </div>
            <label class="field" id="ref-row" hidden>
              <span class="field-label" title="2D検出を基準に3Dを再構成するカメラ">参照カメラ</span>
              <select id="ref-camera"></select>
            </label>
            <label class="field">
              <span class="field-label" title="チェックポイントの seq_len を既定値にします">フレーム窓</span>
              <input id="window" type="number" min="1" step="1" inputmode="numeric" value="1" />
              <small class="field-hint" id="window-hint">–</small>
            </label>
            <button id="run" class="primary-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" fill="currentColor" stroke="none" />
              </svg>
              <span id="run-label">推論実行</span>
            </button>
          </section>

          <section class="panel" aria-labelledby="insp-results-head">
            <h2 class="panel-head" id="insp-results-head"><span>結果</span></h2>
            <div class="results" id="results">
              <p class="empty">まだ推論を実行していません</p>
            </div>
          </section>
        </div>
      </aside>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
