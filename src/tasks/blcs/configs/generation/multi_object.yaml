mode: multi_object

# A physics landing outside the strict requested-cell tolerance rejects one
# stochastic rally proposal. Re-sample the whole source rally within this
# explicit finite budget; exhaustion remains a hard error.
maximum_physics_attempts_per_object: 64

timeline:
  min_tracks: 4
  max_tracks: 10
  max_concurrent: 4
  min_reuse_gap_frames: 8
  min_scene_frames: 512
  planning_iterations: 180
