# Canonical BLCS track-query architecture.

name: blcs_track_query

hidden_dim: 512
num_heads: 8
num_stages: 12
ffn_dim: 1408
ffn_type: swiglu
num_queries: 4
rope_dim: 64
dropout: 0.0
invisible_init_std: 0.02

mhc:
  coefficient_dim: 64
  sinkhorn_iters: 20
  eps: 1.0e-6
  residual_identity_bias: 4.0
  update_scale_init: 0.0

cswa:
  compression_ratio: 4
  window_radius: 4
  backend: cuda
