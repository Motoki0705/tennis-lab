# BLCS Model Configuration
# Decoder-Only Transformer with MHA + RoPE + SDPA

name: blcs
io:
  input_profile: single


# Architecture
hidden_dim: 256
num_layers: 6
num_heads: 8
ffn_dim: 704         # Matches the former wide FFN width
ffn_type: swiglu
dropout: 0.1
max_seq_len: 10240
invisible_init_std: 0.02

# 3-axis interleaved MROPE
rope_dim: null            # Defaults to head_dim (hidden_dim / num_heads)
rope_theta_time: 10000.0
rope_theta_camera: 10000.0
rope_theta_type: 100.0


# Output
predict_velocity: false
