# BLCS Early Fusion Model Configuration
# Single token per frame: MLP(cat(ball_uv, court_kp_flat)) -> temporal Transformer

name: blcs_early_fusion
io:
  input_profile: single


# Architecture
hidden_dim: 256
num_layers: 6
num_heads: 8
ffn_dim: null
ffn_type: swiglu
dropout: 0.1
max_seq_len: 10240
invisible_init_std: 0.02

# RoPE
rope_dim: null
rope_theta: 10000.0
yarn: null

# Output
predict_velocity: false
