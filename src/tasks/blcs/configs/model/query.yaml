# BLCS Query-based Model Configuration

name: blcs_query
io:
  input_profile: single


# Architecture
hidden_dim: 256
num_heads: 8
ffn_dim: null
dropout: 0.1
max_seq_len: 10240
num_court_tokens: 20
invisible_init_std: 0.02
query_init_std: 0.02

# Stage depths
num_ball_layers: 4
num_query2ball_layers: 2

# RoPE axes: time, entity, type (court/ball/query)
rope_dim: null
rope_theta: 10000.0
rope_theta_time: 10000.0
rope_theta_entity: 10000.0
rope_theta_type: 100.0

# Output
predict_velocity: false
