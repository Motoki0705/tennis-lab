# Multi-view BLCS model configuration
# Uses iterative query updates:
# same-time cross-attn to per-frame multi-view tokens, then temporal self-attn on query.
name: blcs_multiview
io:
  input_profile: multiview


# Final transformer dim is computed inside model:
# hidden_dim = token_dim + id_emb_dim + cam_emb_dim
token_dim: 256
id_emb_dim: 64
cam_emb_dim: 64

num_layers: 6      # Number of (same-time cross-attn + temporal self-attn) iterations
num_heads: 8
dropout: 0.1
max_seq_len: 2048
max_views: 8
predict_velocity: false
encoder_layers: 2  # Number of MLP layers in BallCourtEncoder

# Input dimensions (per view, per frame)
ball_input_dim: 2
court_kp_dim: 40

# Output dimensions
position_dim: 3
