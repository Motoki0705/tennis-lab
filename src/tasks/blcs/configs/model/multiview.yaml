# Multi-view BLCS model configuration
# Uses iterative query updates:
# same-time cross-attn to per-frame multi-view tokens, then temporal self-attn on query.
name: blcs_multiview
io:
  input_profile: multiview

hidden_dim: 512

num_layers: 8      # Number of (same-time cross-attn + temporal self-attn) iterations
num_heads: 8
ffn_dim: 1408
ffn_type: swiglu
dropout: 0.1
rope_dim: 64
rope_theta: 10000.0
rope_theta_time: 10000.0
rope_theta_camera: 1000.0
rope_theta_type: 1000.0
max_seq_len: 10240
max_num_cameras: 6
predict_velocity: true
num_court_tokens: 20
invisible_init_std: 0.02
query_init_std: 0.02
