# BLCS Multi-view Early Fusion Model Configuration
# Per camera token: MLP(cat(ball_uv, court_kp_flat, court_vis))
# Camera fusion: MLP(flatten_cameras) -> temporal token, then temporal Transformer.

name: blcs_multiview_early_fusion
io:
  input_profile: multiview


# Architecture
hidden_dim: 512
num_layers: 8
num_heads: 8
ffn_dim: null
ffn_type: swiglu
dropout: 0.1
max_seq_len: 2048
max_num_cameras: 8
invisible_init_std: 0.02

# RoPE
rope_dim: null
rope_theta: 10000.0
rope_theta_time: 10000.0

# Output
predict_velocity: true
