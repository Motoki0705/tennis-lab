# Axial multi-view BLCS model configuration
# Uses one court-ball token per (camera, time) element and alternates
# camera-wise and time-wise self-attention.
name: blcs_multiview_axial
io:
  input_profile: multiview

hidden_dim: 512

# `num_layers` is the number of camera/time stages.
num_layers: 8
camera_layers_per_stage: [1, 1, 1, 1, 1, 1, 1, 1]
time_layers_per_stage: [1, 1, 1, 1, 1, 1, 1, 1]
time_global_stage_mask: [false, false, false, false, false, false, false, false]
num_heads: 8
attention_type: mha
num_kv_heads: null
ffn_dim: null
ffn_type: swiglu
dropout: 0.1
rope_dim: null
rope_theta: 10000.0
rope_theta_time: 10000.0
rope_theta_camera: 1000.0
time_window_radius: 16
max_seq_len: 10240
max_views: 8
predict_velocity: true
invisible_init_std: 0.02
