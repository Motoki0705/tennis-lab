# Initial condition ranges
z_range: [0.8, 1.4]
speed_range: [5.0, 25.0]
azimuth_range_deg: [-30.0, 30.0]
elevation_range_deg: [5.0, 70.0]
spin_x_range: [-200.0, 200.0]
spin_y_range: [-80.0, -40.0]
spin_z_range: [-200.0, 200.0]

# Simulation parameters
max_sim_frames: 2000
output_fps: 30
sim_fps: 240

max_rallies: 10
max_total_frames: 12000
hit_timing_range: [0.2, 0.8]
return_z_range: [0.8, 1.4]
min_rally_length: 2
net_fault_accept_prob: 0.05

# Serve
serve_probability: 0.3
serve_speed_range: [30.0, 55.0]
serve_elevation_range_deg: [2.0, 10.0]
serve_z_range: [2.0, 2.8]
serve_azimuth_range_deg: [-15.0, 15.0]

# Volley / multi-bounce
volley_probability: 0.05
normal_return_probability: 0.85
late_return_probability: 0.10
