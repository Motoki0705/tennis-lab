defaults:
  - train_tracking
  - override data: tracking_camera_view_v2
  - _self_

association:
  model:
    hidden_dim: 256
    num_heads: 8
    ffn_dim: 768
    num_stages: 4
    rope_dim: 32
    num_slots: 4
    max_identities: 10
    dropout: 0.1
  limit_train_batches: 1.0
  limit_val_batches: 1.0

data:
  batch_size: 4
  seq_len_range: [512, 512]
training:
  trainer:
    max_epochs: 100
    check_val_every_n_epoch: 1
    log_every_n_steps: 10
  compile:
    enabled: false
run:
  output_dir: blcs/association_reference/${tennis_run_id:}
  test_after_fit: false
