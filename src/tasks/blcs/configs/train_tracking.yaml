defaults:
  - court_keypoints: physical_v1
  - paths: default
  - model: track_query
  - data: tracking
  - training: default
  - loss: tracking
  - tracking_metrics: default
  - run: train
  - _self_

training:
  trainer:
    max_epochs: 100
    check_val_every_n_epoch: 5
    accumulate_grad_batches: 8
  checkpoint:
    monitor: val/loss
  early_stopping:
    enabled: false
  qualitative_logging:
    enabled: true
    every_n_epochs: 10

hydra:
  run:
    dir: ${tennis_lab_path:output,${paths.output_root},${run.output_dir}}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
