defaults:
  - model: track_query
  - data: tracking
  - training: default
  - loss: tracking
  - run: train
  - _self_

training:
  checkpoint:
    monitor: val/loss
  early_stopping:
    enabled: false
  qualitative_logging:
    enabled: false

hydra:
  run:
    dir: ${run.output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
