# Gravity is fixed; the force model and surface constants live in
# src/utils/physics/ball (surfaces.py is the single source of truth).
gravity: 9.8
k_drag: 0.01
k_magnus: 0.001
# Base court surface (hard / clay / grass) of the unsampled config.
surface: hard
alpha_net: 0.3
alpha_net_cord: 0.05
alpha_fence: 0.3
net_half_thickness: 0.03
net_cord_radius: 0.03
dt: 0.00416667  # 1/240 s
use_drag: true
use_magnus: true

# Wind (default: no wind)
wind: [0.0, 0.0, 0.0]

# Per-scene perturbation ranges (null = use base value)
k_drag_range: [0.005, 0.02]
k_magnus_range: [0.0005, 0.002]
wind_speed_range: [0.0, 3.0]       # magnitude (m/s)
wind_direction_range_deg: [0.0, 360.0]  # azimuth (degrees)
# Each scene draws one of these surfaces uniformly.
surface_choices: [hard, clay, grass]
