# Adversarial-training mixin. Composed by gan_{small,base,large}, which supply
# the mandatory (???) discriminator size fields and flip `enabled` to true.
trainer:
  gradient_clip_val: null

early_stopping:
  enabled: false

gan:
  enabled: false
  target_weight: 2.0
  warmup_epochs: 10
  generator_gradient_clip_val: 1.0
  discriminator_gradient_clip_val: 1.0

  transition:
    # Deterministic epoch-based transition: pure supervised for epochs 0..49,
    # then the adversarial phase begins at epoch 50 (default max_epochs=100),
    # ramping the GAN weight over `warmup_epochs`.
    start_epoch: 50

  discriminator:
    name: trajectory_transformer
    hidden_dim: ???
    num_layers: ???
    num_heads: 4
    ffn_dim: 256
    ffn_type: swiglu
    dropout: 0.1
    rope_dim: ???
    rope_theta: 10000.0
    max_seq_len: ${model.max_seq_len}
    invalid_init_std: 0.02
    cls_init_std: 0.02
