# Adversarial-training mixin. Composed by gan_{small,base,large}, which supply
# the mandatory (???) discriminator size fields and flip `enabled` to true.
gan:
  enabled: false
  target_weight: 2.0
  warmup_epochs: 10
  generator_gradient_clip_val: 1.0
  discriminator_gradient_clip_val: 1.0

  transition:
    monitor: val/pos_error_m
    mode: min
    patience: 3
    min_delta: 1.0e-3
    min_supervised_epochs: 1

  discriminator:
    name: trajectory_transformer
    hidden_dim: ???
    num_layers: ???
    num_heads: 4
    ffn_dim: 256
    ffn_type: swiglu
    dropout: 0.1
    rope_dim: null
    rope_theta: 10000.0
    max_seq_len: ${model.max_seq_len}
    invisible_init_std: 0.02
    cls_init_std: 0.02
