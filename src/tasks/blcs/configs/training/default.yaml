# ---- Trainer (Lightning Trainer settings) ----
trainer:
  max_epochs: 20
  gradient_clip_val: 1.0
  deterministic: true
  precision: "16-mixed"
  log_every_n_steps: 50
  check_val_every_n_epoch: 1

# ---- Optimizer / schedule (LightningModule references) ----
learning_rate: 1.0e-4
weight_decay: 1.0e-5
warmup_steps: 2000
scheduler: cosine
min_lr: 1.0e-6

# ---- Loss weights ----
position_loss_weight: 1.0
velocity_loss_weight: 0.0
smoothness_loss_weight: 0.0
reprojection_loss_weight: 0.0
uv_velocity_loss_weight: 0.0

# ---- Callbacks (BaseTrainingRunner references) ----
checkpoint:
  enabled: true
  filename: "blcs-{epoch:02d}"
  monitor: val/loss
  mode: min
  save_top_k: 3
  save_last: true

early_stopping:
  enabled: true
  monitor: val/pos_error_m
  mode: min
  patience: 5
  min_delta: 1.0e-3

lr_monitor:
  enabled: true
  interval: step

# ---- Qualitative validation logging ----
qualitative_logging:
  enabled: true
  every_n_epochs: 1
  num_samples: 4
