defaults:
  - _augmentation
  - _self_

# Scene data directory (matches dataset generation default)
backend: "default"
scene_dir: "data/blcs"

# Number of court keypoints to use (first N from canonical order)
num_court_kp: 20

# DataLoader settings
batch_size: 32
num_workers: 4

# Sequence/view sampling ranges (inclusive)
seq_len_range: [64, 1024]
num_views_range: [1, 1]

# Camera selection mode: "random", "first", or camera index
camera_mode: "random"
