# Scene data directory (matches dataset generation default)
scene_dir: "data/blcs"

# Number of court keypoints to use (first N from canonical order; default: 20)
# num_court_kp: 20

# DataLoader settings
batch_size: 32
num_workers: 4
cache_max_scenes: 128

# Scene sampler settings: none | scene | mixed | chunked
scene_sampler: true
scenes_per_batch: 16
chunk_max_scenes: 64

# Sequence/view sampling ranges (inclusive)
seq_len_range: [15, 1024]
num_views_range: [1, 1]

# Camera selection mode: "random", "first", or camera index
camera_mode: "random"

# Augmentation
augmentation:
  uv_noise_std: 0.0001
  visibility_drop_prob: 0.1
  scale_range: [0.9, 1.1]
