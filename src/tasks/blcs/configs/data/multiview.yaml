# Multi-view BLCS data configuration
scene_dir: "data/blcs"

# DataLoader settings
batch_size: 8
num_workers: 4
cache_max_scenes: 128

# Scene sampler settings
scene_sampler: true
scenes_per_batch: 8
chunk_max_scenes: 64

# Sequence/view sampling ranges (inclusive)
seq_len_range: [256, 1024]
num_views_range: [1, 4]

# Camera selection mode: "random", "first", or camera index
camera_mode: "random"

# Augmentation
augmentation:
  uv_noise_std: 0.005
  visibility_drop_prob: 0.1
  scale_range: [0.9, 1.1]
