# Multi-view BLCS data configuration
scene_dir: "data/blcs"

# DataLoader settings
batch_size: 16
num_workers: 4
cache_max_scenes: 128

# Scene sampler settings: none | scene | mixed | chunked
scene_sampler_mode: none
scenes_per_batch: 1
chunk_max_scenes: 64

# Sequence/view sampling ranges (inclusive)
seq_len_range: [15, 120]
num_views_range: [2, 8]

# Camera selection mode: "random", "first", or camera index
camera_mode: "random"

# Augmentation
augmentation:
  uv_noise_std: 0.005
  visibility_drop_prob: 0.1
  scale_range: [0.9, 1.1]
