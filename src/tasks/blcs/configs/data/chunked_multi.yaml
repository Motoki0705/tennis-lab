defaults:
  - _augmentation
  - _self_

# Chunked multi-view data configuration
# Val/test are fixed from scene_dir; train chunks are generated in the background.
backend: "chunked"
scene_dir: "data/blcs"

# Number of court keypoints to use (first N from canonical order)
num_court_kp: 20

# DataLoader settings
batch_size: 4
num_workers: 4
pin_memory: true

# Sequence/view sampling ranges (inclusive)
seq_len_range: [64, 256]
num_views_range: [4, 6]

# Camera selection mode: "random", "first", or camera index
camera_mode: "random"

# Generator device
generator_device: "cpu"

# Chunk settings
chunk:
  scenes_per_chunk: 1000
  epochs_per_chunk: 5
  prefetch_chunks: 3
  chunks_dir: "data/blcs/chunks"
  generation_workers: 16  # parallel scene generation workers (must be >= 1)
