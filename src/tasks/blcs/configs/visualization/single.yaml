mode: visualize  # visualize | predict
scene_path: blcs/scenes/scene_000000
# Single-view camera index used to build predictor input.
camera: 0
cameras: null
device: auto
animation_view: 3d   # 3d | 2d (create_comparison_animation)
fps: 30.0
save: null           # Optional output file for comparison animation (e.g., .mp4, .gif)
info: false
checkpoint: blcs/single/logs/version_0/last.ckpt
# Shared scene style for animation_view=3d (parsed by
# src/tasks/base/visualization/style.py; 2D/camera views ignore it).
style:
  theme: dark          # light | dark
  show_shadow: true
  show_trail: true
  trail_length: 60
  show_hud: true
  show_minimap: true

# Shared 3D viewpoint (src/utils/rendering/camera_view.py). Unrelated to the
# input-camera selector `camera`/`cameras` above.
view_3d:
  preset: broadcast    # broadcast | side | top | corner | behind_far
  mode: static         # static | orbit | keyframes
  orbit_period_s: 24.0
  keyframes: null
