defaults:
  - _augmentation
  - _self_

backend: "chunked"

# BLCS rally NPZ directory (generated by src.tasks.blcs.scripts.generate_dataset)
scene_dir: "data/blcs"

# Number of court keypoints to use (first N from canonical order)
num_court_kp: 20

split:
  train_file: train.txt
  val_file: val.txt
  test_file: test.txt

batch_size: 32
num_workers: 4
pin_memory: true

# Camera selection: "random" or integer index
camera_mode: "random"

# Sequence/window sampling
seq_len_range: [16, 1024]

generator_device: "cpu"

chunk:
  scenes_per_chunk: 1000
  epochs_per_chunk: 3
  prefetch_chunks: 1
  chunks_dir: "data/blcs/chunks"
  generation_workers: 1

# Labels (soft targets)
label:
  sigma_frames: 2.5
  shot_time_key: "t_start"
  bounce_time_key: "t_bounce1"