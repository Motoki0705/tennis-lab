# BLCS rally NPZ directory (generated by src.tasks.blcs.scripts.generate_dataset)
scene_dir: "data/blcs"

split:
  train_file: train.txt
  val_file: val.txt
  test_file: test.txt

batch_size: 32
num_workers: 4
pin_memory: true
cache_max_scenes: 128

# Scene sampler settings: none | scene | mixed | chunked
scene_sampler: true
scenes_per_batch: 32
chunk_max_scenes: 64

# Camera selection: "random" or integer index
camera_mode: "random"

# Sequence/window sampling
seq_len_range: [16, 1024]

# Labels (soft targets)
label:
  sigma_frames: 2.5
  shot_time_key: "t_start"
  bounce_time_key: "t_bounce1"
