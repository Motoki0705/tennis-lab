defaults:
  - _augmentation_disabled
  - _self_

scene_dir: "data/blcs"

split:
  train_file: train.txt
  val_file: val.txt
  test_file: test.txt

batch_size: 32
num_workers: 4
pin_memory: true

# camera_mode is not used for 3d input_type but kept for config consistency
camera_mode: "random"

seq_len_range: [16, 1024]

label:
  sigma_frames: 2.5
  shot_time_key: "t_start"
  bounce_time_key: "t_bounce1"
