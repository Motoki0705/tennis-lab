# Visualization defaults for UV event detection.
task: uv  # uv | traj3d

mode: predict  # visualize | predict
scene_path: data/blcs/scenes/rally_000000.npz
camera: random  # random | int

fps: 30.0
save: assets/event_detection/uv/gt_vs_pred.gif

info: false
checkpoint: checkpoints/event_detection/uv/last.ckpt
output: null

# Peak extraction (predict mode)
threshold: 0.5
min_distance: 2
top_k: null
event_radius_frames: 6
event_sigma_frames: 2.5

show_court_lines: true
