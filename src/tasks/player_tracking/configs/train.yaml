model:
  hidden_dim: 64
  num_heads: 4
  ffn_dim: 128
  num_queries: 4
  num_stages: 2
  num_joints: 17
  rope_dim: 16
  dropout: 0.0
  role_rope_enabled: true

data:
  seed: 643648
  split_sizes:
    train: 96
    val: 24
    test: 24
  batch_size: 8
  num_workers: 0
  min_frames: 8
  max_frames: 12
  min_views: 2
  max_views: 3
  min_persons: 2
  max_persons: 3
  max_detections: 5
  num_joints: 17
  num_court_keypoints: 14
  detection_dropout_probability: 0.10
  joint_dropout_probability: 0.08
  false_positive_probability: 0.35
  keypoint_noise_std: 0.006

loss:
  position_weight: 1.0
  rotation_weight: 0.5
  presence_weight: 1.0
  track_smoothness_weight: 0.0
  match_position_weight: 1.0
  match_rotation_weight: 0.5
  match_presence_weight: 0.5

training:
  learning_rate: 3.0e-4
  weight_decay: 1.0e-5
  warmup_steps: 0
  min_lr: 1.0e-6
  trainer:
    max_epochs: 5
    gradient_clip_val: 1.0
    deterministic: true
    precision: "32-true"
    log_every_n_steps: 1
    check_val_every_n_epoch: 1
    limit_train_batches: null
    limit_val_batches: null
    limit_test_batches: null
    num_sanity_val_steps: 0
    enable_progress_bar: true
    enable_model_summary: false
  checkpoint:
    enabled: true
    filename: "player-tracking-{epoch:02d}"
    monitor: val/loss
    mode: min
    save_top_k: 1
    save_last: true
  early_stopping:
    enabled: false
    monitor: val/loss
    mode: min
    patience: 10
    min_delta: 0.0
  lr_monitor:
    enabled: true
    interval: step
  qualitative_logging:
    enabled: false

run:
  output_dir: outputs/player_tracking/baseline
  seed: 643648
  gpus: 1
  resume: null
  init_weights: null
  fast_dev_run: false
  dry_run: false

hydra:
  run:
    dir: ${run.output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null
  job:
    chdir: false
