repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (fix)
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        files: ^(src|tests)/
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        files: ^(src|tests)/
