defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

guardrail_dir: data/dino_workflow/guardrail/current
pseudo_dir: data/dino_workflow/pseudo/round_001
output_dir: data/dino_workflow/training_sets/round_001

guardrail_annotations_file: annotations.jsonl
pseudo_annotations_file: selected_annotations.jsonl

link_mode: symlink  # symlink, copy, hardlink
symlink_fallback_to_copy: true
overwrite: false
allow_empty_pseudo: false
validate_images: true
dry_run: false
max_missing_preview: 20

archive:
  enabled: false
  output_path: null
  overwrite: false
  compression_level: 3
  zstd_binary: auto
  max_summary_files: 50

hydra:
  run:
    dir: .
  output_subdir: null
