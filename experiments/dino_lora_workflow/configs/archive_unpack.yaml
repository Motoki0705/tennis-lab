defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

input_archive: data/dino_workflow/archives/archive.tar.zst
output_dir: data/dino_workflow/unpacked/archive

overwrite: false
strip_components: 0
safe_extract: true
verify_manifest: true
dry_run: false
zstd_binary: auto
max_summary_files: 50

hydra:
  run:
    dir: .
  output_subdir: null
