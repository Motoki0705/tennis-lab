defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

input_paths: []
output_archive: data/dino_workflow/archives/archive.tar.zst
base_dir: null

include_manifest: true
exclude_globs:
  - __pycache__
  - __pycache__/**
  - "*.pyc"
  - .DS_Store

overwrite: false
dry_run: false
compression_level: 3
zstd_binary: auto
max_summary_files: 50

hydra:
  run:
    dir: .
  output_subdir: null
