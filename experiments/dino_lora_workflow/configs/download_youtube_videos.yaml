defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

urls_file: data/dino_workflow/sources/youtube/urls.txt
output_dir: data/youtube/videos/av1
manifest_file: manifest.json

dry_run: false
skip_existing_urls: true
allow_overwrite: true
continue_on_error: false

download:
  yt_dlp_binary: auto
  format: bv*+ba/best
  merge_output_format: mp4
  remux_video: mp4
  timeout_seconds: 7200
  extra_args: []

h264:
  enabled: false
  ffmpeg_binary: ffmpeg
  video_codec: libx264
  preset: medium
  crf: 18
  pixel_format: yuv420p
  drop_audio: false
  audio_codec: aac
  audio_bitrate: 192k
  timeout_seconds: 7200

hydra:
  run:
    dir: .
  output_subdir: null
