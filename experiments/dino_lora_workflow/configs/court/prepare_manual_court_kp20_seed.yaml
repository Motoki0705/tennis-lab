defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

input_jsons:
  - data/court/data_train.json
  - data/court/data_val.json
images_dir: data/court/images
output_dir: data/dino_workflow/court/manual100

num_images: 100
seed: 42
dry_run: false

queue_file: annotation_queue.jsonl
manifest_file: manifest.json
readme_file: README.md

reuse_existing_queue: true
overwrite: false
copy_images: true
write_readme: true

hydra:
  run:
    dir: .
  output_subdir: null
