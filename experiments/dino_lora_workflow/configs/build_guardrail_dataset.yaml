defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

input_annotation_files: []
image_search_roots: []
output_dir: data/dino_workflow/guardrail/current

dry_run: false
fail_fast: true
duplicate_policy: skip  # skip, existing_overwrite, error

preserve_split: true
val_ratio: 0.1
seed: 42

preserve_label_source: true
default_label_source: guardrail
default_weight: 1.0
max_preview_rows: 20

hydra:
  run:
    dir: .
  output_subdir: null
