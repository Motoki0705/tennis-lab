defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

guardrail_dir: data/dino_workflow/guardrail/current
pseudo_dir: null
output_dir: outputs/dino/training/grounding_dino_tiny_lora_round/court_kp20_ft_0

base_model: IDEA-Research/grounding-dino-tiny
resume_adapter_dir: null
resume_adapter_archive: null
resume_adapter_unpack_dir: null

device: auto
seed: 42
num_workers: 2

epochs: 3
max_steps: 0
smoke_max_steps: 0
batch_size: 1
grad_accum: 8
learning_rate: 0.0001
weight_decay: 0.01
clip_grad_norm: 1.0
mixed_precision: auto  # auto, none, fp16, bf16

guardrail_repeat: 1
pseudo_repeat: 1
guardrail_fraction: null
pseudo_loss_weight: 0.6
respect_row_weight: true

guardrail_val_fraction: 0.1
include_val_in_train: false
eval_every_steps: 100
eval_batches: 20

freeze_vision_backbone: true
freeze_text_backbone: true
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  bias: none

save_archive: false
archive_overwrite: true

dry_run: false
skip_model_load: false
max_preview_samples: 10

hydra:
  run:
    dir: .
  output_subdir: null
