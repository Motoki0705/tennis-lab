defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

video_dir: data/youtube/videos/av1
video_manifest: data/youtube/videos/av1/manifest.json
output_dir: data/dino_workflow/sources/youtube/frames

h264_output_dir: data/youtube/videos/h264
h264_manifest_file: manifest.json

dry_run: false
fail_fast: true
skip_existing_frames: true
write_frame_entries_to_global_manifest: true

frame_stride: 30
start_frame: 0
end_frame: null
max_frames_per_video: null
jpeg_quality: 92

h264:
  enabled: true
  ffmpeg_binary: auto
  video_codec: h264_nvenc
  preset: p4
  cq: 23
  pixel_format: yuv420p
  drop_audio: true
  timeout_seconds: 7200

hydra:
  run:
    dir: .
  output_subdir: null
